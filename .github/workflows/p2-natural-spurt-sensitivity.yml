name: P2.55 bounded natural spurt source model sensitivity
on:
  pull_request:
    paths:
      - '.github/workflows/p2-natural-spurt-sensitivity.yml'
      - 'poc/source-probes/P255NaturalSpurtOpportunityTest.kt'
      - 'poc/src/p2_natural_spurt_opportunity.cjs'
      - 'poc/tests/p2_natural_spurt_opportunity.test.cjs'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  natural-spurt:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test poc/tests/p2_natural_spurt_opportunity.test.cjs
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - name: Check out pinned upstream source without modifying the simulator
        run: |
          mkdir -p "$RUNNER_TEMP/umasim"
          git -C "$RUNNER_TEMP/umasim" init -q
          git -C "$RUNNER_TEMP/umasim" remote add origin https://github.com/mee1080/umasim.git
          git -C "$RUNNER_TEMP/umasim" fetch --quiet --depth=1 origin f6e4501ee6c6c2d4ac8698e7796e309d31575bde
          git -C "$RUNNER_TEMP/umasim" checkout --quiet --detach FETCH_HEAD
          test "$(git -C "$RUNNER_TEMP/umasim" rev-parse HEAD)" = f6e4501ee6c6c2d4ac8698e7796e309d31575bde
          test "$(git -C "$RUNNER_TEMP/umasim" hash-object race/src/commonMain/kotlin/io/github/mee1080/umasim/race/calc2/SkillChecker.kt)" = 07252133a79fd0528a8cc299933239735372a720
          install -D poc/source-probes/P255NaturalSpurtOpportunityTest.kt "$RUNNER_TEMP/umasim/race/src/jvmTest/kotlin/io/github/mee1080/umasim/race/calc2/P255NaturalSpurtOpportunityTest.kt"
      - name: Run 240 natural single-runner source simulations at fixed abilities
        env:
          GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx3g
        run: |
          export P255_TRACE_OUTPUT="$GITHUB_WORKSPACE/p2-55-natural-spurt-traces.json"
          cd "$RUNNER_TEMP/umasim"
          ./gradlew :race:jvmTest --tests 'io.github.mee1080.umasim.race.calc2.P255NaturalSpurtOpportunityTest' --no-daemon --console=plain --stacktrace
          test -s "$P255_TRACE_OUTPUT"
      - name: Integrate pinned source random window geometry over observed spurt ticks
        run: node poc/src/p2_natural_spurt_opportunity.cjs p2-55-natural-spurt-traces.json p2-55-natural-spurt-summary.json
      - uses: actions/upload-artifact@v4
        with:
          name: p2-55-source-model-sensitivity-not-game-rate
          path: |
            p2-55-natural-spurt-traces.json
            p2-55-natural-spurt-summary.json
          retention-days: 14
          if-no-files-found: error
