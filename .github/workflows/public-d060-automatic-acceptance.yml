name: Public D060 automatic suitability acceptance
on:
  push:
    branches: [main]
    paths:
      - 'poc/data/skill-suitability-d059.v1.txt'
      - 'poc/src/skill_catalog.js'
      - 'poc/src/live_app.js'
      - 'poc/src/card_suitability_view.js'
      - 'poc/live.html'
      - 'poc/tests/browser_public_d060.cjs'
      - '.github/workflows/public-d060-automatic-acceptance.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  published:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          npm install --no-save --no-package-lock playwright@1.55.1
          npx playwright install --with-deps chromium
      - name: Confirm exact deployed assets and automatic labels
        run: node poc/tests/browser_public_d060.cjs . "$GITHUB_SHA"
