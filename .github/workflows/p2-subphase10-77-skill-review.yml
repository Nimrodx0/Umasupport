name: P2 balanced 77 skill half-phase random 10m audit

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'poc/tools/globalsim_subphase_random_10m.cjs'
      - 'poc/tools/skill_halfphase_two_axis_review.cjs'
      - 'poc/tools/skill_p2_36_narrow_rank_observer.cjs'
      - 'poc/tools/skill_p2_36_remaining_wd.cjs'
      - 'poc/tests/skill_p2_36_narrow_rank_observer.test.cjs'
      - 'poc/tests/skill_p2_36_remaining_wd.test.cjs'
      - 'poc/tools/p2_g3g4_skill_window_decisions.cjs'
      - 'poc/tools/p2_g3g4_combined_short_window_881.cjs'
      - 'poc/tools/p2_g4_dynamic_impact_gates.cjs'
      - 'poc/src/skill_p2_43_original_spurt_candidate_review.cjs'
      - 'poc/data/p2_condition_review_proposal.v1.json'
      - 'poc/data/p2_approved_research_scope_d051.v1.json'
      - 'poc/data/p2_remaining_condition_decisions_proposal.v1.json'
      - 'poc/src/p2_limited_study_screen.cjs'
      - 'poc/tests/p2_limited_study_screen.test.cjs'
      - 'poc/src/p2_remaining_route_review.cjs'
      - 'poc/tests/p2_remaining_route_review.test.cjs'
      - 'poc/src/p2_omission_candidate_review.cjs'
      - 'poc/tests/p2_omission_candidate_review.test.cjs'
      - 'poc/src/p2_condition_review_audit.cjs'
      - 'poc/src/p2_scope_handoff_supplement.cjs'
      - 'poc/tests/p2_scope_handoff_supplement.test.cjs'
      - 'poc/src/p2_context_logic_review.cjs'
      - 'poc/tests/p2_context_logic_review.test.cjs'
      - 'poc/src/p2_g4_occurrence_disposition.cjs'
      - 'poc/tests/p2_g4_occurrence_disposition.test.cjs'
      - 'poc/src/p2_gate_cohort_cross_audit.cjs'
      - 'poc/tests/p2_gate_cohort_cross_audit.test.cjs'
      - 'poc/src/p2_g6_research_handoff_881.cjs'
      - 'poc/src/p3_g6_research_intake.cjs'
      - 'poc/src/p3_4_uncertainty_semantics.cjs'
      - 'poc/tests/p3_4_uncertainty_semantics.test.cjs'
      - 'poc/tools/build_p3_4_uncertainty_preview.cjs'
      - 'poc/src/p3_4c_relative_bias_decision_probe.cjs'
      - 'poc/tests/p3_4c_relative_bias_decision_probe.test.cjs'
      - 'poc/tools/build_p3_4c_relative_bias_probe.cjs'
      - 'poc/src/p3_4d_selected_source_skill_review.cjs'
      - 'poc/tests/p3_4d_selected_source_skill_review.test.cjs'
      - 'poc/tools/build_p3_4d_selected_source_skill_review.cjs'
      - 'poc/tools/build_p2_g6_research_handoff.cjs'
      - 'poc/tests/p2_g6_research_handoff_881.test.cjs'
      - 'poc/tests/skill_p2_43_original_spurt_candidate_review.test.cjs'
      - 'poc/tools/audit_skill_conditions.cjs'
      - 'poc/tests/p2_g4_dynamic_impact_gates.test.cjs'
      - 'poc/tests/p2_g3g4_combined_short_window_881.test.cjs'
      - 'poc/tests/p2_g3g4_skill_window_decisions.test.cjs'
      - 'poc/tests/skill_halfphase_two_axis_review.test.cjs'
      - 'poc/src/skill_halfphase_feasibility.cjs'
      - 'poc/tools/skill_subphase10_cohort_review.cjs'
      - 'poc/tests/skill_subphase10_cohort_review.test.cjs'
      - '.github/workflows/p2-subphase10-77-skill-review.yml'

permissions:
  contents: read

jobs:
  verify-four-original-short-windows:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate exact original short random windows, 10m geometry and held logic
        run: |
          node --check poc/tools/globalsim_subphase_random_10m.cjs
          node --check poc/tools/skill_subphase10_cohort_review.cjs
          node --test poc/tests/skill_subphase10_cohort_review.test.cjs
          node --check poc/tools/skill_halfphase_two_axis_review.cjs
          node --test poc/tests/skill_halfphase_two_axis_review.test.cjs
          node --check poc/tools/skill_p2_36_narrow_rank_observer.cjs
          node --test poc/tests/skill_p2_36_narrow_rank_observer.test.cjs
          node --check poc/tools/skill_p2_36_remaining_wd.cjs
          node --test poc/tests/skill_p2_36_remaining_wd.test.cjs
          node --check poc/tools/p2_g3g4_skill_window_decisions.cjs
          node --test poc/tests/p2_g3g4_skill_window_decisions.test.cjs
          node --check poc/tools/p2_g3g4_combined_short_window_881.cjs
          node --test poc/tests/p2_g3g4_combined_short_window_881.test.cjs
          node --check poc/tools/p2_g4_dynamic_impact_gates.cjs
          node --test poc/tests/p2_g4_dynamic_impact_gates.test.cjs
          node --check poc/src/skill_p2_43_original_spurt_candidate_review.cjs
          node --test poc/tests/skill_p2_43_original_spurt_candidate_review.test.cjs
          node --check poc/src/p2_g6_research_handoff_881.cjs
          node --check poc/src/p3_g6_research_intake.cjs
          node --check poc/tools/build_p2_g6_research_handoff.cjs
          node --test poc/tests/p2_g6_research_handoff_881.test.cjs
          node --test poc/tests/p2_gate_cohort_cross_audit.test.cjs
          node --test poc/tests/p2_g4_occurrence_disposition.test.cjs
          node --test poc/tests/p2_context_logic_review.test.cjs
          node --test poc/tests/p2_scope_handoff_supplement.test.cjs
          node --check poc/src/p3_4_uncertainty_semantics.cjs
          node --check poc/tools/build_p3_4_uncertainty_preview.cjs
          node --test poc/tests/p3_4_uncertainty_semantics.test.cjs
          node --check poc/src/p3_4c_relative_bias_decision_probe.cjs
          node --check poc/tools/build_p3_4c_relative_bias_probe.cjs
          node --test poc/tests/p3_4c_relative_bias_decision_probe.test.cjs
          node --check poc/src/p3_4d_selected_source_skill_review.cjs
          node --check poc/tools/build_p3_4d_selected_source_skill_review.cjs
          node --test poc/tests/p3_4d_selected_source_skill_review.test.cjs
          node --test poc/tests/globalsim_phase_random_10m.test.cjs
          node --test poc/tests/skill_phase10_cohort_review.test.cjs
      - name: Regenerate the exact historical 53 and new 24 source candidate cohort
        env:
          UMASIM_REVISION: f6e4501ee6c6c2d4ac8698e7796e309d31575bde
        run: |
          node poc/tools/audit_skill_conditions.cjs > /tmp/p2-subphase-source.log
          node poc/tools/skill_activation_fit_v1_report.cjs \
            skill-condition-inventory-audit.json /tmp/p2-53-rechecked.json > /tmp/p2-53-recheck.log
          node - <<'NODE'
          const crypto=require('node:crypto');
          const fs=require('node:fs');
          const url='https://raw.githubusercontent.com/mee1080/umasim/f6e4501ee6c6c2d4ac8698e7796e309d31575bde/data/skill_data.txt';
          (async()=>{
           const r=await fetch(url,{signal:AbortSignal.timeout(60000)});
           if(!r.ok)throw Error('Pinned source HTTP '+r.status);
           const data=Buffer.from(await r.arrayBuffer());
           if(crypto.createHash('sha256').update(data).digest('hex')!==
            '4c036527bbe6b5aad34d7f12110a06094c9071514e37fdfc68ae195403333be5')
            throw Error('Pinned source skill dictionary SHA changed');
           fs.writeFileSync('/tmp/p2-fixed-skill-source.txt',data);
           const audit=JSON.parse(fs.readFileSync('skill-condition-inventory-audit.json'));
           const rows=JSON.parse(data.toString('utf8'));
           const source=require('./poc/tools/skill_phase10_cohort_review.cjs');
           const items=source.strictCohorts(audit,rows);
           if(items.length!==77||items.filter(x=>x.cohort==='old53').length!==53||
            items.filter(x=>x.cohort==='new24').length!==24)
            throw Error('Fixed 53+24 source cohort changed');
           console.log('Exactly 77 original source-verified skills');
          })().catch(e=>{console.error(e.stack||e);process.exitCode=1});
          NODE
      - name: Check out exactly the same frozen GlobalSim v77 commit as original model
        run: |
          mkdir -p /tmp/globalsim
          cd /tmp/globalsim
          git init -q
          git remote add origin https://github.com/daftuyda/GlobalSim.git
          git fetch -q --depth 1 origin 80b54cacf174b54ff6f7ca27ee7f88b5856c0bd1
          git checkout -q --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "80b54cacf174b54ff6f7ca27ee7f88b5856c0bd1"
          cargo build --release --locked
      - name: Replay SAME balanced 720 races and generate paired 4-phase plus 4-short-window models
        run: |
          mkdir -p /tmp/p2-subphase
          node --max-old-space-size=4096 poc/tools/globalsim_subphase_random_10m.cjs \
            /tmp/globalsim/examples/v77-race.jsonl \
            /tmp/globalsim/target/release/race_engine_rs_v2 \
            /tmp/p2-subphase/full-phase-reference.json \
            /tmp/p2-subphase/short-phase.json 30 \
            /tmp/p2-subphase/split15.json \
            /tmp/p2-subphase/narrow-order-rank.json \
            > /tmp/p2-subphase/replay.log
      - name: Verify previous published FULL phase 720 race report unchanged by paired replay
        run: |
          node - <<'NODE'
          const assert=require('node:assert/strict');
          const fs=require('node:fs');
          const crypto=require('node:crypto');
          const bytes=fs.readFileSync('/tmp/p2-subphase/full-phase-reference.json');
          const sha=crypto.createHash('sha256').update(bytes).digest('hex');
          assert.equal(sha,
           'f512e24b2987ccd642f17f21f92865e965a43b90985ef37d622f1ae2f2ec9e58');
          const x=JSON.parse(fs.readFileSync('/tmp/p2-subphase/short-phase.json'));
          assert.equal(x.simulations,720);
          assert.equal(x.contextsPerWindow,24);
          assert.equal(x.windowBands,44);
          assert.equal(x.perContextRows,4224);
          assert.equal(crypto.createHash('sha256').update(
           fs.readFileSync('/tmp/p2-subphase/short-phase.json')).digest('hex'),
           '206d9db77299189f91fea649a40effbe9ca2d2203c9d0b69c7873bfacee04c27');
          const halves=JSON.parse(fs.readFileSync('/tmp/p2-subphase/split15.json'));
          assert.equal(halves.baseRaces,720);
          assert.equal(halves.seedsPerHalf,15);
          assert.equal(halves.perContextRows,8448);
          assert.equal(x.windows.length,4);
          assert(x.contextRows.every(z=>z.runners>=30&&
           z.random10mOpportunityPercent+1e-6>=z.pointPercent));
          console.log('Same source, same seeds: full reference exact SHA; short windows 44 groups');
          NODE
      - name: Reuse fixed 720 race short-window evidence for 75 source skills W and D
        run: |
          node poc/tools/skill_halfphase_two_axis_review.cjs \
            /tmp/p2-subphase/short-phase.json \
            /tmp/p2-subphase/split15.json \
            p2-halfphase-feasibility.json \
            /tmp/p2-subphase/two-axis75.json \
            > /tmp/p2-subphase/two-axis75.log
          node - <<'NODE'
          const assert=require('node:assert/strict');
          const crypto=require('node:crypto');
          const fs=require('node:fs');
          const bytes=fs.readFileSync('/tmp/p2-subphase/two-axis75.json');
          const x=JSON.parse(bytes);
          assert.equal(x.schemaVersion,1);
          assert.equal(x.status,'P2.28-balanced-two-axis-source-short-window-model-not-game-proc');
          assert.equal(x.source.originalModelRaces,720);
          assert.equal(x.summary.directCandidates,75);
          assert.equal(x.summary.modeled+x.summary.heldRaceQualifiers,75);
          assert(x.items.every(x=>x.status==='held-source-race-qualifier'||
           x.status==='model-two-axis-partial-original-condition-only'));
          for(const s of x.items.filter(s=>s.styles)){
           assert.equal(s.pairs.length,6);
           for(const [style,values] of Object.entries(s.styles)){
            assert(!Object.hasOwn(values,'actualSkillProcProbability'));
            if(values.status!=='model-contexts-only')continue;
            for(const cell of values.detail){
             for(const part of ['all','first15','last15']){
              const x=cell[part];
              assert(Math.abs(x.D-(x.O-x.U))<0.00001);
              assert(x.W+0.00001>=x.O);
             }
            }
           }
          }
          const sha=crypto.createHash('sha256').update(bytes).digest('hex');
          assert.equal(sha,'10dcb03daf7ecab60ed88694b6ba2d465291aeda460adcb8a9bd74556c928e14',
           'Pinned 75-skill W/D evidence changed');
          assert.equal(x.summary.modeled,69);
          assert.equal(x.summary.heldRaceQualifiers,6);
          assert.equal(x.summary.modeledPairs,234);
          assert.equal(x.summary.stableW,185);
          assert.equal(x.summary.heldW,49);
          assert.equal(x.summary.stableD,185);
          assert.equal(x.summary.skillsWithStableWPair,39);
          const modeled=x.items.filter(v=>v.styles);
          const styles=['Nige','Senkou','Sasi','Oikomi'];
          const eligibleCount=v=>styles.filter(s=>
           v.styles[s].status==='model-contexts-only').length;
          assert.equal(modeled.filter(v=>eligibleCount(v)===4).length,39);
          assert.equal(modeled.filter(v=>eligibleCount(v)===1).length,30);
          const signs=modeled.flatMap(v=>styles.map(s=>v.styles[s])
           .filter(e=>e.status==='model-contexts-only')
           .map(e=>e.deviationDirection.direction));
          assert.equal(signs.length,186);
          assert.equal(signs.filter(s=>s==='+'||s==='-').length,183);
          assert.equal(modeled.filter(v=>v.pairs.every(p=>
           p.WDirection?.direction==='+'||p.WDirection?.direction==='-')).length,2);
          assert(x.items.filter(v=>v.status==='held-source-race-qualifier')
           .every(v=>v.heldReasons.includes('unsupported-source-ground-type')));
          console.log('P2.28_TWO_AXIS_REPORT_SHA256='+sha);
          console.log('P2.28_TWO_AXIS_REPORT_SUMMARY_START');
          console.log(JSON.stringify({source:x.source,summary:x.summary},null,2));
          console.log('P2.28_TWO_AXIS_REPORT_SUMMARY_END');
          NODE
      - name: Connect fixed P2.28 W/D to original 881-skill G3/G4 decisions, without extra simulation
        run: |
          node poc/tools/p2_g3g4_skill_window_decisions.cjs \
            p2-skill-coarse-four-style-review.json \
            /tmp/p2-subphase/two-axis75.json \
            /tmp/p2-subphase/p2-g3g4-881-skill-decision-review.json
          node - <<'NODE'
          const assert=require('node:assert/strict');
          const fs=require('node:fs');
          const x=JSON.parse(fs.readFileSync(
           '/tmp/p2-subphase/p2-g3g4-881-skill-decision-review.json','utf8'));
          assert.equal(x.summary.appSkills,881);
          assert.equal(x.summary.sourceMatched,818);
          assert.equal(x.summary.shortWindowSourceCandidates,75);
          assert.equal(x.summary.conditionalModelEvidenceSkills,69);
          assert.equal(x.summary.heldGroundQualifierSkills,6);
          assert.equal(x.summary.otherSkillsWithoutNewShortWindowEvidence,806);
          assert.equal(x.summary.oneOriginalAllowedStyleSkills,30);
          assert.equal(x.summary.fourOriginalAllowedStylesSkills,39);
          assert.equal(x.summary.modelComparableWPairs,234);
          assert.equal(x.summary.stableModelWPairs,185);
          assert.equal(x.summary.heldModelWPairs,49);
          assert.equal(x.summary.productSkillSuitabilityScores,0);
          assert(x.rows.every(r=>r.eligibleForP3CardScoring===false&&
           r.cardScore===null&&r.wholeSkillSuitability==='not-established'));
          const known=x.rows.find(r=>r.sourceNumericId==='202072');
          assert(known&&known.decision==='conditionally-use-short-window-rank-evidence');
          const dirt=x.rows.find(r=>r.sourceNumericId==='202951');
          assert(dirt&&dirt.decision==='hold-turf-model-transfer');
          console.log('P2_G3G4_VERIFIED_ORIGINAL_SKILL_DECISION_SUMMARY='+JSON.stringify(x.summary));
          NODE
      - name: P2.36 evaluate 10 exact distance OR and 2 narrow original-rank source skills from SAME fixed model
        run: |
          node poc/tools/skill_p2_36_remaining_wd.cjs \
            /tmp/p2-subphase/short-phase.json \
            /tmp/p2-subphase/split15.json \
            p2-halfphase-feasibility.json \
            p2-35-short-window-source-logic-decisions.json \
            /tmp/p2-subphase/narrow-order-rank.json \
            /tmp/p2-subphase/remaining12-wd.json
          node - <<'NODE'
          const assert=require('node:assert/strict'),fs=require('node:fs');
          const x=JSON.parse(fs.readFileSync('/tmp/p2-subphase/remaining12-wd.json'));
          assert.equal(x.schemaVersion,1);
          assert.equal(x.status,require('./poc/tools/skill_p2_36_remaining_wd.cjs').STATUS);
          assert.equal(x.summary.originalExceptionSkills,12);
          assert.equal(x.summary.distanceORSpecialists,10);
          assert.equal(x.summary.narrowedRankSkills,2);
          assert.equal(x.summary.originalDistanceScopedBranches,22);
          assert.equal(x.summary.distinctOriginalModeledProfiles,11);
          assert.equal(x.summary.modelComparableStylePairs,132);
          assert.equal(x.summary.modelStableWPairs,102);
          assert.equal(x.summary.heldWPairs,30);
          assert.equal(x.summary.modelStableDPairs,102);
          assert.equal(x.summary.modelStableWPairs+x.summary.heldWPairs,132);
          assert.equal(x.summary.eligibleForP3CardScores,0);
          assert(x.rows.every(r=>r.productSkillScore===null&&
           r.wholeSkillSuitability==='not-established'));
          assert(x.rows.filter(r=>r.branchAnalyses.length===2).length===10);
          assert(x.rows.filter(r=>r.branchAnalyses.length===1).length===2);
          assert(x.rows.flatMap(r=>r.branchAnalyses).every(b=>
           b.productSkillScore===null&&b.modelOnly===true));
          console.log('P2_36_FIXED_SOURCE_TWO_AXIS_SUMMARY='+JSON.stringify(x.summary));
          console.log('P2_36_EXAMPLE_PROFILES='+JSON.stringify(x.rows.filter((r,i)=>
           [0,10].includes(i)).map(r=>({name:r.skillName,branches:r.branchAnalyses.map(b=>({
            distance:b.distanceType,window:b.windowKey,band:b.bandId,
            courses:b.modelCourses,
            W:Object.fromEntries(Object.entries(b.styles).map(([k,v])=>[k,v.WPercent])),
            stablePairs:b.pairs.filter(p=>
             p.modelWDirection.direction!==null).map(p=>[p.first,p.second,p.modelWDirection.direction])
           }))}))));
          NODE
      - name: P2.41 join P2.34 and P2.36 into one 881 original-skill conditional W/D ledger
        run: |
          node poc/tools/p2_g3g4_combined_short_window_881.cjs             /tmp/p2-subphase/p2-g3g4-881-skill-decision-review.json             /tmp/p2-subphase/remaining12-wd.json             /tmp/p2-subphase/p2-41-combined-881-partial-evidence.json
          node - <<'NODE'
          const assert=require('node:assert/strict'),fs=require('node:fs');
          const x=JSON.parse(fs.readFileSync(
           '/tmp/p2-subphase/p2-41-combined-881-partial-evidence.json','utf8'));
          assert.equal(x.status,require('./poc/tools/p2_g3g4_combined_short_window_881.cjs').STATUS);
          const s=x.summary;
          assert.equal(s.appSkills,881);
          assert.equal(s.sourceMatched,818);
          assert.equal(s.directlyModeledSourceSkills,69);
          assert.equal(s.sourceExceptionModeledSkills,12);
          assert.equal(s.uniqueSourceSkillsWithConditionalPartialWDEvidence,81);
          assert.equal(s.heldOriginalGroundQualifierSkills,6);
          assert.equal(s.otherSkillsWithoutThisSpecificWindowEvidence,794);
          assert.equal(s.distanceOrSkills,10);
          assert.equal(s.narrowRankSkills,2);
          assert.equal(s.originalExceptionDistanceBranches,22);
          assert.equal(s.p234ComparableSkillPairs,234);
          assert.equal(s.p234StableSkillWPairs,185);
          assert.equal(s.p234HeldSkillWPairs,49);
          assert.equal(s.p236ComparableBranchPairs,132);
          assert.equal(s.p236StableBranchWPairs,102);
          assert.equal(s.p236HeldBranchWPairs,30);
          assert.equal(s.p236StableBranchDPairs,102);
          assert.equal(s.originalFullSkillANDProven,0);
          assert.equal(s.eligibleForP3CardScores,0);
          assert.equal(s.productSkillSuitabilityScores,0);
          assert.equal(new Set(x.rows.map(r=>r.skillId)).size,881);
          assert(x.rows.every(r=>r.cardScore===null&&
           r.eligibleForP3CardScoring===false&&r.wholeSkillSuitability==='not-established'));
          const exceptions=x.rows.filter(r=>
           r.decision==='conditionally-use-source-exception-branch-W-D');
          assert.equal(exceptions.length,12);
          assert.equal(exceptions.reduce((n,r)=>n+r.sourceBranchEvidence.length,0),22);
          assert(exceptions.every(r=>r.sourceBranchEvidence.every(b=>
           b.styles.Nige.WPercent&&b.styles.Nige.DPoints&&b.scope.fixedDistanceScopeOnly)));
          const narrow=x.rows.find(r=>r.sourceNumericId==='200991');
          assert(narrow&&narrow.sourceBranchEvidence[0].sourceDistanceType===1);
          const dirt=x.rows.find(r=>r.sourceNumericId==='202951');
          assert(dirt&&dirt.decision==='hold-turf-model-transfer');
          console.log('P2_41_VERIFIED_COMBINED_SKILL_COHORT='+JSON.stringify(s));
          NODE
      - name: P2.42 screen source-exact G4 dynamic-state predicates and preserve holds
        run: |
          node poc/tools/p2_g4_dynamic_impact_gates.cjs \
            /tmp/p2-subphase/p2-41-combined-881-partial-evidence.json \
            p2-32-source-route-research-queue.json \
            p2-37-dynamic-state-source-evidence.json \
            /tmp/p2-subphase/p2-42-dynamic-impact-source-routes.json
          node - <<'NODE'
          const assert=require('node:assert/strict'),fs=require('node:fs');
          const x=JSON.parse(fs.readFileSync(
           '/tmp/p2-subphase/p2-42-dynamic-impact-source-routes.json','utf8'));
          const s=x.denominators;
          assert.equal(x.status,
           require('./poc/tools/p2_g4_dynamic_impact_gates.cjs').STATUS);
          assert.equal(s.appSkills,881);
          assert.equal(s.sourceMatchedSkills,818);
          assert.equal(s.sourceUnavailableSkills,63);
          assert.equal(s.allOriginalRouteFamilies,970);
          assert.equal(s.sourceSkillsWithConditionalP241PartialWD,81);
          for(const [type,skills,routes] of [
