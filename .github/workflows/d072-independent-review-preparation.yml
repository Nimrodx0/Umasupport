name: D072 independent review preparation
on:
  workflow_dispatch:
    inputs:
      evidence:
        description: JSON array of independently reviewed facts only, no raw source or secrets
        type: string
        required: true
permissions:
  contents: read
jobs:
  prepare:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify read-only preparation
        run: node --test poc/tests/d072_review_preparation_report.test.cjs
      - uses: actions/github-script@v7
        with:
          script: |
            const fs=require('node:fs');
            const {prepareReport}=require('./poc/src/d072_review_preparation_report.cjs');
            if(context.eventName!=='workflow_dispatch'||context.ref!=='refs/heads/main')throw Error('main dispatch only');
            const input=context.payload.inputs?.evidence;
            if(typeof input!=='string'||input.length>60000)throw Error('bounded independent evidence required');
            const report=await prepareReport({github,...context.repo,baseSha:context.sha,
              catalogText:fs.readFileSync('poc/data/reviewed_events.v1.json','utf8'),evidence:JSON.parse(input)});
            core.info('D072_APPROVAL_TARGETS='+JSON.stringify(report));
            await core.summary.addHeading('Approval targets (not approvals)')
              .addTable([[{data:'Card ID',header:true},{data:'Event ID',header:true},{data:'Event SHA-256',header:true}],
                ...report.cards.flatMap(c=>c.events.map(e=>[c.cardId,e.eventId,e.sha256]))])
              .addRaw('Required individual checks: '+report.requiredChecks.join(', ')+'. No publication approval or write performed.').write();
