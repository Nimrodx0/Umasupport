name: P2.57 native neighbour and passing model states
on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/p2-native-neighbour-model.yml'
      - 'poc/src/p2_native_neighbour_model.cjs'
      - 'poc/tests/p2_native_neighbour_model.test.cjs'
permissions:
  contents: read
jobs:
  native-neighbour:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test poc/tests/p2_native_neighbour_model.test.cjs
      - name: Recreate pinned original cohort and source references
        env:
          UMASIM_REVISION: f6e4501ee6c6c2d4ac8698e7796e309d31575bde
        run: |
          node poc/tools/audit_skill_conditions.cjs > /tmp/p2-57-inventory.log
          mkdir -p /tmp/p2-57-uma /tmp/p2-57-engine /tmp/p2-57-report
          git -C /tmp/p2-57-uma init -q
          git -C /tmp/p2-57-uma remote add origin https://github.com/mee1080/umasim.git
          git -C /tmp/p2-57-uma fetch --quiet --depth 1 origin f6e4501ee6c6c2d4ac8698e7796e309d31575bde
          git -C /tmp/p2-57-uma checkout --quiet --detach FETCH_HEAD
          test "$(git -C /tmp/p2-57-uma rev-parse HEAD)" = f6e4501ee6c6c2d4ac8698e7796e309d31575bde
      - name: Build the original and instrumented fixed GlobalSim
        run: |
          git -C /tmp/p2-57-engine init -q
          git -C /tmp/p2-57-engine remote add origin https://github.com/daftuyda/GlobalSim.git
          git -C /tmp/p2-57-engine fetch --quiet --depth 1 origin 80b54cacf174b54ff6f7ca27ee7f88b5856c0bd1
          git -C /tmp/p2-57-engine checkout --quiet --detach FETCH_HEAD
          test "$(git -C /tmp/p2-57-engine rev-parse HEAD)" = 80b54cacf174b54ff6f7ca27ee7f88b5856c0bd1
          (cd /tmp/p2-57-engine && cargo build --release --locked)
          cp /tmp/p2-57-engine/target/release/race_engine_rs_v2 /tmp/p2-57-report/original
          node poc/src/p2_native_neighbour_model.cjs patch /tmp/p2-57-engine
          git -C /tmp/p2-57-engine diff --name-only | sort > /tmp/p2-57-report/modified
          printf 'src/activation_conditions.rs\nsrc/lib.rs\nsrc/race_field.rs\nsrc/race_field_retail.rs\n' | cmp - /tmp/p2-57-report/modified
          (cd /tmp/p2-57-engine && cargo build --release --locked)
          cp /tmp/p2-57-engine/target/release/race_engine_rs_v2 /tmp/p2-57-report/probe
      - name: Reuse 32 fixed multi-runner races for native neighbour source logic
        run: |
          base=/tmp/p2-57-uma/race/src/commonMain/kotlin/io/github/mee1080/umasim/race/calc2
          node --max-old-space-size=4096 poc/src/p2_native_neighbour_model.cjs replay \
            /tmp/p2-57-engine/examples/v77-race.jsonl \
            /tmp/p2-57-report/original /tmp/p2-57-report/probe \
            /tmp/p2-57-uma/data/skill_data.txt p2-32-source-route-research-queue.json \
            "$base/SkillChecker.kt" "$base/RaceState.kt" "$base/RaceCalculator.kt" \
            /tmp/p2-57-report/summary.json
      - uses: actions/upload-artifact@v4
        with:
          name: p2-57-native-neighbour-projection
          path: /tmp/p2-57-report/summary.json
          retention-days: 14
          if-no-files-found: error
