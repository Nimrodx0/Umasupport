name: P2 activation-condition fit v1.3 source-verified 53-skill research

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'poc/src/skill_activation_fit_v1.cjs'
      - 'poc/tools/rank_band_fit_population_audit.cjs'
      - 'poc/tests/rank_band_fit_population_audit.test.cjs'
      - 'poc/data/p2_rank_band_model_direction.v1.json'
      - 'poc/tools/verify_rank_band_model_evidence.cjs'
      - 'poc/data/p2_subphase_model_direction.v1.json'
      - 'poc/tools/verify_subphase_model_direction.cjs'
      - 'poc/tests/skill_activation_fit_v1.test.cjs'
      - 'poc/tools/skill_activation_fit_v1_report.cjs'
      - 'poc/tests/skill_activation_fit_v1_report.test.cjs'
      - '.github/workflows/skill-activation-fit-v1.yml'
permissions:
  contents: read

jobs:
  source-fit-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test six fit statuses, source OR/AND, style restrictions and full 53-item coverage
        run: |
          node --check poc/src/skill_activation_fit_v1.cjs
          node --check poc/tools/skill_activation_fit_v1_report.cjs
          node --test poc/tests/skill_activation_fit_v1.test.cjs poc/tests/skill_activation_fit_v1_report.test.cjs poc/tests/rank_band_fit_population_audit.test.cjs
      - name: Rebuild original source condition cohort at pinned UmaSim revision
        env:
          UMASIM_REVISION: f6e4501ee6c6c2d4ac8698e7796e309d31575bde
        run: |
          node poc/tools/audit_skill_conditions.cjs > /tmp/p2-source-review.log
      - name: Apply research-only v1 fit to 53 reviewed skills without changing published data
        run: |
          mkdir -p /tmp/p2-style-fit-v1
          node poc/tools/skill_activation_fit_v1_report.cjs \
            skill-condition-inventory-audit.json \
            /tmp/p2-style-fit-v1/activation-fit-v1-53.json
      - name: Verify v1 source cohort and reference skill labels did not drift
        run: |
          node - <<'NODE'
          const assert=require('node:assert/strict');
          const fs=require('node:fs');
          const r=JSON.parse(fs.readFileSync(
            '/tmp/p2-style-fit-v1/activation-fit-v1-53.json','utf8'));
          assert.equal(r.counts.skills,53);
          assert.equal(r.counts.styleCases,212);
          assert.equal(r.ruleVersion,'activation-condition-fit-v1.3');
          assert.deepEqual(r.counts.byStatus,{
            high:106,low:106,dependent:0,neutral:0,held:0,ineligible:0
          });
          assert.equal(r.counts.subphaseEvidenceSkills,22);
          assert.equal(r.counts.subphaseEvidenceResolvedSkills,22);
          assert.deepEqual([
            r.counts.terrainRaceGateSkills,
            r.counts.terrainRaceGateResolvedSkills,
            r.counts.terrainRaceGateStillHeldSkills
          ],[9,9,0]);
          assert.equal(Object.values(r.counts.byStatus)
            .reduce((sum,n)=>sum+n,0),212);
          assert.equal(r.counts.byStatus.dependent,0);
          assert.equal(r.counts.byStatus.neutral,0);
          assert.equal(r.counts.byStatus.ineligible,0);
          for(const [id,expect] of Object.entries({
            '201052':['high','high','low','low'],
            '200702':['low','low','high','high'],
            '200681':['high','high','low','low'],
            '200691':['low','low','high','high'],
            '202011':['high','high','low','low'],
            '202261':['high','high','low','low'],
            '202951':['high','high','low','low'],
            '204511':['high','high','low','low'],
            '202311':['high','high','low','low'],
            '202312':['high','high','low','low'],
            '202841':['high','high','low','low'],
            '202842':['high','high','low','low'],
            '203972':['high','high','low','low'],
            '202262':['high','high','low','low'],
            '202952':['high','high','low','low']
          })){
            const skill=r.items.find(x=>x.sourceNumericId===id);
            assert(skill,'Missing source skill '+id);
            assert.deepEqual(['逃げ','先行','差し','追込']
              .map(s=>skill.styles[s].status),expect);
            if(['200681','200691','202011','202261','202951',
              '204511','202262','202952'].includes(id)){
              const proof=skill.styles['逃げ'].branches[0].modelSubphaseEvidence;
              assert(proof,'Missing audited source-window proof '+id);
              assert.equal(proof.modelContexts,72);
              assert.equal(proof.bothSeedHalvesFrontAhead,72);
            }
            if(['202311','202312','202841','202842','203972'].includes(id)){
              const branch=skill.styles['逃げ'].branches[0];
              assert(branch.raceRequirements.some(c=>
                c.type==='ground_type'&&c.operator==='=='&&c.value===2));
              assert.equal(branch.surfaceTransfer.status,
                'provisional-cross-surface-direction-not-verified');
            }
          }
          NODE
      - name: Audit all original 2162 skills for strict new model rank-band coverage
        run: |
          node - <<'NODE'
          const fs=require('node:fs');
          const crypto=require('node:crypto');
          const url='https://raw.githubusercontent.com/mee1080/umasim/f6e4501ee6c6c2d4ac8698e7796e309d31575bde/data/skill_data.txt';
          fetch(url).then(async r=>{
            if(!r.ok)throw Error('Pinned source HTTP '+r.status);
            const bytes=Buffer.from(await r.arrayBuffer());
            if(crypto.createHash('sha256').update(bytes).digest('hex')!==
              '4c036527bbe6b5aad34d7f12110a06094c9071514e37fdfc68ae195403333be5')
              throw Error('Source SHA changed');
            fs.writeFileSync('/tmp/p2-style-fit-v1/skill_data_source_only.txt',bytes);
          }).catch(e=>{console.error(e);process.exitCode=1});
          NODE
          node poc/tools/rank_band_fit_population_audit.cjs \
            /tmp/p2-style-fit-v1/skill_data_source_only.txt \
            /tmp/p2-style-fit-v1/full-source-rank-band-fit-summary.json
          rm -f /tmp/p2-style-fit-v1/skill_data_source_only.txt
      - name: Save narrow derived skill status report, not raw third-party dictionary
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: source-matched-activation-condition-fit-v1
          path: |
            /tmp/p2-style-fit-v1/activation-fit-v1-53.json
            /tmp/p2-style-fit-v1/full-source-rank-band-fit-summary.json
          retention-days: 14
