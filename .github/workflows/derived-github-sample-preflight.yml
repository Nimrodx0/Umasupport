name: Limited derived-GitHub source to app draft sample

on:
  pull_request:
    paths:
      - 'poc/src/derived_github_runtime_draft.cjs'
      - 'poc/src/derived_github_staging_bridge.cjs'
      - 'poc/src/derived_github_existing_converter_adapter.cjs'
      - 'poc/src/gametora_app_schema_dry_run.cjs'
      - 'poc/src/gametora_event_skill_crosswalk.cjs'
      - 'poc/src/new_card_event_incremental.cjs'
      - 'poc/src/derived_github_card_event_preflight.cjs'
      - '.github/workflows/derived-github-sample-preflight.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  four-pinned-cards-read-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Download pinned GitHub source metadata and four historical sample cards
        env:
          PIN: 62ec54e754f903e347da807d30aad40e53d794d2
          SKILL_PIN: 910dd79f046710245e0cc88a09c5c92b1044897e
        run: |
          curl -fLSs --retry 1 --max-time 35 \
            "https://api.github.com/repos/systemless10/UmamusumePS/git/trees/$PIN?recursive=1" \
            -o "$RUNNER_TEMP/source-tree.json"
          for id in 10016 20075 30010 30030; do
            curl -fLSs --retry 1 --max-time 35 \
              "https://raw.githubusercontent.com/systemless10/UmamusumePS/$PIN/server/data/events/gametora/support_${id}.json" \
              -o "$RUNNER_TEMP/card-${id}.json"
          done
          curl -fLSs --retry 1 --max-time 35 \
            "https://raw.githubusercontent.com/mee1080/umasim/$SKILL_PIN/data/skill_data.txt" \
            -o "$RUNNER_TEMP/numeric-skills.txt"
      - name: Apply exact blob check, source schema projection and quarantine (no source prose)
        env:
          PIN: 62ec54e754f903e347da807d30aad40e53d794d2
          SKILL_PIN: 910dd79f046710245e0cc88a09c5c92b1044897e
        run: |
          node - <<'NODE'
          'use strict';
          const fs=require('node:fs');
          const {planDerivedNewCardIntake}=require('./poc/src/derived_github_new_card_source_plan.cjs');
          const {projectExistingConverterForNewCard}=require('./poc/src/derived_github_existing_converter_adapter.cjs');
          const folder=process.env.RUNNER_TEMP;
          const tree=JSON.parse(fs.readFileSync(folder+'/source-tree.json','utf8'));
          const skillText=fs.readFileSync(folder+'/numeric-skills.txt','utf8');
          // Representative R/SR/SSR historical source samples only.
          // None of them is claimed to be a newly released card.
          const samples=[];
          for(const id of ['10016','20075','30010','30030']){
            const sourceText=fs.readFileSync(folder+'/card-'+id+'.json','utf8');
            const plan=planDerivedNewCardIntake({
              discovery:{dataKind:'new-umamusume-support-card-ids',schemaVersion:1,
                publicationApproved:false,addedCardIds:[id],
                existingCardIds:['30001']},
              existingCatalog:{schemaVersion:1,cards:[]},
              sourceTree:tree,sourceCommit:process.env.PIN
            });
            if(JSON.stringify(plan.candidateIds)!==JSON.stringify([id]))
              throw Error('Historical sample missing from exact structured GitHub tree');
            const result=projectExistingConverterForNewCard({plan,cardId:id,sourceText,
              skillText,skillRevision:process.env.SKILL_PIN});
            const c=result.census;
            if(c.sourceEvents<1||
               c.sourceEvents!==c.modeledEvents+c.excludedEvents||
               result.publicationApproved!==false||
               result.completeCardReadyForPublication!==false||
               result.sourceLabelsCopied!==false)
              throw Error('Source event census or quarantine changed');
            const reasons={};
            for(const item of result.pendingEvents)
              reasons[item.reason]=(reasons[item.reason]||0)+1;
            samples.push({id,sourceEvents:c.sourceEvents,
              modeledEvents:c.modeledEvents,
              quarantinedEvents:c.excludedEvents,
              reviewItems:c.reviewItems,
              quarantineReasons:reasons});
          }
          console.log('DERIVED_GITHUB_APP_DRAFT_SAMPLES='+JSON.stringify({
            samples,publicationApproved:false,
            sourceSemanticsIndependentlyVerified:false
          }));
          const {discoverNewCards}=require('./poc/src/new_card_event_incremental.cjs');
          const {stageDerivedGitHubNewCards}=require('./poc/src/derived_github_staging_bridge.cjs');
          const discovery=discoverNewCards({
            previousRosterIds:['30001'],
            currentRosterIds:['30001','10016','20075','30010','30030']
          });
          const existingCatalog={schemaVersion:1,cards:[]};
          const sourcePlan=planDerivedNewCardIntake({
            discovery,existingCatalog,sourceTree:tree,
            sourceCommit:process.env.PIN
          });
          const sourceDocuments=Object.fromEntries(['10016','20075','30010','30030']
            .map(id=>[id,fs.readFileSync(folder+'/card-'+id+'.json','utf8')]));
          const staged=stageDerivedGitHubNewCards({
            discovery,existingCatalog,sourcePlan,sourceDocuments,skillText,
            skillRevision:process.env.SKILL_PIN
          });
          if(JSON.stringify(staged.newlyModeledCardIds)!==
               JSON.stringify(['10016','20075'])||
             JSON.stringify(staged.stage.pending.map(x=>x.cardId))!==
               JSON.stringify(['30010','30030'])||
             staged.carryForwardPendingIds.length!==4||
             staged.publicationApproved!==false||
             staged.stage.ready.some(c=>c.events.some(e=>
               e.sourceKind!=='derived-github-unreviewed')))
            throw Error('Structured GitHub append staging did not quarantine or carry IDs');
          console.log('DERIVED_GITHUB_PRIVATE_NEW_CARD_STAGING='+JSON.stringify({
            technicallyModelableCards:staged.newlyModeledCardIds,
            incompleteCards:staged.stage.pending.map(x=>x.cardId),
            keepPendingUntilReviewed:staged.carryForwardPendingIds.length,
            publicationApproved:false,syntheticHistoricalNewCardFixture:true
          }));
          NODE
