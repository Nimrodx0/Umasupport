name: P3 D-052 initial approved scoped suitability
on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/p3-d052-initial-labels.yml'
      - 'poc/data/p3_approved_suitability_policy_d052.v1.json'
      - 'poc/src/p2_d052_approved_receipt.cjs'
      - 'poc/src/p3_approved_scope_labels.cjs'
      - 'poc/src/skill_suitability.js'
      - 'poc/src/skill_catalog.js'
      - 'poc/tests/skill_catalog.test.cjs'
      - 'poc/tests/browser_fixed_skill_catalog.cjs'
      - 'poc/tests/browser_public_label_drift.cjs'
      - 'poc/live.html'
      - 'poc/src/live_app.js'
      - 'poc/src/style.css'
      - 'poc/tools/export_d052_catalog_labels.cjs'
      - 'poc/src/card_suitability_view.js'
      - 'poc/tests/card_suitability_view.test.cjs'
      - 'poc/tools/audit_p3_card_suitability_view.cjs'
      - 'poc/tests/p3_approved_scope_labels.test.cjs'
      - '.github/workflows/p2-subphase10-77-skill-review.yml'
      - '.github/workflows/p2-joint-dynamic-model.yml'
permissions:
  contents: read
jobs:
  static-window:
    uses: ./.github/workflows/p2-subphase10-77-skill-review.yml
  dynamic:
    uses: ./.github/workflows/p2-joint-dynamic-model.yml
  approved:
    needs: [static-window, dynamic]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test poc/tests/p3_approved_scope_labels.test.cjs
      - uses: actions/download-artifact@v4
        with:
          name: p3-d052-fixed-static-window-inputs
          path: /tmp/p3-static
      - uses: actions/download-artifact@v4
        with:
          name: p2-59-joint-dynamic-projection
          path: /tmp/p3-dynamic
      - name: Join same-run accepted research and initial suitability labels
        run: |
          node poc/src/p3_approved_scope_labels.cjs \
            /tmp/p3-static/p3-g6-d052-receipt.json \
            /tmp/p3-static/p3-4g-source-logic-label-preview.json \
            /tmp/p3-static/p3-4h-rank-window-margin-screen.json \
            /tmp/p3-dynamic/p3-4i-scope-screen.json \
            poc/data/p3_approved_suitability_policy_d052.v1.json \
            /tmp/p3-d052-approved-labels.json
      - name: Verify card aggregation and browser view adapter on fixed inputs
        run: |
          node --test poc/tests/card_suitability_view.test.cjs poc/tests/skill_catalog.test.cjs
          node poc/tools/export_d052_catalog_labels.cjs /tmp/p3-d052-approved-labels.json /tmp/umasupport-d052-labels.json
          node poc/tools/audit_p3_card_suitability_view.cjs \
            /tmp/p3-d052-approved-labels.json \
            /tmp/p3-static/p3-3b-all-card-research-routes.json \
            /tmp/p3-card-suitability-view-summary.json /tmp/umasupport-d052-labels.json
      - name: Install Chromium for fixed catalogue acceptance
        run: |
          npm install --no-save --no-package-lock playwright@1.55.1
          npx playwright install --with-deps chromium
      - name: Exercise actual catalogue UI with same-run verified labels
        run: node poc/tests/browser_fixed_skill_catalog.cjs /tmp/umasupport-d052-labels.json
      - uses: actions/upload-artifact@v4
        with:
          name: d052-local-catalog-labels-not-for-publication
          path: /tmp/umasupport-d052-labels.json
          retention-days: 14
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: p3-d052-approved-scoped-labels-not-public
          path: |
            /tmp/p3-d052-approved-labels.json
            /tmp/p3-card-suitability-view-summary.json
          retention-days: 14
          if-no-files-found: error

  live-label-drift:
    needs: approved
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
          path: expected-pages
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          name: d052-local-catalog-labels-not-for-publication
          path: /tmp/d052-local
      - run: |
          npm install --no-save --no-package-lock playwright@1.55.1
          npx playwright install --with-deps chromium
      - name: Verify moving dictionary and actual local label import on Pages
        env:
          EXPECTED: ${{ github.event.pull_request.base.sha || github.sha }}
        run: node poc/tests/browser_public_label_drift.cjs expected-pages "$EXPECTED" /tmp/d052-local/umasupport-d052-labels.json
