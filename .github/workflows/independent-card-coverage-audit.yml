name: One-Off Independent Support Card Coverage Audit
on:
  pull_request:
    paths:
      - .github/workflows/independent-card-coverage-audit.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Chromium to inspect one public GameTora index page
        run: |
          npm install --no-save --no-package-lock playwright@1.55.1
          npx playwright install --with-deps chromium
      - name: Audit independent support-card ID subsets without redistributing input
        run: node poc/tools/audit_card_coverage.cjs
