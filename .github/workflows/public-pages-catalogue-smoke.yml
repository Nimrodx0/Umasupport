name: Public Pages catalogue acceptance
on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/public-pages-catalogue-smoke.yml'
      - 'poc/tests/browser_public_skill_catalog.cjs'
permissions:
  contents: read
jobs:
  public-pages:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
          path: expected-pages
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          npm install --no-save --no-package-lock playwright@1.55.1
          npx playwright install --with-deps chromium
      - name: Verify deployed assets and operate actual Pages
        env:
          EXPECTED: ${{ github.event.pull_request.base.sha || github.sha }}
        run: node poc/tests/browser_public_skill_catalog.cjs expected-pages "$EXPECTED"
