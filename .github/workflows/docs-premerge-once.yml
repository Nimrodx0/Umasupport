name: One-time documentation premerge verification
on:
  push:
    branches:
      - docs/reorganize-navigation-and-phase-plans-20261110
    paths:
      - '.github/workflows/docs-premerge-once.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify baseline original contents
        run: |
          node poc/tools/audit_doc_reorg.cjs --strict > /tmp/audit.json
          node -e 'const r=require("/tmp/audit.json"); console.log(JSON.stringify({originalMoved:r.movedCount,equal:r.normalizedProseEqual,canonical:r.canonicalPreservation.filter(x=>x.ok).length,snapshots:r.snapshots.filter(x=>x.ok).length,nonDoc:r.otherNonDocChanges.filter(x=>!x.changesOnlyPath)},null,2))'
      - name: Verify all source decisions and document references
        run: |
          node poc/tools/build_decision_index.cjs --check
          node --test poc/tests/docs_integrity.test.cjs poc/tests/doc_process.test.cjs poc/tests/handoff_quality.test.cjs poc/tests/documentation_policy.test.cjs
          node poc/tools/check_markdown_anchors.cjs --strict
          node poc/tools/check_project_tracking.cjs
      - name: Check text whitespace and file stability
        run: |
          git diff --check 1e366e2e5513d19171606b77b16a59a06c1f2e3a...HEAD
