name: Preflight full upstream source candidate

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-provisional-source:
    if: github.ref_name == 'automation/upstream-refresh-candidate'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout candidate metadata and read-only analyzer
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          path: umasupport
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate review-only candidate manifest and expose immutable source refs
        id: candidate
        shell: bash
        run: |
          set -euo pipefail
          node umasupport/poc/src/upstream_refresh_candidate.cjs \
            umasupport/poc/review/upstream-refresh-candidate.v1.json
          node - <<'NODE'
          const fs=require('node:fs');
          const {verifyManifest}=require('./umasupport/poc/src/upstream_refresh_candidate.cjs');
          const m=verifyManifest(JSON.parse(fs.readFileSync(
           'umasupport/poc/review/upstream-refresh-candidate.v1.json','utf8')));
          fs.appendFileSync(process.env.GITHUB_OUTPUT,
           'gt_base='+m.currentPinned.gameToraCommit+'\n'+
           'gt_candidate='+m.proposedSnapshot.gameToraCommit+'\n'+
           'uma_base='+m.currentPinned.umaSimCommit+'\n'+
           'uma_candidate='+m.proposedSnapshot.umaSimCommit+'\n');
          NODE
      - name: Checkout baseline GT event source into ephemeral directory
        uses: actions/checkout@v4
        with:
          repository: systemless10/UmamusumePS
          ref: ${{ steps.candidate.outputs.gt_base }}
          persist-credentials: false
          path: gt-baseline
      - name: Checkout proposed GT event source into ephemeral directory
        uses: actions/checkout@v4
        with:
          repository: systemless10/UmamusumePS
          ref: ${{ steps.candidate.outputs.gt_candidate }}
          persist-credentials: false
          path: gt-candidate
      - name: Obtain candidate UmaSim card and numeric-skill sources in runner temp
        shell: bash
        env:
          UMA_BASE: ${{ steps.candidate.outputs.uma_base }}
          UMA_CANDIDATE: ${{ steps.candidate.outputs.uma_candidate }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/source-candidate"
          curl --fail --location --silent --show-error --retry 3 --max-time 90 \
            "https://raw.githubusercontent.com/mee1080/umasim/$UMA_BASE/data/support_card.txt" \
            -o "$RUNNER_TEMP/source-candidate/card-baseline.txt"
          curl --fail --location --silent --show-error --retry 3 --max-time 90 \
            "https://raw.githubusercontent.com/mee1080/umasim/$UMA_CANDIDATE/data/support_card.txt" \
            -o "$RUNNER_TEMP/source-candidate/card-candidate.txt"
          curl --fail --location --silent --show-error --retry 3 --max-time 90 \
            "https://raw.githubusercontent.com/mee1080/umasim/$UMA_BASE/data/skill_data.txt" \
            -o "$RUNNER_TEMP/source-candidate/skill-baseline.txt"
          curl --fail --location --silent --show-error --retry 3 --max-time 90 \
            "https://raw.githubusercontent.com/mee1080/umasim/$UMA_CANDIDATE/data/skill_data.txt" \
            -o "$RUNNER_TEMP/source-candidate/skill-candidate.txt"
      - name: Run both candidate and baseline whole-event structural inventories and complete UmaSim diffs
        shell: bash
        run: |
          set -euo pipefail
          node --check umasupport/poc/src/upstream_candidate_full_preflight.cjs
          node --test umasupport/poc/tests/upstream_candidate_full_preflight.test.cjs
          node umasupport/poc/tools/preflight_upstream_refresh_candidate.cjs \
            umasupport/poc/review/upstream-refresh-candidate.v1.json \
            gt-baseline gt-candidate \
            "$RUNNER_TEMP/source-candidate/card-baseline.txt" \
            "$RUNNER_TEMP/source-candidate/card-candidate.txt" \
            "$RUNNER_TEMP/source-candidate/skill-baseline.txt" \
            "$RUNNER_TEMP/source-candidate/skill-candidate.txt"
      - name: Ensure original event data remains unapproved
        run: node umasupport/poc/tools/verify_event_release.cjs
