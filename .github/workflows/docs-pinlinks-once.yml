name: One-off fix immutable GitHub doc links
on:
  push:
    branches:
      - docs/reorganize-navigation-and-phase-plans-20261110
    paths:
      - .github/workflows/docs-pinlinks-once.yml
      - .github/PULL_REQUEST_TEMPLATE.md

permissions:
  contents: write

jobs:
  fix-links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Preserve immutable historical document permalinks
        run: |
          node --check poc/tools/fix_pinned_docs_links_once_20261110.cjs
          node poc/tools/fix_pinned_docs_links_once_20261110.cjs
          git add -A -- docs README.md AGENTS.md poc .github/workflows
      - name: Documentation and source integrity checks
        run: |
          node --test poc/tests/handoff_quality.test.cjs poc/tests/documentation_policy.test.cjs
          node poc/tools/audit_doc_reorg.cjs --strict
          node poc/tools/check_project_tracking.cjs
          git diff --cached --check
      - name: Commit path fixes
        run: |
          if git diff --cached --quiet; then
            echo "No broken immutable pinned links found."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "docs: preserve immutable historical GitHub file links"
            git push origin HEAD:docs/reorganize-navigation-and-phase-plans-20261110
          fi
