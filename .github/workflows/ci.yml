          node --check poc/tools/phase2_eight_event_review_client.js
          node --check poc/tools/preview_phase2_standalone_local.cjs
          node --test poc/tests/phase2_eight_event_local_review.test.cjs
          node poc/tools/verify_event_release.cjs

