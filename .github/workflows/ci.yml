name: PoC Core Tests
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  core-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check browser JavaScript syntax
        run: node --check poc/src/choice_result_facts.cjs && node --check poc/src/checker_choice_fact_preview.js && node --check poc/tools/build_choice_result_facts.cjs && node --check poc/src/curated_event_inventory.cjs && node --check poc/tools/report_curated_event_inventory.cjs && node --check poc/src/curated_skill_resolution.cjs && node --check poc/src/community_candidate_preview.js && node --check poc/src/event_preview_loader.js && node --check poc/src/card_search.js && node --check poc/src/skill_table.js && node --check poc/src/source_health.js && node --check poc/src/deck_events.js && node --check poc/src/live_app.js && node --check poc/src/live_loader.js && node --check poc/src/settings.js && node --check poc/src/event_schema.js && node --check poc/src/event_source_audit.js && node --check poc/src/event_review_compiler.js && node --check poc/src/cruise_source_audit.js && node --check poc/tools/audit_events.cjs && node --check poc/tools/audit_cruise_source.cjs && node --check poc/tools/compare_event_sources.cjs && node --check poc/tools/probe_utools.cjs && node --check poc/src/event_gap_audit.js && node --check poc/src/checker_candidate_pipeline.cjs && node --check poc/src/public_event_catalog.js && node --check poc/tools/build_checker_catalog.cjs && node --check poc/src/checker_gap_tracker.cjs && node --check poc/src/missing_ssr_fact_review.cjs && node --check poc/src/skill_candidate_id_audit.cjs && node --check poc/src/skill_bridge.js && node --check poc/src/skill_hierarchy.js && node --check poc/tools/audit_skill_groups.cjs && node --check poc/tools/audit_skill_candidate_ids.cjs
      - name: Run offline GameWith article importer and whole-roster planner regressions
        run: python3 -m unittest discover -s poc/tests -p 'test_gamewith*_import.py' -v

      - name: Run independent-JSON cross-check regression (synthetic data)
        run: python3 -m unittest discover -s poc/tests -p 'test_independent_skill_json.py' -v
      - name: Run independent-master audit regression (synthetic SQLite)
        run: python3 -m unittest discover -s poc/tests -p 'test_verify_skill_master.py' -v
      - name: Run data-independent tests
        run: node --test poc/tests/deck_events.test.cjs poc/tests/source_health.test.cjs poc/tests/skill_table.test.cjs poc/tests/card_search.test.cjs poc/tests/core.test.js poc/tests/stage.test.cjs poc/tests/runtime.test.cjs poc/tests/settings.test.cjs poc/tests/events.test.cjs poc/tests/chain_choice_branch_contract.test.cjs poc/tests/outcome_dependent_branches.test.cjs poc/tests/event_source_audit.test.cjs poc/tests/event_review_compiler.test.cjs poc/tests/cruise_source_audit.test.cjs poc/tests/event_gap_audit.test.cjs poc/tests/checker_candidate_pipeline.test.cjs poc/tests/checker_hint_fact_extract.test.cjs poc/tests/checker_review_queue.test.cjs poc/tests/checker_candidate_database.test.cjs poc/tests/route_classification_verify.test.cjs poc/tests/candidate_chain_stage_audit.test.cjs poc/tests/candidate_numeric_outcome_crosscheck.test.cjs poc/tests/editorial_choice_review.test.cjs poc/tests/choice_result_facts.test.cjs poc/tests/public_event_catalog.test.cjs poc/tests/checker_gap_tracker.test.cjs poc/tests/missing_ssr_fact_review.test.cjs poc/tests/skill_candidate_id_audit.test.cjs poc/tests/skill_bridge.test.cjs poc/tests/skill_hierarchy.test.cjs poc/tests/full_skill_hierarchy.test.cjs poc/tests/card_coverage.test.cjs poc/tests/card_hint_audit.test.cjs poc/tests/deckbuilder_cards.test.cjs poc/tests/legacy_raw_hints.test.cjs poc/tests/gametora_hint_parser.test.cjs poc/tests/stage_hint_integrity.test.cjs poc/tests/event_release_gate.test.cjs poc/tests/event_source_precedence.test.cjs poc/tests/event_preview_loader.test.cjs poc/tests/community_candidate_preview.test.cjs poc/tests/curated_event_inventory.test.cjs poc/tests/efforia30311_review_preview.test.cjs poc/tests/efforia30311_skill_registry_audit.test.cjs

      - name: Check bounded SSR30311 review-only route topology (no source download)
        run: node poc/tools/inspect_efforia30311_review_preview.cjs


      - name: Validate committed unreviewed numeric candidate database if present
        run: |
          if [ -f poc/data/candidates/checker_event_hints.v1.json ]; then
            node poc/tools/query_checker_candidate_database.cjs
          else
            echo 'No generated candidate database yet; generation workflow must populate the PR before merge.'
          fi

      - name: Run complete synthetic route classification crosswalk tests
        run: python3 -m unittest discover -s poc/tests -p 'test_classify_candidate_event_routes.py' -v

      - name: Verify full persisted candidate classification when present
        run: |
          if [ -f poc/data/candidates/checker_route_classification.v1.json ]; then
            node poc/tools/verify_route_classification.cjs
          else
            echo "Route classification sidecar is generated by the authorized PR workflow before merge."
          fi

      - name: Verify pinned numerical chain-stage audit when present
        run: |
          if [ -f poc/data/candidates/checker_chain_stage_audit.v1.json ]; then
            node poc/tools/build_candidate_chain_stage_audit.cjs --verify
          else
            echo "Numeric stage-audit sidecar is generated on the authorized PR before merge."
          fi

      - name: Verify source-pinned full 171-chain numeric crosscheck when present
        run: |
          if [ -f poc/data/candidates/checker_first_pass_numeric_crosscheck.v1.json ]; then
            node poc/tools/build_candidate_numeric_outcome_crosscheck.cjs --verify
          else
            echo 'Numeric comparison sidecar generated by authorized first-party PR workflow before merge.'
          fi

      - name: Verify two editorial source pages' numeric-choice spot reviews remain unapproved
        run: node poc/tools/verify_editorial_choice_review.cjs

      - name: Validate complete saved 2109 option and unspecified result fact rows
        run: |
          if [ -f poc/data/candidates/checker_choice_results.v1.json ]; then
            node poc/tools/build_choice_result_facts.cjs --verify
          else
            echo 'Choice/result fact DB will be generated by the authorized PR workflow before merge.'
          fi

      - name: Verify every public event has evidence-bound release approval
        run: node poc/tools/verify_event_release.cjs

      - name: Test historical event-ID overlap (synthetic SQLite, no external GET)
        run: python3 -m unittest discover -s poc/tests -p 'test_historical_event_master.py' -v

      - name: Run event-story title fingerprint regression (synthetic SQLite)
        run: python3 -m unittest discover -s poc/tests -p 'test_story_title_links.py' -v

      - name: Run historical event residual ID and metadata regression (synthetic SQLite)
        run: python3 -m unittest discover -s poc/tests -p 'test_story_residual_metadata.py' -v

      - name: Run three-source event headings parser regression (synthetic HTML)
        run: python3 -m unittest discover -s poc/tests -p 'test_three_source_event_headings.py' -v

      - name: Check later master snapshot comparison logic (synthetic SQLite)
        run: python3 -m unittest discover -s poc/tests -p 'test_compare_event_master_snapshots.py' -v

      - name: Check external Wiki ID inventory logic (synthetic metadata, no network)
        run: python3 -m unittest discover -s poc/tests -p 'test_wiki_cargo_supports.py' -v

      - name: Verify Wiki event-page index scope against synthetic old master
        run: python3 -m unittest discover -s poc/tests -p 'test_wiki_event_index_focus.py' -v

      - name: Verify rendered Wiki support page numeric links against synthetic SQLite
        run: python3 -m unittest discover -s poc/tests -p 'test_wiki_rendered_support_events.py' -v

      - name: Check Wiki JP masterdata-to-Cargo missing ID classifier (synthetic)
        run: python3 -m unittest discover -s poc/tests -p 'test_wiki_masterdata_cargo.py' -v

      - name: Bind SSR30311 Wiki story IDs to title positions (synthetic HTML)
        run: python3 -m unittest discover -s poc/tests -p 'test_efforia30311_wiki_title_links.py' -v

      - name: Verify unreviewed event candidate metadata audit with synthetic fixtures
        run: python3 -m unittest discover -s poc/tests -p 'test_unreviewed_numeric_event_candidates.py' -v

      - name: Run historical game-display-order schema regression (synthetic SQLite)
        run: python3 -m unittest discover -s poc/tests -p 'test_historical_disp_order.py' -v
      - name: Check new independent audit scripts
        run: node --check poc/tools/audit_card_coverage.cjs && node --check poc/tools/audit_independent_card_hints.cjs && node --check poc/tools/audit_deckbuilder_cards.cjs && node --check poc/tools/audit_legacy_raw_hints.cjs && node --check poc/tools/probe_gametora_hint_page.cjs && node --check poc/tools/audit_stage_hint_integrity.cjs

  browser-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Chromium for browser smoke
        run: |
          npm install --no-save --no-package-lock playwright@1.55.1
          npx playwright install --with-deps chromium
      - name: Exercise real Chromium with synthetic full-size data
        run: node poc/tests/browser_skill_smoke.cjs
      - name: Browser-test opt-in SSR30311 candidate routes and isolated settings
        run: node poc/tests/browser_event_preview_smoke.cjs
      - name: Browser-test all pinned source choice facts in 398-card/879-event opt-in mode
        run: node poc/tests/browser_checker_facts_smoke.cjs
