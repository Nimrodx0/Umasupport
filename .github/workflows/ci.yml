      - name: Verify all 2109 result facts and new priority review queue (offline)
        run: node poc/tools/verify_checker_result_facts.cjs --verify

      - name: Join P0 result candidates to provisional historical IDs
        run: node poc/tools/query_checker_result_review.cjs --summary

      - name: Validate Phase-2 whole-population independent evidence ledger
        run: node poc/tools/report_phase2_review_progress.cjs --summary

      - name: Verify complete Phase-2 563-card coverage index and pinned 2025 historical evidence
        run: node poc/tools/verify_event_coverage_index.cjs

      - name: Verify source-based ordinary chain default planning without route verification claims
        run: |
          node --check poc/src/phase2_chain_plan_build.cjs
          node --check poc/src/phase2_chain_plan_client.js
          node --test poc/tests/phase2_chain_plan_build.test.cjs
          node poc/tools/verify_event_release.cjs
      - name: Verify 12-stage manual chain preview remains fully unapproved
        run: |
          node --check poc/src/phase2_chain_pages_preview_artifact.cjs
          node --check poc/src/phase2_chain_pages_preview.js
          node --test poc/tests/phase2_chain_pages_preview_artifact.test.cjs
          node poc/tools/verify_event_release.cjs
      - name: Verify hosted Phase 2 8-event preview contains only audited facts
        run: |
