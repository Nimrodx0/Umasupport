name: PoC Core Tests
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  core-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check browser JavaScript syntax
        run: node --check poc/src/card_search.js && node --check poc/src/skill_table.js && node --check poc/src/source_health.js && node --check poc/src/deck_events.js && node --check poc/src/live_app.js && node --check poc/src/live_loader.js && node --check poc/src/settings.js && node --check poc/src/event_schema.js && node --check poc/src/event_source_audit.js && node --check poc/src/event_review_compiler.js && node --check poc/src/cruise_source_audit.js && node --check poc/tools/audit_events.cjs && node --check poc/tools/audit_cruise_source.cjs && node --check poc/tools/compare_event_sources.cjs && node --check poc/tools/probe_utools.cjs && node --check poc/src/event_gap_audit.js && node --check poc/src/checker_candidate_pipeline.cjs && node --check poc/src/public_event_catalog.js && node --check poc/tools/build_checker_catalog.cjs && node --check poc/src/checker_gap_tracker.cjs && node --check poc/src/missing_ssr_fact_review.cjs && node --check poc/src/skill_candidate_id_audit.cjs && node --check poc/src/skill_bridge.js && node --check poc/src/skill_hierarchy.js && node --check poc/tools/audit_skill_groups.cjs && node --check poc/tools/audit_skill_candidate_ids.cjs
      - name: Run independent-JSON cross-check regression (synthetic data)
        run: python3 -m unittest discover -s poc/tests -p 'test_independent_skill_json.py' -v
      - name: Run independent-master audit regression (synthetic SQLite)
        run: python3 -m unittest discover -s poc/tests -p 'test_verify_skill_master.py' -v
      - name: Run data-independent tests
        run: node --test poc/tests/deck_events.test.cjs poc/tests/source_health.test.cjs poc/tests/skill_table.test.cjs poc/tests/card_search.test.cjs poc/tests/core.test.js poc/tests/stage.test.cjs poc/tests/runtime.test.cjs poc/tests/settings.test.cjs poc/tests/events.test.cjs poc/tests/event_source_audit.test.cjs poc/tests/event_review_compiler.test.cjs poc/tests/cruise_source_audit.test.cjs poc/tests/event_gap_audit.test.cjs poc/tests/checker_candidate_pipeline.test.cjs poc/tests/public_event_catalog.test.cjs poc/tests/checker_gap_tracker.test.cjs poc/tests/missing_ssr_fact_review.test.cjs poc/tests/skill_candidate_id_audit.test.cjs poc/tests/skill_bridge.test.cjs poc/tests/skill_hierarchy.test.cjs poc/tests/full_skill_hierarchy.test.cjs poc/tests/card_coverage.test.cjs poc/tests/card_hint_audit.test.cjs poc/tests/deckbuilder_cards.test.cjs poc/tests/legacy_raw_hints.test.cjs poc/tests/gametora_hint_parser.test.cjs poc/tests/stage_hint_integrity.test.cjs

      - name: Test historical event-ID overlap (synthetic SQLite, no external GET)
        run: python3 -m unittest discover -s poc/tests -p 'test_historical_event_master.py' -v

      - name: Run event-story title fingerprint regression (synthetic SQLite)
        run: python3 -m unittest discover -s poc/tests -p 'test_story_title_links.py' -v

      - name: Run historical event residual ID and metadata regression (synthetic SQLite)
        run: python3 -m unittest discover -s poc/tests -p 'test_story_residual_metadata.py' -v

      - name: Run three-source event headings parser regression (synthetic HTML)
        run: python3 -m unittest discover -s poc/tests -p 'test_three_source_event_headings.py' -v

      - name: Check later master snapshot comparison logic (synthetic SQLite)
        run: python3 -m unittest discover -s poc/tests -p 'test_compare_event_master_snapshots.py' -v

      - name: Run historical game-display-order schema regression (synthetic SQLite)
        run: python3 -m unittest discover -s poc/tests -p 'test_historical_disp_order.py' -v
      - name: Check new independent audit scripts
        run: node --check poc/tools/audit_card_coverage.cjs && node --check poc/tools/audit_independent_card_hints.cjs && node --check poc/tools/audit_deckbuilder_cards.cjs && node --check poc/tools/audit_legacy_raw_hints.cjs && node --check poc/tools/probe_gametora_hint_page.cjs && node --check poc/tools/audit_stage_hint_integrity.cjs

  browser-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Chromium for browser smoke
        run: |
          npm install --no-save --no-package-lock playwright@1.55.1
          npx playwright install --with-deps chromium
      - name: Exercise real Chromium with synthetic full-size data
        run: node poc/tests/browser_skill_smoke.cjs
