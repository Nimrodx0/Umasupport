name: PoC Core Tests
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  core-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check browser JavaScript syntax
        run: node --check poc/src/live_app.js && node --check poc/src/live_loader.js && node --check poc/src/settings.js && node --check poc/src/event_schema.js && node --check poc/src/event_source_audit.js && node --check poc/src/event_review_compiler.js && node --check poc/src/cruise_source_audit.js && node --check poc/tools/audit_events.cjs && node --check poc/tools/audit_cruise_source.cjs && node --check poc/tools/compare_event_sources.cjs && node --check poc/tools/probe_utools.cjs && node --check poc/src/event_gap_audit.js && node --check poc/src/checker_candidate_pipeline.cjs && node --check poc/src/public_event_catalog.js && node --check poc/tools/build_checker_catalog.cjs && node --check poc/src/checker_gap_tracker.cjs && node --check poc/src/missing_ssr_fact_review.cjs && node --check poc/src/skill_candidate_id_audit.cjs && node --check poc/src/skill_bridge.js && node --check poc/src/skill_hierarchy.js && node --check poc/tools/audit_skill_groups.cjs && node --check poc/tools/audit_skill_candidate_ids.cjs
      - name: Run independent-master audit regression (synthetic SQLite)
        run: python3 -m unittest discover -s poc/tests -p 'test_verify_skill_master.py' -v
      - name: Run data-independent tests
        run: node --test poc/tests/core.test.js poc/tests/stage.test.cjs poc/tests/runtime.test.cjs poc/tests/settings.test.cjs poc/tests/events.test.cjs poc/tests/event_source_audit.test.cjs poc/tests/event_review_compiler.test.cjs poc/tests/cruise_source_audit.test.cjs poc/tests/event_gap_audit.test.cjs poc/tests/checker_candidate_pipeline.test.cjs poc/tests/public_event_catalog.test.cjs poc/tests/checker_gap_tracker.test.cjs poc/tests/missing_ssr_fact_review.test.cjs poc/tests/skill_candidate_id_audit.test.cjs poc/tests/skill_bridge.test.cjs poc/tests/skill_hierarchy.test.cjs poc/tests/full_skill_hierarchy.test.cjs

  browser-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Chromium for browser smoke
        run: |
          npm install --no-save --no-package-lock playwright@1.55.1
          npx playwright install --with-deps chromium
      - name: Exercise real Chromium with synthetic full-size data
        run: node poc/tests/browser_skill_smoke.cjs
