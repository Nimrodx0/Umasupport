          node --check poc/src/phase2_eight_pages_preview.js
          node --test poc/tests/phase2_eight_pages_preview_artifact.test.cjs
          node poc/tools/verify_event_release.cjs
      - name: Verify local-only interactive review data for eight SSR events
        run: |
