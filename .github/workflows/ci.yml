name: PoC Core Tests
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  core-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate documentation responsibilities, archive and canonical links
        run: node --test poc/tests/documentation_policy.test.cjs

      - name: Check browser JavaScript syntax
        run: node --check poc/src/checker_explicit_result_extract.cjs && node --check poc/src/checker_result_review_queue.cjs && node --check poc/src/phase2_event_review_lookup.cjs && node --check poc/src/editorial_branch_crosscheck.cjs && node --check poc/src/editorial_cumulative_result_30103.cjs && node --check poc/tools/query_checker_result_review.cjs && node --check poc/tools/verify_checker_result_facts.cjs && node --check poc/tools/build_checker_explicit_result_facts.cjs && node --check poc/src/choice_result_facts.cjs && node --check poc/src/checker_choice_fact_preview.js && node --check poc/tools/build_choice_result_facts.cjs && node --check poc/src/curated_event_inventory.cjs && node --check poc/tools/report_curated_event_inventory.cjs && node --check poc/src/curated_skill_resolution.cjs && node --check poc/src/community_candidate_preview.js && node --check poc/src/event_preview_loader.js && node --check poc/src/card_search.js && node --check poc/src/skill_table.js && node --check poc/src/source_health.js && node --check poc/src/deck_events.js && node --check poc/src/live_app.js && node --check poc/src/live_loader.js && node --check poc/src/settings.js && node --check poc/src/event_schema.js && node --check poc/src/event_source_audit.js && node --check poc/src/event_review_compiler.js && node --check poc/src/cruise_source_audit.js && node --check poc/tools/audit_events.cjs && node --check poc/tools/audit_cruise_source.cjs && node --check poc/tools/compare_event_sources.cjs && node --check poc/tools/probe_utools.cjs && node --check poc/src/event_gap_audit.js && node --check poc/src/checker_candidate_pipeline.cjs && node --check poc/src/public_event_catalog.js && node --check poc/tools/build_checker_catalog.cjs && node --check poc/src/checker_gap_tracker.cjs && node --check poc/src/missing_ssr_fact_review.cjs && node --check poc/src/skill_candidate_id_audit.cjs && node --check poc/src/skill_bridge.js && node --check poc/src/skill_hierarchy.js && node --check poc/tools/audit_skill_groups.cjs && node --check poc/tools/audit_skill_candidate_ids.cjs
      - name: Run offline GameWith article importer and whole-roster planner regressions
        run: python3 -m unittest discover -s poc/tests -p 'test_gamewith*_import.py' -v

      - name: Run independent-JSON cross-check regression (synthetic data)
        run: python3 -m unittest discover -s poc/tests -p 'test_independent_skill_json.py' -v
      - name: Run independent-master audit regression (synthetic SQLite)
        run: python3 -m unittest discover -s poc/tests -p 'test_verify_skill_master.py' -v
      - name: Audit GT result-vs-OR branch categories (synthetic source)
        run: node --check poc/src/gametora_branch_semantics_inventory.cjs && node --test poc/tests/gametora_branch_semantics_inventory.test.cjs

      - name: Exercise actual deck aggregator with unpublished GT event choices, outcomes and terminal gates
        run: node --check poc/src/gametora_full_runtime_integration.cjs && node --test poc/tests/gametora_full_runtime_integration.test.cjs

      - name: Validate GT event-to-runtime schema projection and quarantine
        run: node --check poc/src/gametora_app_schema_dry_run.cjs && node --check poc/tools/probe_gametora_app_schema_dry_run.cjs && node --test poc/tests/gametora_app_schema_dry_run.test.cjs

      - name: Check 2025 historical master skill-gap classification regression
        run: python3 -m unittest discover -s poc/tests -p 'test_historical_missing_event_skills.py' -v

      - name: Validate fixed GameTora event skill ID crosswalk
        run: node --check poc/src/gametora_event_skill_crosswalk.cjs && node --check poc/tools/audit_gametora_event_skill_crosswalk.cjs && node --test poc/tests/gametora_event_skill_crosswalk.test.cjs

      - name: Verify all-card private candidate on actual production loader in disposable model
        run: |
          node --check poc/src/phase2_integrated_private_loader.cjs
          node --test poc/tests/phase2_integrated_private_loader.test.cjs
          node poc/tools/verify_event_release.cjs
      - name: Verify targeted 30301 Checker training-hint versus GT chain adjudication
        run: |
          node --check poc/src/phase2_30301_identity_resolution.cjs
          node --test poc/tests/phase2_2511_gap_reconciliation.test.cjs
          node poc/tools/verify_event_release.cjs
      - name: Prioritize sixteen residual Checker events by exact skill numeric IDs
        run: |
          node --check poc/src/phase2_2511_remaining_checker_skill_impact.cjs
          node --test poc/tests/phase2_2511_remaining_checker_skill_impact.test.cjs
          node poc/tools/verify_event_release.cjs
      - name: Validate four Checker P1 conditional outcomes without granting skills
        run: |
          node --check poc/src/phase2_four_p1_outcome_review.cjs
          node --test poc/tests/phase2_four_p1_outcome_review.test.cjs
          node poc/tools/verify_event_release.cjs
      - name: Validate P1 GT/Checker source-title key correspondence without auto-pairing
        run: |
          node --check poc/src/phase2_p1_source_title_join.cjs
          node --check poc/tools/audit_phase2_p1_source_title_join.cjs
          node --test poc/tests/phase2_p1_source_title_join.test.cjs
          node poc/tools/verify_event_release.cjs
      - name: Test direct merge of source-ordinal-matched skills and non-skill outcome effects
        run: |
          node --check poc/src/phase2_2512_private_effect_join.cjs
          node --check poc/tools/probe_gametora_app_schema_dry_run.cjs
          node --test poc/tests/phase2_2512_private_effect_join.test.cjs
      - name: Test batch triage of all blocked GT events
        run: |
          node --check poc/src/phase2_gt_blocker_cohorts.cjs
          node --check poc/tools/audit_phase2_gt_whole_nonskill_effects.cjs
          node --test poc/tests/phase2_gt_blocker_cohorts.test.cjs
      - name: Test GT30090 bond-range outcomes remain terminal on both tiers
        run: |
          node --check poc/src/phase2_gt_30090_terminal_bond_overlay.cjs
          node --check poc/tools/probe_gametora_app_schema_dry_run.cjs
          node --test poc/tests/phase2_gt_30090_terminal_bond_overlay.test.cjs
      - name: Test SSR30010 coupled wisdom range with two skill_hint_or alternatives
        run: |
          node --check poc/src/phase2_gt_30010_correlated_or_overlay.cjs
          node --check poc/tools/probe_gametora_app_schema_dry_run.cjs
          node --test poc/tests/phase2_gt_30010_correlated_or_overlay.test.cjs
      - name: Test numeric-only low/high exclusive outcomes in GT30030 and GT30041
        run: |
          node --check poc/src/phase2_gt_nonskill_only_range_overlay.cjs
          node --check poc/tools/probe_gametora_app_schema_dry_run.cjs
          node --test poc/tests/phase2_gt_nonskill_only_range_overlay.test.cjs
      - name: Test GT30028 joint speed and hint level tier overlay without skill topology changes
        run: |
          node --check poc/src/phase2_gt_30028_correlated_range_overlay.cjs
          node --check poc/tools/probe_gametora_app_schema_dry_run.cjs
          node --test poc/tests/phase2_gt_30028_correlated_range_overlay.test.cjs
      - name: Test coupled GT numeric slash ranges retain shared low/high outcome tier
        run: |
          node --check poc/src/phase2_gt_correlated_numeric_range.cjs
          node --test poc/tests/phase2_gt_correlated_numeric_range.test.cjs
      - name: Test nonpublishing conditional segment guard manifest and no implicit skill reward
        run: |
          node --check poc/src/phase2_gt_conditional_segment_review.cjs
          node --test poc/tests/phase2_gt_conditional_segment_review.test.cjs
      - name: Test GT original order of duplicate conditional status operations
        run: |
          node --check poc/src/phase2_gt_whole_nonskill_effect_inventory.cjs
          node --check poc/src/event_schema.js
          node --test poc/tests/phase2_gt_ordered_status_effects.test.cjs
      - name: Test original ordering of duplicate GT numeric effects
        run: |
          node --check poc/src/phase2_gt_whole_nonskill_effect_inventory.cjs
          node --check poc/src/event_schema.js
          node --test poc/tests/phase2_gt_ordered_duplicate_numeric_effects.test.cjs
      - name: Test GT source chain ending matches the skill outcome terminal
        run: |
          node --check poc/src/phase2_gt_whole_nonskill_effect_inventory.cjs
          node --check poc/src/phase2_2512_private_effect_join.cjs
          node --test poc/tests/phase2_gt_chain_end_effect_join.test.cjs
      - name: Test scenario-derived lowest performance and full-energy operations
        run: |
          node --check poc/src/event_schema.js
          node --check poc/src/core.js
          node --test poc/tests/phase2_gt_grand_live_mt_full_energy.test.cjs
      - name: Test source-based random target attributes without turning them into guaranteed stats
        run: |
          node --check poc/src/phase2_gt_whole_nonskill_effect_inventory.cjs
          node --check poc/src/phase2_2512_private_effect_join.cjs
          node --test poc/tests/phase2_gt_random_stats_targets.test.cjs
      - name: Test guarded status operation schema, runtime and skill-safe event merge
        run: |
          node --check poc/src/event_schema.js
          node --check poc/src/core.js
          node --test poc/tests/phase2_gt_status_effects.test.cjs
      - name: Test all-GT non-skill effect source classifier and numeric recipient identity
        run: |
          node --check poc/src/phase2_gt_whole_nonskill_effect_inventory.cjs
          node --check poc/tools/audit_phase2_gt_whole_nonskill_effects.cjs
          node --test poc/tests/phase2_gt_whole_nonskill_effect_inventory.test.cjs
      - name: Test non-skill event-outcome schema, conditional routing and R/SSR Mei private preview
        run: |
          node --check poc/src/event_schema.js
          node --check poc/src/core.js
          node --check poc/src/phase2_mei_overseas_nonskill_preview.cjs
          node --check poc/tools/audit_phase2_mei_effect_runtime.cjs
          node --test poc/tests/phase2_nonskill_outcome_runtime.test.cjs
          node poc/tools/verify_event_release.cjs
      - name: Validate L'Arc group replacement and R/SSR Mei overseas scenario review without runtime release
        run: |
          node --check poc/src/phase2_p1_scenario_event_ledger.cjs
          node --check poc/tools/audit_phase2_p1_scenario_events.cjs
          node --test poc/tests/phase2_p1_scenario_event_ledger.test.cjs
          node poc/tools/verify_event_release.cjs
      - name: Validate SSR30180 event-only cornering hint and production loader
        run: |
          node --check poc/src/phase2_30180_special_overlay.cjs
          node --check poc/src/phase2_30180_loader.cjs
          node --test poc/tests/phase2_30180_special_overlay.test.cjs
          node poc/tools/verify_event_release.cjs
      - name: Reconcile 65 pinned source differences after the 2511-event integration
        run: |
          node --check poc/src/phase2_2511_gap_reconciliation.cjs
          node --test poc/tests/phase2_2511_gap_reconciliation.test.cjs
          node poc/tools/verify_event_release.cjs
      - name: Validate 2511 private GT/GameWith chain runtime flags through production core
        run: |
          node --check poc/src/phase2_2511_chain_runtime.cjs
          node --check poc/src/phase2_2511_chain_loader.cjs
          node --test poc/tests/phase2_2511_chain_runtime.test.cjs
          node poc/tools/verify_event_release.cjs
      - name: Validate combined 563-card GT and GameWith event candidate runtime
        run: |
          node --check poc/src/phase2_integrated_private_catalog.cjs
          node --test poc/tests/phase2_integrated_private_catalog.test.cjs
          node poc/tools/verify_event_release.cjs
      - name: Verify Phase 2 SSR30080 exact three-option private runtime correction
        run: |
          node --check poc/src/phase2_30080_runtime_overlay.cjs
          node --test poc/tests/phase2_30080_runtime_overlay.test.cjs
          node poc/tools/verify_event_release.cjs
      - name: Verify GT baseline roots and Checker exception overlay
        run: |
          node --check poc/src/phase2_release_triage.cjs
          node --test poc/tests/phase2_release_triage.test.cjs
          node poc/tools/verify_event_release.cjs
      - name: Verify unsigned GT event review queue with metadata-only checks
        run: |
          node --check poc/src/gametora_publication_review_queue.cjs
          node --test poc/tests/gametora_publication_review_queue.test.cjs
          node poc/tools/verify_event_release.cjs
      - name: Enforce source title SHA join for bulk GT release candidates
        run: node --check poc/src/gametora_short_event_title_intake.cjs && node --test poc/tests/gametora_short_event_title_intake.test.cjs

      - name: Verify full GameTora numeric event normalization (synthetic)
        run: node --check poc/src/gametora_whole_event_normalize.cjs && node --check poc/tools/generate_gametora_whole_event_candidate.cjs && node --test poc/tests/gametora_whole_event_normalize.test.cjs

      - name: Enforce GameTora-website then GameWith editorial decision contract
        run: |
          node --check poc/src/event_exception_adjudication.cjs
          node --test poc/tests/event_exception_adjudication.test.cjs poc/tests/event_source_precedence.test.cjs poc/tests/phase2_four_ssr_editorial_review.test.cjs

      - name: Validate first GameWith numeric adjudication intake without publication
        run: |
          node --check poc/src/phase2_adjudicated_fact_intake.cjs
          node --check poc/tools/verify_adjudicated_event_facts.cjs
          node --test poc/tests/phase2_adjudicated_fact_intake.test.cjs
          node poc/tools/verify_adjudicated_event_facts.cjs

      - name: Verify full SSR30321 choice-aware numeric fact adoption without public release
        run: |
          node --check poc/src/phase2_editorial_intake.cjs
          node --check poc/src/phase2_adjudicated_fact_intake.cjs
          node --test poc/tests/phase2_editorial_intake.test.cjs poc/tests/phase2_adjudicated_fact_intake.test.cjs
          node poc/tools/report_phase2_editorial_intake.cjs
          node poc/tools/verify_adjudicated_event_facts.cjs

      - name: Verify SSR30318-30320 fifteen editorial events and unpublished six normal-event drafts
        run: |
          node --check poc/src/phase2_remaining_ssr_intake.cjs
          node --test poc/tests/phase2_remaining_ssr_intake.test.cjs
          node --test poc/tests/phase2_adjudicated_fact_intake.test.cjs
          node poc/tools/verify_adjudicated_event_facts.cjs

      - name: Guard SSR30240 GameWith unpublished event facts and simulate explicit U-tools-only hypothesis
        run: |
          node --check poc/src/phase2_30240_pending_chain_replay.cjs
          node --test poc/tests/phase2_30240_pending_chain_replay.test.cjs
          node poc/tools/verify_event_release.cjs

      - name: Audit SR20075 missing stage without inventing results or publishing
        run: |
          node --check poc/src/phase2_20075_first_stage_intake.cjs
          node --test poc/tests/phase2_20075_first_stage_intake.test.cjs
          node poc/tools/verify_event_release.cjs

      - name: Verify SSR30221 missing 3 chain stages using GameWith numeric intake
        run: |
          node --check poc/src/phase2_30221_missing_chain_intake.cjs
          node --test poc/tests/phase2_30221_missing_chain_intake.test.cjs
          node poc/tools/verify_event_release.cjs

      - name: Replay SSR30080 three selectable choices against real core without publication
        run: |
          node --check poc/src/phase2_30080_three_choice_repair.cjs
          node --test poc/tests/phase2_30080_three_choice_repair.test.cjs
          node poc/tools/verify_event_release.cjs

      - name: Verify all four SSR chain stages with explicit manual reachability (not publication)
        run: |
          node --check poc/src/phase2_chain_manual_replay.cjs
          node --check poc/tools/report_phase2_chain_manual_replay.cjs
          node --test poc/tests/phase2_chain_manual_replay.test.cjs
          node poc/tools/report_phase2_chain_manual_replay.cjs
          node poc/tools/verify_event_release.cjs

      - name: Validate GameTora-first and GameWith-dispute event source policy
        run: node --check poc/src/gametora_event_resolution.cjs && node --check poc/tools/report_gametora_baseline.cjs && node --test poc/tests/gametora_event_resolution.test.cjs

      - name: Run data-independent tests
        run: node --test poc/tests/deck_events.test.cjs poc/tests/source_health.test.cjs poc/tests/skill_table.test.cjs poc/tests/card_search.test.cjs poc/tests/core.test.js poc/tests/stage.test.cjs poc/tests/runtime.test.cjs poc/tests/settings.test.cjs poc/tests/events.test.cjs poc/tests/chain_choice_branch_contract.test.cjs poc/tests/outcome_dependent_branches.test.cjs poc/tests/event_coverage_index.test.cjs poc/tests/event_coverage_historical.test.cjs poc/tests/event_source_audit.test.cjs poc/tests/event_review_compiler.test.cjs poc/tests/cruise_source_audit.test.cjs poc/tests/event_gap_audit.test.cjs poc/tests/checker_candidate_pipeline.test.cjs poc/tests/checker_hint_fact_extract.test.cjs poc/tests/checker_review_queue.test.cjs poc/tests/checker_candidate_database.test.cjs poc/tests/route_classification_verify.test.cjs poc/tests/candidate_chain_stage_audit.test.cjs poc/tests/candidate_numeric_outcome_crosscheck.test.cjs poc/tests/editorial_choice_review.test.cjs poc/tests/choice_result_facts.test.cjs poc/tests/checker_explicit_result_extract.test.cjs poc/tests/checker_result_review_queue.test.cjs poc/tests/gametora_branch_audit.test.cjs poc/tests/whole_event_index.test.cjs poc/tests/whole_event_reward_audit.test.cjs poc/tests/whole_chain_topology.test.cjs poc/tests/checker_result_preview.test.cjs poc/tests/phase2_event_review_lookup.test.cjs poc/tests/editorial_branch_crosscheck.test.cjs poc/tests/editorial_cumulative_result_30103.test.cjs poc/tests/phase2_review_progress.test.cjs poc/tests/public_event_catalog.test.cjs poc/tests/checker_gap_tracker.test.cjs poc/tests/missing_ssr_fact_review.test.cjs poc/tests/skill_candidate_id_audit.test.cjs poc/tests/skill_bridge.test.cjs poc/tests/skill_hierarchy.test.cjs poc/tests/full_skill_hierarchy.test.cjs poc/tests/card_coverage.test.cjs poc/tests/card_hint_audit.test.cjs poc/tests/deckbuilder_cards.test.cjs poc/tests/legacy_raw_hints.test.cjs poc/tests/gametora_hint_parser.test.cjs poc/tests/stage_hint_integrity.test.cjs poc/tests/event_release_gate.test.cjs poc/tests/event_source_precedence.test.cjs poc/tests/event_preview_loader.test.cjs poc/tests/community_candidate_preview.test.cjs poc/tests/curated_event_inventory.test.cjs poc/tests/efforia30311_review_preview.test.cjs poc/tests/efforia30311_skill_registry_audit.test.cjs

      - name: Check bounded SSR30311 review-only route topology (no source download)
        run: node poc/tools/inspect_efforia30311_review_preview.cjs


      - name: Validate committed unreviewed numeric candidate database if present
        run: |
          if [ -f poc/data/candidates/checker_event_hints.v1.json ]; then
            node poc/tools/query_checker_candidate_database.cjs
          else
            echo 'No generated candidate database yet; generation workflow must populate the PR before merge.'
          fi

      - name: Run complete synthetic route classification crosswalk tests
        run: python3 -m unittest discover -s poc/tests -p 'test_classify_candidate_event_routes.py' -v

      - name: Verify full persisted candidate classification when present
        run: |
          if [ -f poc/data/candidates/checker_route_classification.v1.json ]; then
            node poc/tools/verify_route_classification.cjs
          else
            echo "Route classification sidecar is generated by the authorized PR workflow before merge."
          fi

      - name: Verify pinned numerical chain-stage audit when present
        run: |
          if [ -f poc/data/candidates/checker_chain_stage_audit.v1.json ]; then
            node poc/tools/build_candidate_chain_stage_audit.cjs --verify
          else
            echo "Numeric stage-audit sidecar is generated on the authorized PR before merge."
          fi

      - name: Verify source-pinned full 171-chain numeric crosscheck when present
        run: |
          if [ -f poc/data/candidates/checker_first_pass_numeric_crosscheck.v1.json ]; then
            node poc/tools/build_candidate_numeric_outcome_crosscheck.cjs --verify
          else
            echo 'Numeric comparison sidecar generated by authorized first-party PR workflow before merge.'
          fi

      - name: Verify two editorial source pages' numeric-choice spot reviews remain unapproved
        run: node poc/tools/verify_editorial_choice_review.cjs

      - name: Validate complete saved 2109 option and unspecified result fact rows
        run: |
          if [ -f poc/data/candidates/checker_choice_results.v1.json ]; then
            node poc/tools/build_choice_result_facts.cjs --verify
          else
