name: Verify original GameTora route-local hint ID crosswalk on two new cards

on:
  pull_request:
    paths:
      - '.github/workflows/official-gametora-new-card-hint-locality-browser.yml'
      - 'poc/src/official_gametora_skill_id_crosswalk.cjs'
      - 'poc/src/official_gametora_live_event_assembler.cjs'
      - 'poc/src/official_gametora_route_dom_extractor.cjs'
      - 'poc/tests/official_gametora_route_dom_extractor.test.cjs'
      - 'poc/src/official_gametora_private_schema_projection.cjs'
      - 'poc/tests/official_gametora_private_schema_projection.test.cjs'
      - 'poc/src/official_gametora_site_unified_draft.cjs'
      - 'poc/src/official_gametora_site_numeric_draft.cjs'
      - 'poc/src/official_gametora_site_hint_draft.cjs'
      - 'poc/tests/official_gametora_live_event_assembler.test.cjs'
      - 'poc/src/official_gametora_direct_skill_draft.cjs'
      - 'poc/src/official_gametora_site_flow_draft.cjs'
      - 'poc/tests/official_gametora_site_flow_draft.test.cjs'
      - 'poc/tests/official_gametora_direct_skill_draft.test.cjs'
      - 'poc/tools/probe_official_gametora_new_cards.cjs'
      - 'poc/src/official_gametora_new_card_route_hints.cjs'
      - 'poc/tests/official_gametora_skill_id_crosswalk.test.cjs'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  two-card-hint-locality:
    runs-on: ubuntu-24.04
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify strict local hint ancestry without reading a website
        run: |
          node --check poc/src/official_gametora_skill_id_crosswalk.cjs
          node --check poc/tools/probe_official_gametora_new_cards.cjs
          node --test poc/tests/official_gametora_skill_id_crosswalk.test.cjs
          node --test poc/tests/official_gametora_new_card_route_hints.test.cjs
          node --check poc/src/official_gametora_direct_skill_draft.cjs
          node --test poc/tests/official_gametora_direct_skill_draft.test.cjs
          node --check poc/src/official_gametora_site_flow_draft.cjs
          node --test poc/tests/official_gametora_site_flow_draft.test.cjs
          node --check poc/src/official_gametora_live_event_assembler.cjs
          node --test poc/tests/official_gametora_live_event_assembler.test.cjs
          node --check poc/src/official_gametora_route_dom_extractor.cjs
          node --test poc/tests/official_gametora_route_dom_extractor.test.cjs
          node --check poc/src/official_gametora_private_schema_projection.cjs
          node --test poc/tests/official_gametora_private_schema_projection.test.cjs
      - name: Prepare preinstalled Chrome browser controller
        run: |
          npm install --no-save --no-package-lock playwright@1.55.1
          command -v google-chrome || command -v google-chrome-stable
      - name: Download one independent pinned skill registry into disposable runner
        shell: bash
        run: |
          curl --fail --silent --show-error --location --retry 1 --max-time 30 \
            'https://raw.githubusercontent.com/mee1080/umasim/910dd79f046710245e0cc88a09c5c92b1044897e/data/skill_data.txt' \
            -o "$RUNNER_TEMP/umasim-pinned-new-card-hints.json"
      - name: Observe at most two source pages after robots check and delay
        shell: bash
        env:
          GT_SKILL_REGISTRY_SAMPLE: ${{ runner.temp }}/umasim-pinned-new-card-hints.json
        run: |
          node poc/tools/probe_official_gametora_new_cards.cjs --live-new-cards
