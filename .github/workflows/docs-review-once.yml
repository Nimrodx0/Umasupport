name: One-time individual documentation review
on:
  push:
    branches:
      - docs/reorganize-navigation-and-phase-plans-20261110
    paths:
      - .github/workflows/docs-review-once.yml
      - poc/tools/audit_doc_reorg.cjs
      - poc/tools/review_doc_structure_20261110.cjs

permissions:
  contents: write

jobs:
  rewrite-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Review and annotate existing documents without deleting their bodies
        run: |
          node --check poc/tools/review_doc_structure_20261110.cjs
          node poc/tools/review_doc_structure_20261110.cjs
      - name: Prove moved research text and all document links survive
        run: |
          node poc/tools/audit_doc_reorg.cjs --strict
          node --test poc/tests/handoff_quality.test.cjs poc/tests/documentation_policy.test.cjs
          node poc/tools/check_project_tracking.cjs
          git diff --check
      - name: Commit documentation changes without touching workflow permissions
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/ AGENTS.md
          git commit -m "docs: review every individual report and add document navigation and inventory"
          git push origin HEAD:docs/reorganize-navigation-and-phase-plans-20261110
