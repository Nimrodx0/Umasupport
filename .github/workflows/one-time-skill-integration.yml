name: One-time full skill runtime integration
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  source-integration:
    if: github.head_ref == 'feature/skill-hierarchy-completion'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate actual support-card and skill data together
        run: node poc/tools/verify_live_skill_hierarchy.cjs --online
