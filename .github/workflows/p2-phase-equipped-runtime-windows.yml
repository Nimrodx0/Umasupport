name: P2.15 equipped runtime sampled skill windows (GlobalSim model only)

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'poc/tools/globalsim_p2_15_equipped_runtime_windows.cjs'
      - 'poc/tests/globalsim_p2_15_equipped_runtime_windows.test.cjs'
      - 'poc/tools/globalsim_p2_15_preskill_phase_position.cjs'
      - '.github/workflows/p2-phase-equipped-runtime-windows.yml'
      - 'docs/evidence/skills/skill-p2-15-equipped-runtime-windows-20261112.md'

permissions:
  contents: read

jobs:
  equipped-runtime-sampling:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate source probes and synthetic fail-closed examples
        run: |
          node --check poc/tools/globalsim_p2_15_equipped_runtime_windows.cjs
          node --check poc/tools/globalsim_p2_15_preskill_phase_position.cjs
          node --test poc/tests/globalsim_p2_15_equipped_runtime_windows.test.cjs
          node --test poc/tests/globalsim_p2_15_preskill_phase_position.test.cjs
      - name: Compile original fixed GlobalSim v77 retail model
        run: |
          mkdir -p /tmp/p2-15-equipped-engine /tmp/p2-15-equipped-study
          cd /tmp/p2-15-equipped-engine
          git init -q
          git remote add origin https://github.com/daftuyda/GlobalSim.git
          git fetch -q --depth 1 origin 80b54cacf174b54ff6f7ca27ee7f88b5856c0bd1
          git checkout -q --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = 80b54cacf174b54ff6f7ca27ee7f88b5856c0bd1
          cargo build --release --locked
          cp target/release/race_engine_rs_v2 /tmp/p2-15-equipped-study/original-engine
      - name: Instrument frozen same-stage position and sampled original-model skill windows
        run: |
          node poc/tools/globalsim_p2_15_equipped_runtime_windows.cjs patch \
            /tmp/p2-15-equipped-engine > /tmp/p2-15-equipped-study/source-probe.json
          cd /tmp/p2-15-equipped-engine
          git diff --name-only | sort > /tmp/p2-15-equipped-study/modified.txt
          printf "src/lib.rs\nsrc/race_field.rs\nsrc/race_field_retail.rs\n" > /tmp/p2-15-equipped-study/expected.txt
          cmp /tmp/p2-15-equipped-study/modified.txt /tmp/p2-15-equipped-study/expected.txt
          cargo build --release --locked
          cp target/release/race_engine_rs_v2 /tmp/p2-15-equipped-study/instrumented-engine
      - name: Paired original/observed model for 8 fixed actual-skill-equipped races
        run: |
          node --max-old-space-size=4096 poc/tools/globalsim_p2_15_equipped_runtime_windows.cjs replay \
            /tmp/p2-15-equipped-engine/examples/v77-race.jsonl \
            /tmp/p2-15-equipped-study/original-engine \
            /tmp/p2-15-equipped-study/instrumented-engine \
            /tmp/p2-15-equipped-study/equipped-runtime-window-observations.json \
            > /tmp/p2-15-equipped-study/summary.log
          node - <<'NODE'
          const fs=require('node:fs'),a=require('node:assert/strict');
          const tool=require('./poc/tools/globalsim_p2_15_equipped_runtime_windows.cjs');
          const x=JSON.parse(fs.readFileSync('/tmp/p2-15-equipped-study/equipped-runtime-window-observations.json','utf8'));
          a.equal(x.status,tool.STATUS);
          a.equal(x.provenance.globalSimRevision,'80b54cacf174b54ff6f7ca27ee7f88b5856c0bd1');
          a.equal(x.experiment.fixedModelRaces,8);
          a.equal(x.totals.frames,10413);
          a.equal(x.totals.identicalPhysicalValues,437364);
          a.equal(x.totals.instantiatedSkillDetails,252);
          a.equal(x.totals.pendingWindowEntriesIncludingInactive,252);
          a.equal(x.totals.sampledWindows,210);
          a.equal(x.totals.reservedInactiveDetails,42);
          a.equal(x.totals.modelSkillEvents,173);
          a.equal(x.totals.identicalOriginalSkillEvents,181);
          a(x.totals.observedSkillStagePositions>0);
          a.equal(x.totals.observedSkillStagePositions,x.totals.positionsMatchingPriorPostFrame);
          a(x.totals.identicalPhysicalValues>0);
          a(x.skills['200451'].modelSampledWindows>0);
          a(x.skills['200501'].modelSampledWindows>0);
          a.deepEqual(x.gates,{modelEquippedAndSampled:true,modelSkillEventsCompared:true,
            actualUmaSimSamplesObserved:false,fullUmaSimConditionsMeasured:false,
            gameProcRateEstablished:false,P3Suitable:false,P4UiChanged:false});
          console.log('P2_15_EQUIPPED_MODEL='+JSON.stringify({totals:x.totals,skills:x.skills,gates:x.gates}));
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: p2-15-GlobalSim-equipped-actual-runtime-windows-not-UmaSim-or-game
          path: |
            /tmp/p2-15-equipped-study/equipped-runtime-window-observations.json
            /tmp/p2-15-equipped-study/source-probe.json
            /tmp/p2-15-equipped-study/summary.log
          retention-days: 14
          if-no-files-found: error
