name: One-off Markdown fragment diagnostic
on:
  push:
    branches:
      - docs/reorganize-navigation-and-phase-plans-20261110
    paths:
      - .github/workflows/docs-anchors-once.yml
      - poc/tools/check_markdown_anchors.cjs
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Enumerate invalid internal Markdown anchors without modifying documents
        run: |
          node --check poc/tools/check_markdown_anchors.cjs
          node poc/tools/check_markdown_anchors.cjs
