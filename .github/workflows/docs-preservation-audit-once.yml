name: Documentation preservation audit
on:
  push:
    branches:
      - docs/reorganize-navigation-and-phase-plans-20261110
    paths:
      - .github/workflows/docs-preservation-audit-once.yml
      - poc/tools/audit_doc_reorg.cjs

permissions:
  contents: read

jobs:
  preserve:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Compare moved originals with revised documents
        run: node poc/tools/audit_doc_reorg.cjs --strict
