name: Project Tracking Drift

on:
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * 1'

permissions:
  contents: read
  issues: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate published catalog snapshot and live issue statements
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node poc/tools/check_project_tracking.cjs --issues
