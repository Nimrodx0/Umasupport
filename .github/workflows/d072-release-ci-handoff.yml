name: D072 approved release CI handoff
on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: Approved D072 release proposal PR number
        required: true
        type: number
permissions:
  contents: read
  pull-requests: read
  actions: read
jobs:
  gate:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test read-only handoff
        run: node --test poc/tests/d072_release_ci_gate.test.cjs
      - uses: actions/github-script@v7
        with:
          script: |
            if(context.eventName!=='workflow_dispatch'||context.ref!=='refs/heads/main')throw Error('main dispatch only');
            const raw=context.payload.inputs?.pr_number;
            if(!/^[1-9][0-9]*$/.test(String(raw)))throw Error('PR number required');
            const report=await require('./poc/src/d072_release_ci_gate.cjs').verifyPR({github,...context.repo,prNumber:Number(raw)});
            if(report.baseSha!==context.sha)throw Error('workflow checkout differs from verified base');
            core.info('D072_RELEASE_CI_GATE='+JSON.stringify(report));
            await core.summary.addHeading('Approved proposal CI handoff')
              .addRaw('Fixed head: '+report.headSha+'; ready for maintainer merge: '+report.readyForMaintainerMerge+'. No merge or deployment performed.').write();
            if(!report.readyForMaintainerMerge)core.setFailed('Required CI or mergeability not yet confirmed');
