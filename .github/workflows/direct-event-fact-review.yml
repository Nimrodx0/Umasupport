name: D067 independent direct-event fact review

on:
  pull_request:
    paths:
      - '.github/workflows/direct-event-fact-review.yml'
      - 'poc/src/direct_event_fact_review.cjs'
      - 'poc/tests/direct_event_fact_review.test.cjs'
      - 'poc/config/direct-event-fact-review.v1.json'
      - 'poc/config/direct-event-fact-review-evidence.v1.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Share the live-site lock only for explicit network runs. Offline PRs
  # must not cancel one another's pending jobs.
  group: ${{ github.event_name == 'workflow_dispatch' && 'gametora-direct-new-card-limited-read' || format('{0}-{1}', github.workflow, github.ref) }}
  cancel-in-progress: false

jobs:
  direct-preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate bounded selector and direct source projection
        run: |
          node --test poc/tests/official_gametora_new_card_locator.test.cjs poc/tests/official_gametora_route_dom_extractor.test.cjs poc/tests/direct_event_intake_policy.test.cjs
          node --test poc/tests/direct_event_fact_review.test.cjs
          node --check poc/tools/run_direct_new_card_intake.cjs
          node --check poc/tools/probe_official_gametora_target_cards.cjs
      - name: Resolve immutable latest UmaSim roster and skill blobs
        if: github.event_name == 'workflow_dispatch'
        uses: actions/github-script@v7
        with:
          script: |
            const fs=require('node:fs');
            const c=(await github.rest.repos.getCommit({owner:'mee1080',repo:'umasim',ref:'main'})).data;
            const tree=(await github.rest.git.getTree({owner:'mee1080',repo:'umasim',tree_sha:c.commit.tree.sha,recursive:'1'})).data;
            if(tree.truncated!==false)throw Error('Incomplete UmaSim tree');
            const blob=path=>{
              const matches=tree.tree.filter(x=>x.path===path&&x.type==='blob');
              if(matches.length!==1||!/^[a-f0-9]{40}$/.test(matches[0].sha))throw Error('Missing pinned file '+path);
              return matches[0].sha;
            };
            if(!/^[a-f0-9]{40}$/.test(c.sha))throw Error('Invalid UmaSim commit');
            fs.writeFileSync(process.env.RUNNER_TEMP+'/direct-uma-meta.json',JSON.stringify({commit:c.sha,cardBlob:blob('data/support_card.txt'),skillBlob:blob('data/skill_data.txt')}));
      - name: Obtain only pinned UmaSim data in disposable runner
        if: github.event_name == 'workflow_dispatch'
        run: |
          set -euo pipefail
          SHA=$(node -p "require(process.env.RUNNER_TEMP+'/direct-uma-meta.json').commit")
          [[ "$SHA" =~ ^[0-9a-f]{40}$ ]]
          curl --fail --silent --show-error --location --retry 1 --max-time 30 'https://raw.githubusercontent.com/mee1080/umasim/91952973eb334ae530b8cd76541bce8a01a141cd/data/support_card.txt' -o "$RUNNER_TEMP/direct-before.txt"
          curl --fail --silent --show-error --location --retry 1 --max-time 30 "https://raw.githubusercontent.com/mee1080/umasim/$SHA/data/support_card.txt" -o "$RUNNER_TEMP/direct-current.txt"
          curl --fail --silent --show-error --location --retry 1 --max-time 30 "https://raw.githubusercontent.com/mee1080/umasim/$SHA/data/skill_data.txt" -o "$RUNNER_TEMP/direct-skills.txt"
      - name: Prepare Chrome
        if: github.event_name == 'workflow_dispatch'
        run: |
          npm install --no-save --no-package-lock playwright@1.55.1
          command -v google-chrome || command -v google-chrome-stable
      - name: Verify 20102 and 30322, two cards maximum per invocation
        if: github.event_name == 'workflow_dispatch'
        run: |
          set -euo pipefail
          node poc/tools/run_direct_new_card_intake.cjs "$RUNNER_TEMP/direct-before.txt" "$RUNNER_TEMP/direct-current.txt" "$RUNNER_TEMP/direct-skills.txt" "$RUNNER_TEMP/direct-uma-meta.json" 1 --review-known | tee "$RUNNER_TEMP/review-first.log"
      - name: Verify 30324 in a separate bounded invocation
        if: github.event_name == 'workflow_dispatch'
        run: |
          set -euo pipefail
          node poc/tools/run_direct_new_card_intake.cjs "$RUNNER_TEMP/direct-before.txt" "$RUNNER_TEMP/direct-current.txt" "$RUNNER_TEMP/direct-skills.txt" "$RUNNER_TEMP/direct-uma-meta.json" 4 --review-known | tee "$RUNNER_TEMP/review-last.log"
      - name: Confirm all three independently scoped cards without publication
        if: github.event_name == 'workflow_dispatch'
        run: |
          node - <<'NODE'
          const fs=require('node:fs');
          const prefix='GT_DIRECT_FACT_REVIEW=';
          const read=p=>JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+'/'+p,'utf8').split('\n').find(l=>l.startsWith(prefix)).slice(prefix.length));
          const reports=[read('review-first.log'),read('review-last.log')];
          const rows=reports.flatMap(x=>x.cards);
          if(JSON.stringify(rows.map(x=>x.cardId))!==JSON.stringify(['20102','30322','30324'])||rows.reduce((n,x)=>n+x.events,0)!==12||rows.reduce((n,x)=>n+x.routeCount,0)!==26||rows.reduce((n,x)=>n+x.hintCount,0)!==19||rows.reduce((n,x)=>n+x.scalarCount,0)!==72||rows.some(x=>x.publicationApproved!==false||x.releaseGateBlocked!==true)||reports.some(r=>r.existingCatalogUnchanged!==true))throw Error('Review count or safety mismatch');
          console.log('D067 independent review: 12 events, 26 routes, 19 hints, 72 scalar effects; private candidate only.');
          NODE
