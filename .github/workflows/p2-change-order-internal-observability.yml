name: P2 direct model change_order_onetime state observability

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'poc/tools/globalsim_change_order_internal_probe.cjs'
      - 'poc/tests/globalsim_change_order_internal_probe.test.cjs'
      - '.github/workflows/p2-change-order-internal-observability.yml'

permissions:
  contents: read

jobs:
  model-direct-rank-telemetry:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check exact-source patcher and synthetic same-tick tests
        run: |
          node --check poc/tools/globalsim_change_order_internal_probe.cjs
          node --test poc/tests/globalsim_change_order_internal_probe.test.cjs
      - name: Checkout the exact fixed GlobalSim version
        run: |
          mkdir -p /tmp/p2-global-state
          cd /tmp/p2-global-state
          git init -q
          git remote add origin https://github.com/daftuyda/GlobalSim.git
          git fetch -q --depth 1 origin 80b54cacf174b54ff6f7ca27ee7f88b5856c0bd1
          git checkout -q --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "80b54cacf174b54ff6f7ca27ee7f88b5856c0bd1"
          test -z "$(git status --porcelain)"
      - name: Build the unchanged original v77 engine first
        run: |
          cd /tmp/p2-global-state
          cargo build --release --locked
          mkdir -p /tmp/p2-state-replay
          cp target/release/race_engine_rs_v2 /tmp/p2-state-replay/unmodified-engine
      - name: Instrument a TEMPORARY source clone's frame slots, without editing the predicate
        run: |
          node poc/tools/globalsim_change_order_internal_probe.cjs patch \
            /tmp/p2-global-state/src/lib.rs > /tmp/p2-state-replay/patch-provenance.json
          cd /tmp/p2-global-state
          test "$(git diff --name-only)" = "src/lib.rs"
          git diff -- src/lib.rs | grep -F 'field.order_of(i) as f64 - field.previous_order_of(i) as f64'
          cargo build --release --locked
          cp target/release/race_engine_rs_v2 /tmp/p2-state-replay/probe-engine
      - name: Paired direct original/probe replay of 32 skill-free races
        run: |
          node --max-old-space-size=4096 poc/tools/globalsim_change_order_internal_probe.cjs replay \
            /tmp/p2-global-state/examples/v77-race.jsonl \
            /tmp/p2-state-replay/unmodified-engine \
            /tmp/p2-state-replay/probe-engine \
            /tmp/p2-state-replay/observability.json > /tmp/p2-state-replay/summary.log
          node - <<'NODE'
          const fs=require('node:fs'),assert=require('node:assert/strict'),crypto=require('node:crypto');
          const bytes=fs.readFileSync('/tmp/p2-state-replay/observability.json');
          const x=JSON.parse(bytes);
          assert.equal(x.schemaVersion,1);
          assert.equal(x.globalSimRevision,'80b54cacf174b54ff6f7ca27ee7f88b5856c0bd1');
          assert.equal(x.design.races,32);
          assert.equal(x.validation.allModelPhysicsColumnsIdentical,true);
          assert(x.validation.exactRankDifferenceTicks>0);
          assert(x.observations.movedUpTicks>0);
          assert(x.observations.movedDownTicks>0);
          assert.equal(x.rows.length,32);
          const digest=crypto.createHash('sha256').update(bytes).digest('hex');
          console.log(JSON.stringify({status:x.status,
           modelSHA256:digest,
           design:x.design,validation:x.validation,observations:x.observations},null,2));
          NODE
      - name: Retain derived observations only (no raw third-party data or patched engine)
        uses: actions/upload-artifact@v4
        with:
          name: p2-model-change-order-observability-32-race-derived
          path: /tmp/p2-state-replay/observability.json
          retention-days: 14
          if-no-files-found: error
