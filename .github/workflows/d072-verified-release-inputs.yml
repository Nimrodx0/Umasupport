name: D072 verified release input preflight
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/d072-verified-release-inputs.yml'
      - 'poc/src/d072_verified_umasim_source.cjs'
      - 'poc/src/d072_github_reviewed_intake.cjs'
      - 'poc/tests/d072_verified_release_inputs.test.cjs'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verified-sources:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test immutable source and review intake
        run: node --test poc/tests/d072_verified_release_inputs.test.cjs
      - name: Verify actual official UmaSim source pins and existing public catalog
        uses: actions/github-script@v7
        with:
          script: |
            const {createReviewedIntake}=require('./poc/src/d072_github_reviewed_intake.cjs');
            const catalog=require('./poc/data/reviewed_events.v1.json');
            const approvals=require('./poc/src/current_public_event_approvals.cjs').forCatalog(catalog);
            const intake=createReviewedIntake({github,...context.repo});
            const report=await intake.verifyCurrent({existingCatalog:catalog,existingApprovals:approvals});
            core.info('D072_VERIFIED_RELEASE_INPUTS='+JSON.stringify(report));
