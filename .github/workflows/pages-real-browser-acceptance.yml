name: One-Off Published Pages Browser Acceptance
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/pages-real-browser-acceptance.yml'
      - 'poc/tests/pages_live_browser.cjs'
      - 'poc/data/reviewed_events.v1.json'
      - 'poc/live.html'
      - 'index.html'
      - 'poc/src/public_event_catalog.js'
  workflow_dispatch:
  workflow_call:
    inputs:
      expected_head:
        description: 'Exact published data/events head for post-append acceptance'
        type: string
        required: true

permissions:
  contents: read

jobs:
  pages-chromium:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Chromium for actual published Pages test
        run: |
          npm install --no-save --no-package-lock playwright@1.55.1
          npx playwright install --with-deps chromium
      - name: Wait for exact app and fixed recovery catalog on Pages (bounded)
        run: |
          node - <<'NODE'
          const fs=require('node:fs'),crypto=require('node:crypto');
          const sha=x=>crypto.createHash('sha256').update(x).digest('hex');
          const paths=['index.html','poc/live.html','poc/src/public_event_catalog.js','poc/data/reviewed_events.v1.json'];
          const targets=paths.map(p=>[p,sha(fs.readFileSync(p))]);
          (async()=>{
            for(let n=0;n<18;n++){
              try{
                const verified=await Promise.all(targets.map(async([p,hash])=>{
                  const r=await fetch('https://nimrodx0.github.io/Umasupport/'+p+'?release='+process.env.GITHUB_SHA,{cache:'no-store',signal:AbortSignal.timeout(15000)});
                  return r.ok&&sha(Buffer.from(await r.arrayBuffer()))===hash;
                }));
                if(verified.every(Boolean)){console.log('Exact deployed app and recovery catalog verified');return;}
              }catch(e){console.log('Pages check attempt '+(n+1)+' unavailable');}
              await new Promise(r=>setTimeout(r,10000));
            }
            throw Error('Pages has not deployed the exact checkout app and recovery catalog');
          })().catch(e=>{console.error(e);process.exitCode=1;});
          NODE
      - name: Test live GitHub Pages in Chromium with live sources
        env:
          D074_EXPECTED_HEAD: ${{ inputs.expected_head || '' }}
        run: node poc/tests/pages_live_browser.cjs
