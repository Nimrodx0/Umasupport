name: One-Off Published Pages Browser Acceptance
on:
  pull_request:
    paths:
      - .github/workflows/pages-real-browser-acceptance.yml
      - poc/tests/pages_live_browser.cjs
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pages-chromium:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Chromium for actual published Pages test
        run: |
          npm install --no-save --no-package-lock playwright@1.55.1
          npx playwright install --with-deps chromium
      - name: Test live GitHub Pages in Chromium with live sources
        run: node poc/tests/pages_live_browser.cjs
