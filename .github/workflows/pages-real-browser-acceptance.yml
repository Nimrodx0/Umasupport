name: One-Off Published Pages Browser Acceptance
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/pages-real-browser-acceptance.yml'
      - 'poc/tests/pages_live_browser.cjs'
      - 'poc/data/reviewed_events.v1.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pages-chromium:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Chromium for actual published Pages test
        run: |
          npm install --no-save --no-package-lock playwright@1.55.1
          npx playwright install --with-deps chromium
      - name: Wait for this exact catalog on Pages (bounded)
        run: |
          node - <<'NODE'
          const fs=require('node:fs'),crypto=require('node:crypto');
          const sha=x=>crypto.createHash('sha256').update(x).digest('hex');
          const target=sha(fs.readFileSync('poc/data/reviewed_events.v1.json'));
          (async()=>{
            for(let n=0;n<18;n++){
              try{
                const r=await fetch('https://nimrodx0.github.io/Umasupport/poc/data/reviewed_events.v1.json?release='+process.env.GITHUB_SHA,{cache:'no-store',signal:AbortSignal.timeout(15000)});
                if(r.ok&&sha(Buffer.from(await r.arrayBuffer()))===target){console.log('Exact deployed catalog verified');return;}
              }catch(e){console.log('Pages check attempt '+(n+1)+' unavailable');}
              await new Promise(r=>setTimeout(r,10000));
            }
            throw Error('Pages has not deployed the exact checkout catalog');
          })().catch(e=>{console.error(e);process.exitCode=1;});
          NODE
      - name: Test live GitHub Pages in Chromium with live sources
        run: node poc/tests/pages_live_browser.cjs
