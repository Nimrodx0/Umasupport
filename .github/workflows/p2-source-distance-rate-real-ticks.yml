name: P2.15 source distance_rate on observed GlobalSim pre-skill positions

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'poc/tools/globalsim_p2_15_source_distance_rate_ticks.cjs'
      - 'poc/tests/globalsim_p2_15_source_distance_rate_ticks.test.cjs'
      - 'poc/src/skill_source_whole_tick_monitor.cjs'
      - 'poc/src/skill_source_race_opportunity.cjs'
      - 'poc/src/skill_source_position_stage_facts.cjs'
      - 'poc/src/skill_source_unknown_route_candidates.cjs'
      - 'poc/tests/skill_source_unknown_route_candidates.test.cjs'
      - 'docs/evidence/skills/skill-p2-15-observed-unknown-route-witness-20261113.md'
      - 'poc/tools/globalsim_p2_15_source_position_families_ticks.cjs'
      - 'poc/tests/skill_source_position_stage_facts.test.cjs'
      - 'docs/evidence/skills/skill-p2-15-source-position-family-join-20261113.md'
      - 'docs/plans/skill-conditions/p2.md'
      - 'poc/tests/skill_source_race_opportunity.test.cjs'
      - 'poc/tools/globalsim_p2_15_preskill_phase_position.cjs'
      - 'docs/evidence/skills/skill-p2-15-source-distance-rate-real-ticks-20261112.md'
      - '.github/workflows/p2-source-distance-rate-real-ticks.yml'

permissions:
  contents: read

jobs:
  source-distance-rate-real-model-ticks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify strict Kotlin predicate compatibility and synthetic replay fail-closed unit tests
        run: |
          node --check poc/tools/globalsim_p2_15_source_distance_rate_ticks.cjs
          node --check poc/src/skill_source_race_opportunity.cjs
          node --check poc/src/skill_source_position_stage_facts.cjs
          node --check poc/src/skill_source_unknown_route_candidates.cjs
          node --test poc/tests/skill_source_unknown_route_candidates.test.cjs
          node --check poc/tools/globalsim_p2_15_source_position_families_ticks.cjs
          node --test poc/tests/skill_source_position_stage_facts.test.cjs
          node --test poc/tests/globalsim_p2_15_source_distance_rate_ticks.test.cjs poc/tests/skill_source_race_opportunity.test.cjs
      - name: Fetch fixed original UmaSim skill data and semantic anchors (research runtime only)
        run: |
          mkdir -p /tmp/p2-15-dist-study
          base=https://raw.githubusercontent.com/mee1080/umasim/f6e4501ee6c6c2d4ac8698e7796e309d31575bde
          curl --fail --silent --show-error --location "$base/data/skill_data.txt" -o /tmp/p2-15-dist-study/source-skills.txt
          curl --fail --silent --show-error --location "$base/race/src/commonMain/kotlin/io/github/mee1080/umasim/race/calc2/SkillChecker.kt" -o /tmp/p2-15-dist-study/checker.kt
          curl --fail --silent --show-error --location "$base/race/src/commonMain/kotlin/io/github/mee1080/umasim/race/data2/SkillData.kt" -o /tmp/p2-15-dist-study/skillData.kt
          curl --fail --silent --show-error --location "$base/race/src/commonMain/kotlin/io/github/mee1080/umasim/race/calc2/RaceState.kt" -o /tmp/p2-15-dist-study/RaceState.kt
          curl --fail --silent --show-error --location "$base/race/src/commonMain/kotlin/io/github/mee1080/umasim/race/calc2/RaceCalculator.kt" -o /tmp/p2-15-dist-study/RaceCalculator.kt
          echo "4c036527bbe6b5aad34d7f12110a06094c9071514e37fdfc68ae195403333be5  /tmp/p2-15-dist-study/source-skills.txt" | sha256sum -c -
      - name: Build fixed ORIGINAL GlobalSim retail engine
        run: |
          mkdir -p /tmp/p2-15-dist-engine
          cd /tmp/p2-15-dist-engine
          git init -q
          git remote add origin https://github.com/daftuyda/GlobalSim.git
          git fetch -q --depth 1 origin 80b54cacf174b54ff6f7ca27ee7f88b5856c0bd1
          git checkout -q --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = 80b54cacf174b54ff6f7ca27ee7f88b5856c0bd1
          cargo build --release --locked
          cp target/release/race_engine_rs_v2 /tmp/p2-15-dist-study/original-engine
      - name: Patch only observational position slots at original model priority call sites
        run: |
          node poc/tools/globalsim_p2_15_preskill_phase_position.cjs patch \
            /tmp/p2-15-dist-engine > /tmp/p2-15-dist-study/source-position-patch.json
          cd /tmp/p2-15-dist-engine
          git diff --name-only | sort > /tmp/p2-15-dist-study/modified.txt
          printf "src/lib.rs\nsrc/race_field.rs\nsrc/race_field_retail.rs\n" > /tmp/p2-15-dist-study/expected.txt
          cmp /tmp/p2-15-dist-study/modified.txt /tmp/p2-15-dist-study/expected.txt
          cargo build --release --locked
          cp target/release/race_engine_rs_v2 /tmp/p2-15-dist-study/observed-engine
      - name: Join actual model position and exact source distance_rate at same stage for 8 races
        run: |
          node --max-old-space-size=4096 poc/tools/globalsim_p2_15_source_distance_rate_ticks.cjs replay \
            /tmp/p2-15-dist-engine/examples/v77-race.jsonl \
            /tmp/p2-15-dist-study/original-engine \
            /tmp/p2-15-dist-study/observed-engine \
            /tmp/p2-15-dist-study/source-skills.txt \
            /tmp/p2-15-dist-study/checker.kt \
            /tmp/p2-15-dist-study/skillData.kt \
            /tmp/p2-15-dist-study/source-distance-rate-model-join.json \
            > /tmp/p2-15-dist-study/summary.log
          node - <<'NODE'
          const fs=require('node:fs'),a=require('node:assert/strict');
          const t=require('./poc/tools/globalsim_p2_15_source_distance_rate_ticks.cjs');
          const r=JSON.parse(fs.readFileSync('/tmp/p2-15-dist-study/source-distance-rate-model-join.json','utf8'));
          a.equal(r.status,t.STATUS);
          a.equal(r.totals.races,8);
          a(r.denominators.sourceDistanceRateSkills>0);
          a(r.denominators.sourcePredicateOccurrences>=r.denominators.sourceDistanceRateSkills);
          a(r.totals.modelRunnerPriorityTicks>20000);
          a(r.totals.distanceRatePredicateFacts>1000);
          a.equal(r.totals.modelProgressRateKnownRunnerTicks+
            r.totals.modelProgressRateHeldBoundaryRunnerTicks,
            r.totals.modelRunnerPriorityTicks);
          a.equal(r.totals.sourceConditionTrueSkillRunnerTicks+
            r.totals.sourceConditionFalseSkillRunnerTicks+
            r.totals.sourceConditionUnknownSkillRunnerTicks,
            r.totals.modelRunnerPriorityTicks*r.denominators.sourceDistanceRateSkills);
          a.equal(r.gates.realGlobalSimPreSkillPositionsObserved,true);
          a.equal(r.gates.originalUmaSimRaceTicksObserved,false);
          a.equal(r.gates.originalUmaSimAllDynamicPredicatesObserved,false);
          a.equal(r.gates.originalSourceFullGameSkillActivated,false);
          a.equal(r.gates.realGameSkillProcRateComputed,false);
          a.equal(r.gates.P3CardScoringApproved,false);
          a.equal(r.gates.P4UiChanged,false);
          a.equal(r.schemaVersion,2);
          const opp=r.raceOpportunity;
          a.equal(opp.status,'P2.15-source-condition-on-observed-model-race-runner-traces-not-game');
          a.equal(opp.gates.originalSkillEquipped,false);
          a.equal(opp.gates.actualSkillProcRateMeasured,false);
          a.equal(opp.gates.eligibleForP3CardScoring,false);
          a.equal(opp.gates.allActualGameRaceOpportunityObserved,false);
          a.equal(r.gates.fullRaceSkillOpportunityRateEstablished,false);
          a.equal(opp.totals.verdicts['observed-at-least-once-true'],734);
          a.equal(opp.totals.sourceTickStates.true,r.totals.sourceConditionTrueSkillRunnerTicks);
          a.equal(opp.totals.sourceTickStates.false,r.totals.sourceConditionFalseSkillRunnerTicks);
          a.equal(opp.totals.sourceTickStates.unknown,r.totals.sourceConditionUnknownSkillRunnerTicks);
          a.equal(opp.totals.skillRunnerPriorityTicks,
            r.totals.modelRunnerPriorityTicks*r.denominators.sourceDistanceRateSkills);
          a(opp.denominators.skillRunnerRaceTrials>opp.denominators.observedSkillRunnerRaceTrials/2);
          a.equal(opp.totals.runnerRaceTrials,Object.values(opp.totals.verdicts).reduce((x,y)=>x+y,0));
          a.equal(opp.byStyle.length,4);
          a(opp.bySkillStyle.length>0&&opp.bySkillStyleContext.length>0);
          a.equal(opp.bySkillStyle.reduce((x,y)=>x+y.runnerRaceTrials,0),opp.totals.runnerRaceTrials);
          a.equal(opp.bySkillStyleContext.reduce((x,y)=>x+y.runnerRaceTrials,0),opp.totals.runnerRaceTrials);
          a(opp.bySkillStyle.every(x=>x.suitabilityLabel===null));
          console.log('P2_15_DIST_REAL_TICKS='+JSON.stringify({
            denominators:r.denominators,totals:r.totals,
            raceOpportunity:{denominators:opp.denominators,verdicts:opp.totals.verdicts,
              byStyle:opp.byStyle.map(x=>({style:x.style,runnerRaceTrials:x.runnerRaceTrials,
                verdicts:x.verdicts}))},gates:r.gates
          }));
          NODE
      - name: Reuse the exact fixed model engines and join five more original source positional families
        run: |
          node --max-old-space-size=4096 poc/tools/globalsim_p2_15_source_position_families_ticks.cjs replay \
            /tmp/p2-15-dist-engine/examples/v77-race.jsonl \
            /tmp/p2-15-dist-study/original-engine \
            /tmp/p2-15-dist-study/observed-engine \
            /tmp/p2-15-dist-study/source-skills.txt \
            /tmp/p2-15-dist-study/checker.kt \
            /tmp/p2-15-dist-study/skillData.kt \
            /tmp/p2-15-dist-study/RaceState.kt \
            /tmp/p2-15-dist-study/RaceCalculator.kt \
            /tmp/p2-15-dist-study/source-position-families-model-join.json \
            > /tmp/p2-15-dist-study/source-position-family-summary.log
          node - <<'NODE'
          const a=require('node:assert/strict'),fs=require('node:fs');
          const t=require('./poc/tools/globalsim_p2_15_source_position_families_ticks.cjs');
          const x=JSON.parse(fs.readFileSync(
           '/tmp/p2-15-dist-study/source-position-families-model-join.json','utf8'));
          a.equal(x.status,t.STATUS);
          a.equal(x.validation.modelRunnerPriorityTicks,108844);
          a.equal(x.comparison.sourceSkillCount,253);
          a.equal(x.validation.originalModelPhysicalColumnsUnchanged,437532);
          a.equal(x.comparison.sourceSkillsWithNewPredicateFamilies,83);
          a.equal(x.comparison.originalSourcePredicateOccurrences,152);
          a.equal(x.comparison.emittedModelSourcePredicateFacts,16539766);
          a.equal(x.comparison.modelPriorityRunnerTicksWithSourcePositionFacts,108844);
          a.deepEqual(x.comparison.sourceWholeConditionSkillRunnerTickChanges,{
            true:18997,false:3451969,unknown:-3470966
          });
          a.deepEqual(x.comparison.joinedRunnerRaceVerdicts,{
            'observed-at-least-once-true':778,
            'observed-unknown-without-true':16535,
            'observed-all-false':3939,
            'no-observed-priority-ticks':0
          });
          a.deepEqual(x.comparison.changedSkillStyleCells.map(z=>[
            z.sourceNumericId,z.style,z.additionalConfirmedRunnerRaces
          ]),[['112401111','Senkou',18],['120251','Sasi',26]]);
          a.deepEqual(x.design.verifiedSourceFamilies,[
            'phase','phase_firsthalf','phase_laterhalf','remain_distance','furlong'
          ]);
          a(x.comparison.sourceSkillsWithNewPredicateFamilies>0);
          a(x.comparison.originalSourcePredicateOccurrences>0);
          a(x.comparison.emittedModelSourcePredicateFacts>0);
          a.equal(x.comparison.baselineRunnerRaceVerdicts['observed-at-least-once-true'],734);
          a.equal(x.comparison.baselineRunnerRaceVerdicts['observed-unknown-without-true'],16579);
          a.equal(x.comparison.baselineRunnerRaceVerdicts['observed-all-false'],3939);
          a(x.comparison.joinedRunnerRaceVerdicts['observed-at-least-once-true']>=734);
          a(x.comparison.joinedRunnerRaceVerdicts['observed-unknown-without-true']<=16579);
          a(x.comparison.joinedRunnerRaceVerdicts['observed-all-false']>=3939);
          a.equal(x.comparison.sourceWholeConditionSkillRunnerTickChanges.true+
            x.comparison.sourceWholeConditionSkillRunnerTickChanges.false+
            x.comparison.sourceWholeConditionSkillRunnerTickChanges.unknown,0);
          a.equal(x.byStyle.length,4);
          a.equal(x.gates.actualOriginalUmaSimStartPositionObserved,false);
          a.equal(x.gates.originalSourceFullANDMeasured,false);
          a.equal(x.gates.actualGameSkillProcRateMeasured,false);
          a.equal(x.gates.P3CardScoringApproved,false);
          a.equal(x.gates.P4UiChanged,false);
          const u=x.unknownRouteTriage;
          a.equal(u.status,
            'P2.15-unresolved-original-source-route-witness-candidates-model-only');
          a.equal(u.counts.sourceSkillRunnerRaceTrials,21252);
          a.equal(u.counts.observedUnknownWithoutTrueRunnerRaceTrials,16535);
          a.equal(u.counts.samplesWithFirstMinimumUnknownRoute,16535);
          a.equal(u.byCandidateCombination.reduce((n,r)=>
            n+r.representativeRunnerRaceTrials,0),16535);
          a.equal(u.byStyle.reduce((n,r)=>n+r.unresolvedRunnerRaceTrials,0),16535);
          a(u.byCandidateGate.length>0);
          a.equal(u.counts.unresolvedTrialsWithOneGateWitness,7158);
          a.equal(u.counts.unresolvedTrialsWithTwoOrMoreGateWitness,9377);
          a.equal(u.counts.witnessesWithPreconditionLatchUnknown,3555);
          a(u.counts.witnessesWithIgnoredSourceRankGate>0);
          a(u.counts.witnessesWhoseOnlyGateIsIgnoredSourceRank>0);
          a.deepEqual(u.definition.pinnedUmaSimCheckerExplicitlyIgnoresRankTypes,
            ['order','order_rate']);
          const gate=(name)=>u.byCandidateGate.find(r=>r.gateKind===name);
          a.equal(gate('order_rate').representativeRunnerRaceTrials,9356);
          a.equal(gate('order').representativeRunnerRaceTrials,3138);
          a.equal(gate('corner').representativeRunnerRaceTrials,2908);
          a.equal(gate('precondition-latch-unknown').representativeRunnerRaceTrials,3555);
          a.equal(gate('order_rate').originalUmaSimCheckerDisposition,
            'explicitly-ignored-by-pinned-UmaSim-checker');
          a.equal(gate('order').originalUmaSimCheckerDisposition,
            'explicitly-ignored-by-pinned-UmaSim-checker');
          a.equal(gate('corner').originalUmaSimCheckerDisposition,
            'unobserved-source-predicate-requires-semantics-and-model-stage-validation');
          a(u.counts.witnessTicksExaminedInUnresolvedTrials>0);
          a.equal(u.gates.historicalPreconditionsHeldSeparate,true);
          a.equal(u.gates.allRemainingUnknownsProvenCausedByWitness,false);
          a.equal(u.gates.originalSourceRuntimeSkillActivationObserved,false);
          a.equal(u.gates.P3ScoringApproved,false);
          console.log('P2_15_UNKNOWN_ROUTE_WITNESSES='+JSON.stringify({
            counts:u.counts,topGates:u.byCandidateGate.slice(0,15),
            topCombinations:u.byCandidateCombination.slice(0,15),
            byStyle:u.byStyle,gates:u.gates
          }));
          console.log('P2_15_NEW_SOURCE_POSITION_JOIN='+JSON.stringify({
            validation:x.validation,comparison:x.comparison,
            byStyle:x.byStyle.map(r=>({style:r.style,verdicts:r.verdicts})),
            gates:x.gates
          }));
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: p2-15-source-distance-rate-real-globalSim-position-not-umaSim-game
          path: |
            /tmp/p2-15-dist-study/source-distance-rate-model-join.json
            /tmp/p2-15-dist-study/source-position-patch.json
            /tmp/p2-15-dist-study/summary.log
            /tmp/p2-15-dist-study/source-position-families-model-join.json
            /tmp/p2-15-dist-study/source-position-family-summary.log
          retention-days: 14
          if-no-files-found: error
