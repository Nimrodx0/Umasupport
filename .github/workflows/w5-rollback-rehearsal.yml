name: W5 local rollback and recovery rehearsal
on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/w5-rollback-rehearsal.yml'
      - 'poc/tests/browser_w5_release_rollback.cjs'
      - 'poc/src/settings.js'
      - 'poc/src/live_app.js'
permissions:
  contents: read
jobs:
  local-rollback:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Retrieve exact previously accepted version into temporary directory
        run: |
          git fetch --depth=1 origin 441046b7e2d2247c1c8ea534e9bf0b1f3ef9edd0
          mkdir "$RUNNER_TEMP/rollback-base"
          git archive 441046b7e2d2247c1c8ea534e9bf0b1f3ef9edd0 | tar -x -C "$RUNNER_TEMP/rollback-base"
      - name: Install Chromium
        run: |
          npm install --no-save --no-package-lock playwright@1.55.1
          npx playwright install --with-deps chromium
      - name: Verify old and current releases on same local origin
        run: node poc/tests/browser_w5_release_rollback.cjs "$RUNNER_TEMP/rollback-base"
