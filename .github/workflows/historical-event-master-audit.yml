name: Historical Support Story-ID Cross-check

on:
  pull_request:
    paths:
      - .github/workflows/historical-event-master-audit.yml
      - poc/tools/audit_historical_event_master.py
      - poc/tests/test_historical_event_master.py
      - poc/tools/audit_story_title_links.py
      - poc/tests/test_story_title_links.py
      - poc/tools/audit_story_residual_metadata.py
      - poc/tests/test_story_residual_metadata.py
      - poc/src/checker_candidate_pipeline.cjs
  workflow_dispatch:

permissions:
  contents: read

jobs:
  historical-event-links:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run synthetic SQLite regression first
        run: python3 -m unittest discover -s poc/tests -p 'test_historical_event_master.py' -v
      - name: Check event-title overlap logic using synthetic SQLite
        run: python3 -m unittest discover -s poc/tests -p 'test_story_title_links.py' -v
      - name: Verify story-ID residual tests with synthetic SQLite
        run: python3 -m unittest discover -s poc/tests -p 'test_story_residual_metadata.py' -v
      - name: Fetch exact public source snapshots into temporary directory
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/uma-event-master"
          curl --fail --silent --show-error --location --retry 1 --max-time 180 \
            --output "$RUNNER_TEMP/uma-event-master/support_card.txt" \
            "https://raw.githubusercontent.com/mee1080/umasim/cf9366f6a487bd8f197b53d8a11981207beb9f6c/data/support_card.txt"
          curl --fail --silent --show-error --location --retry 1 --max-time 240 \
            --output "$RUNNER_TEMP/uma-event-master/master.mdb" \
            "https://raw.githubusercontent.com/SimpleSandman/UmaMusumeMetaMasterMDB/5a8ec1356859a35e245edef0d40da740e652df68/master/master.mdb"
          curl --fail --silent --show-error --location --retry 1 --max-time 180 \
            --output "$RUNNER_TEMP/uma-event-master/checker.json" \
            "https://raw.githubusercontent.com/Cilda/UmaUmaChecker/30ec4d0c3dd61d1e208b0e5c3853c22a5a10f49c/UmaUmaChecker/Library/Events.json"
          echo "153213019b5232df6c211427b862978218b60df6baee03c2a5fee75e0966d424  $RUNNER_TEMP/uma-event-master/support_card.txt" | sha256sum -c -
          echo "46363929ab097edf164d78a1e8f8d212dbf8c440a7c44431079198ca167002cb  $RUNNER_TEMP/uma-event-master/master.mdb" | sha256sum -c -
      - name: Create candidate-only IDs and digest inventory (no event text output)
        shell: bash
        run: |
          set -euo pipefail
          node poc/tools/build_checker_catalog.cjs \
            --local "$RUNNER_TEMP/uma-event-master/support_card.txt" "$RUNNER_TEMP/uma-event-master/checker.json" \
            --candidates "$RUNNER_TEMP/uma-event-master/candidates.json" \
            > "$RUNNER_TEMP/uma-event-master/candidate-summary.json"
          node -e "const r=require(process.argv[1]);if(r.matchedCards!==417||r.unmatchedModelIds.length!==0)process.exit(2)" \
            "$RUNNER_TEMP/uma-event-master/candidate-summary.json"
          node -e "const r=require(process.argv[1]);console.log('Candidate counts only:',r.matchedCards,'cards;',r.eventCount,'records;',r.emptyCards,'source-empty cards') " \
            "$RUNNER_TEMP/uma-event-master/candidate-summary.json"
      - name: Compare old master direct story IDs and checker candidate event counts
        shell: bash
        run: |
          set -euo pipefail
          python3 poc/tools/audit_historical_event_master.py \
            --umasim "$RUNNER_TEMP/uma-event-master/support_card.txt" \
            --master "$RUNNER_TEMP/uma-event-master/master.mdb" \
            --candidate "$RUNNER_TEMP/uma-event-master/candidates.json" \
            --expect-source-count 563 \
            --source-revision "mee1080/umasim@cf9366f6 (2026-10-13)" \
            --master-revision "SimpleSandman/UmaMusumeMetaMasterMDB@5a8ec135 (2025-10-10)" \
            --candidate-revision "Cilda/UmaUmaChecker@30ec4d0c (2026-10-17)" \
            > "$RUNNER_TEMP/uma-event-master/report.json"
          python3 - <<'PY'
          import json,os,pathlib
          r=json.loads((pathlib.Path(os.environ["RUNNER_TEMP"])/"uma-event-master/report.json").read_text())
          assert r["sourceCardCount"] == 563
          assert r["candidateSourceCards"] == 417
          assert sum(x["sourceCards"] for x in r["byRarity"].values()) == 563
          print("HISTORICAL SNAPSHOT: NOT CURRENT GAME EVENT COVERAGE")
          for field in ("sourceCardCount","historicalMasterCardCount","historicalDirectStoryRows",
                        "sourceNotInOldMasterCount","oldMasterWithoutCardDirectStoryCount",
                        "historicalSharedCharacterStoryRows", "oldMasterWithoutDirectOrSharedStoryCount",
                        "unusedSharedCharaCount",
                        "candidateSourceCards","candidateRecords",
                        "lessCandidateThanHistoricalDirectStoryCount","byRarity",
                        "sourceSha256","masterSha256"):
              print(field, "=", r[field])
          print("Candidate < historic direct story: card ID / master count / candidate count")
          for row in r["possibleCardSpecificGaps"]:
              print(row["cardId"], row["historicalDirectStories"], row["checkerCandidateEvents"])
          print("Version-gap card count only:",len(r["sourceNotInOldMasterIds"]))
          print("Direct-less historic card count only:",len(r["oldMasterWithoutCardDirectStoryIds"]))
          print("Historic source cards with neither direct nor simple shared-character events:",
                len(r["oldMasterWithoutDirectOrSharedStoryIds"]))
          print("Caveat:",r["scope"])
          PY

      - name: Compare category 181 by verified story_id, fail closed on absent titles
        shell: bash
        run: |
          set -euo pipefail
          python3 poc/tools/audit_story_title_links.py \
            --umasim "$RUNNER_TEMP/uma-event-master/support_card.txt" \
            --master "$RUNNER_TEMP/uma-event-master/master.mdb" \
            --candidates "$RUNNER_TEMP/uma-event-master/candidates.json" \
            --title-index story_id \
            --focus-only \
            > "$RUNNER_TEMP/uma-event-master/title-summary.json"
          python3 - <<'PY'
          import json,os,pathlib
          r=json.loads((pathlib.Path(os.environ["RUNNER_TEMP"])/"uma-event-master/title-summary.json").read_text())
          assert r["candidateCards"]==417 and r["sourceCards"]==563
          assert r["titleLookupColumn"]=="story_id"
          assert sum(x.get("historicalTitlesResolved",0) for x in r["byRarity"].values()) == 1028, \
              "Historical category 181 title join incomplete; do not treat missing text as unmatched event."
          assert sum(x.get("historicalTitlesMissing",0) for x in r["byRarity"].values()) == 0
          assert r["focus30241"]["historicalDirectStoryRows"]==18
          assert r["focus30241"]["checkerCandidateRecords"]==17
          print("PROVISIONAL TITLE MATCHING (NOT OFFICIAL CHECKER EVENT IDs)")
          print("Historical story title lookup:",r["titleLookupColumn"])
          print("All-card by rarity counts:",r["byRarity"])
          print("30241 exact normalized title counts:",r["focus30241"])
          print("Scope:",r["scope"])
          PY

      - name: Diagnose typography-only matches without accepting them as event IDs
        shell: bash
        run: |
          set -euo pipefail
          python3 poc/tools/audit_story_title_links.py \
            --umasim "$RUNNER_TEMP/uma-event-master/support_card.txt" \
            --master "$RUNNER_TEMP/uma-event-master/master.mdb" \
            --candidates "$RUNNER_TEMP/uma-event-master/candidates.json" \
            --title-index story_id \
            --normalization typography \
            --focus-only \
            > "$RUNNER_TEMP/uma-event-master/title-typography.json"
          python3 - <<'PY'
          import json,os,pathlib
          d=pathlib.Path(os.environ["RUNNER_TEMP"])/"uma-event-master"
          a=json.loads((d/"title-summary.json").read_text())
          b=json.loads((d/"title-typography.json").read_text())
          assert a["normalization"]=="strict" and b["normalization"]=="typography"
          assert b["sourceCards"]==563 and b["candidateCards"]==417
          for rarity in ("SSR","SR"):
              strict=a["byRarity"][rarity]["exactNormalizedTitleOverlaps"]
              loose=b["byRarity"][rarity]["typographicTitleOverlaps"]
              assert loose>=strict, "Punctuation normalization must not reduce overlapping names"
          strict=a["focus30241"]["provisionalExactTitleOverlap"]
          loose=b["focus30241"]["provisionalTypographicOverlap"]
          assert loose>=strict
          print("TYPOGRAPHIC ALTERNATIVES ONLY; NEVER AUTO-LINK AN EVENT ID")
          print("30241 strict/typographic overlap:",strict,loose)
          print("30241 remaining title differences (not game omissions):",
                b["focus30241"]["historicalTitlesNotTypographicInChecker"],
                b["focus30241"]["checkerTitlesNotTypographicInMaster"])
          print("30241 possible typographic fingerprint collisions (master / Checker):",
                b["focus30241"]["duplicateHistoricalTitleRows"],
                b["focus30241"]["duplicateCheckerTitleRows"])
          print("Overall SSR+SR typographic overlaps:",
                sum(b["byRarity"][r]["typographicTitleOverlaps"] for r in ("SSR","SR")))
          PY

      - name: Classify unresolved historical story metadata without title text
        shell: bash
        run: |
          set -euo pipefail
          python3 poc/tools/audit_story_residual_metadata.py \
            --umasim "$RUNNER_TEMP/uma-event-master/support_card.txt" \
            --master "$RUNNER_TEMP/uma-event-master/master.mdb" \
            --candidates "$RUNNER_TEMP/uma-event-master/candidates.json" \
            --focus 30241 \
            --focus-only \
            > "$RUNNER_TEMP/uma-event-master/story-residuals.json"
          python3 - <<'PY'
          import json,os,pathlib
          base=pathlib.Path(os.environ["RUNNER_TEMP"])/"uma-event-master"
          r=json.loads((base/"story-residuals.json").read_text())
          title=json.loads((base/"title-typography.json").read_text())
          assert r["focus"]["cardId"]=="30241"
          assert r["focus"]["historicalStoryCount"]==18
          assert r["focus"]["candidateCount"]==17
          assert r["focus"]["provisionalTypographyMatches"] == title["focus30241"]["provisionalTypographicOverlap"]
          assert r["focus"]["unmatchedHistoricalTitleRows"] == title["focus30241"]["historicalTitlesNotTypographicInChecker"]
          assert r["allSSR_SR"]["provisionalTypographyMatches"] == sum(
              title["byRarity"][rarity]["typographicTitleOverlaps"] for rarity in ("SSR","SR"))
          assert r["allSSR_SR"]["historicalStoryRowsSSR_SR"]==1017
          assert r["allSSR_SR"]["candidateEventsSSR_SR"]==2099
          print("HISTORICAL STORY RESIDUAL METADATA (NOT GAME CONTENT COMPLETENESS)")
          print("30241:",json.dumps(r["focus"],sort_keys=True))
          print("All SSR/SR:",r["allSSR_SR"])
          print("Residual event_category numeric distribution:",r["residualMetadataByEventCategory"])
          print("Caveat:",r["explanation"])
          PY
