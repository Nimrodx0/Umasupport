name: D067 named production-shape rehearsal
on:
  pull_request:
    paths:
      - '.github/workflows/direct-production-shape.yml'
      - 'poc/tools/verify_direct_release_shape.cjs'
      - 'poc/src/direct_event_fact_review.cjs'
      - 'poc/config/direct-named-release-d068-20261127.v1.json'
      - 'poc/src/direct_named_release_d068.cjs'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: gametora-direct-new-card-limited-read
  cancel-in-progress: false
jobs:
  rehearsal:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate named candidate and exact identity
        run: |
          node --test poc/tests/direct_event_fact_review.test.cjs poc/tests/official_gametora_new_card_locator.test.cjs
          node --check poc/tools/verify_direct_release_shape.cjs
      # One-time D068 exact payload review passed run 45926697083.
      # Do not revisit already-published cards on further PRs or manual runs.
      # New batches use their own bounded review and content-bound evidence.
