name: Feasibility of direct GameTora support event sourcing

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/official-gametora-feasibility.yml'
      - 'poc/src/official_gametora_probe.cjs'
      - 'poc/tests/official_gametora_probe.test.cjs'
      - 'poc/tools/probe_official_gametora_browser.cjs'
      - 'poc/src/official_gametora_title_crosscheck.cjs'
      - 'poc/tests/official_gametora_title_crosscheck.test.cjs'
      - 'poc/src/official_gametora_numeric_fact_parser.cjs'
      - 'poc/tests/official_gametora_numeric_fact_parser.test.cjs'
      - 'poc/src/official_gametora_skill_id_crosswalk.cjs'
      - 'poc/tests/official_gametora_skill_id_crosswalk.test.cjs'
      - 'poc/src/official_gametora_route_group_probe.cjs'
      - 'poc/tests/official_gametora_route_group_probe.test.cjs'
      - 'poc/src/official_gametora_existing_normalized_parity.cjs'
      - 'poc/tests/official_gametora_existing_normalized_parity.test.cjs'
      - 'poc/src/gametora_whole_event_normalize.cjs'
      - 'poc/src/official_gametora_choice_outcome_semantics.cjs'
      - 'poc/tests/official_gametora_choice_outcome_semantics.test.cjs'
      - 'poc/review/choice-label-provenance-30001.v1.json'
      - 'poc/tools/verify_choice_label_provenance.cjs'
      - 'poc/tests/choice_label_provenance.test.cjs'
      - 'poc/src/choice_label_gender_policy.cjs'
      - 'poc/tests/choice_label_gender_policy.test.cjs'
      - 'poc/tools/probe_official_gametora_new_cards.cjs'
      - 'poc/tests/official_gametora_new_cards.test.cjs'
      - 'poc/src/official_gametora_new_card_route_hints.cjs'
      - 'poc/tests/official_gametora_new_card_route_hints.test.cjs'
      - 'poc/review/outing-evidence-30323.v1.json'
      - 'poc/src/official_gametora_azuma_outing_evidence.cjs'
      - 'poc/tests/official_gametora_azuma_outing_evidence.test.cjs'
      - 'poc/src/friend_outing_access_gate.cjs'
      - 'poc/tests/friend_outing_access_gate.test.cjs'
      - 'poc/review/outing-progression-30323.v1.json'
      - 'poc/src/azuma_outing_sequence.cjs'
      - 'poc/tests/azuma_outing_sequence.test.cjs'

permissions:
  contents: read

jobs:
  limited-official-source-read:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate nonpublishing fetch allowlist and offline parser
        run: |
          node --check poc/src/official_gametora_probe.cjs
          node --test poc/tests/official_gametora_probe.test.cjs
          node --check poc/src/official_gametora_title_crosscheck.cjs
          node --test poc/tests/official_gametora_title_crosscheck.test.cjs
          node --check poc/src/official_gametora_numeric_fact_parser.cjs
          node --test poc/tests/official_gametora_numeric_fact_parser.test.cjs
          node --check poc/src/official_gametora_skill_id_crosswalk.cjs
          node --test poc/tests/official_gametora_skill_id_crosswalk.test.cjs
          node --check poc/src/official_gametora_route_group_probe.cjs
          node --test poc/tests/official_gametora_route_group_probe.test.cjs
          node --check poc/src/official_gametora_existing_normalized_parity.cjs
          node --test poc/tests/official_gametora_existing_normalized_parity.test.cjs
          node --check poc/src/official_gametora_choice_outcome_semantics.cjs
          node --test poc/tests/official_gametora_choice_outcome_semantics.test.cjs
          node --check poc/tools/verify_choice_label_provenance.cjs
          node --test poc/tests/choice_label_provenance.test.cjs
          node --check poc/src/choice_label_gender_policy.cjs
          node --test poc/tests/choice_label_gender_policy.test.cjs
          node --check poc/tools/probe_official_gametora_new_cards.cjs
          node --test poc/tests/official_gametora_new_cards.test.cjs
          node --check poc/src/official_gametora_new_card_route_hints.cjs
          node --test poc/tests/official_gametora_new_card_route_hints.test.cjs
          node --check poc/src/official_gametora_azuma_outing_evidence.cjs
          node --test poc/tests/official_gametora_azuma_outing_evidence.test.cjs
          node --check poc/src/friend_outing_access_gate.cjs
          node --test poc/tests/friend_outing_access_gate.test.cjs
          node --check poc/src/azuma_outing_sequence.cjs
          node --test poc/tests/azuma_outing_sequence.test.cjs
      - name: Read at most three official support-card pages, no source export
        run: node poc/src/official_gametora_probe.cjs --live

  one-card-browser-ui:
    # Pin while ubuntu-latest transitions to 26.04; keep browser proof reproducible.
    runs-on: ubuntu-24.04
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prepare Playwright controller for preinstalled system Chrome
        run: |
          npm install --no-save --no-package-lock playwright@1.55.1
          command -v google-chrome || command -v google-chrome-stable
      - name: Retrieve one immutable historical reference card, only in disposable runner
        run: |
          curl --fail --silent --show-error --location --retry 2 --max-time 30 \
            https://raw.githubusercontent.com/systemless10/UmamusumePS/6e38b54af4fad397ff4491e63007a90705a4fe67/server/data/events/gametora/support_30001.json \
            -o "$RUNNER_TEMP/gt-historical-30001.json"
      - name: Retrieve one immutable independent UmaSim skill dictionary only in runner
        run: |
          curl --fail --silent --show-error --location --retry 2 --max-time 30 \
            https://raw.githubusercontent.com/mee1080/umasim/910dd79f046710245e0cc88a09c5c92b1044897e/data/skill_data.txt \
            -o "$RUNNER_TEMP/umasim-pinned-skills.json"
      - name: Verify six historical choice labels against editorial GameWith link ledger (hash-only)
        run: node poc/tools/verify_choice_label_provenance.cjs "$RUNNER_TEMP/gt-historical-30001.json"
      - name: Observe one published support-card page and compare event headings without source export
        env:
          GT_REFERENCE_SAMPLE: ${{ runner.temp }}/gt-historical-30001.json
          GT_SKILL_REGISTRY_SAMPLE: ${{ runner.temp }}/umasim-pinned-skills.json
        run: node poc/tools/probe_official_gametora_browser.cjs --live-browser

  two-new-cards-browser-ui:
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Use preinstalled Chrome for fixed two-card census
        run: |
          npm install --no-save --no-package-lock playwright@1.55.1
          command -v google-chrome || command -v google-chrome-stable
      - name: Retrieve pinned independent UmaSim skill dictionary into disposable runner
        run: |
          curl --fail --silent --show-error --location --retry 2 --max-time 30 \
            https://raw.githubusercontent.com/mee1080/umasim/910dd79f046710245e0cc88a09c5c92b1044897e/data/skill_data.txt \
            -o "$RUNNER_TEMP/umasim-pinned-new-ssr-skills.json"
      - name: Observe two new original-site SSR card pages, without exporting article content
        env:
          GT_SKILL_REGISTRY_SAMPLE: ${{ runner.temp }}/umasim-pinned-new-ssr-skills.json
        run: node poc/tools/probe_official_gametora_new_cards.cjs --live-new-cards
