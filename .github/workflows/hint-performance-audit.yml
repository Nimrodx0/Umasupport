name: One-Off Hint Performance Source Audit
on:
  pull_request:
    paths:
      - .github/workflows/hint-performance-audit.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-hint-performance:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate every source hint modifier across all 5 stages
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --show-error --silent --location --retry 1 --max-time 120 \
            "https://raw.githubusercontent.com/mee1080/umasim/cf9366f6a487bd8f197b53d8a11981207beb9f6c/data/support_card.txt" |
            node poc/tools/audit_hint_performance.cjs
