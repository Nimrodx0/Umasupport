name: Monitor pinned GT events and UmaSim sources

on:
  schedule:
    # 03:27 UTC = 12:27 JST. GitHub scheduled runs can start late.
    - cron: '27 3 * * *'
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/upstream-refresh-monitor.yml'
      - 'poc/src/upstream_refresh_watch.cjs'
      - 'poc/tests/upstream_refresh_watch.test.cjs'
      - 'poc/src/upstream_refresh_candidate.cjs'
      - 'poc/tests/upstream_refresh_candidate.test.cjs'
      - 'poc/config/event-source-priority.v1.json'
      - 'poc/src/current_umasim_roster_delta.cjs'

permissions:
  contents: write
  actions: write
  issues: write
  pull-requests: write

concurrency:
  group: upstream-source-refresh-review
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify metadata-only drift classifier
        run: |
          node --check poc/src/upstream_refresh_watch.cjs
          node --test poc/tests/upstream_refresh_watch.test.cjs
          node --check poc/src/upstream_refresh_candidate.cjs
          node --test poc/tests/upstream_refresh_candidate.test.cjs
      - name: Compare current upstream trees with immutable source pins, notify on relevant drift only
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const monitor=require('./poc/src/upstream_refresh_watch.cjs');
            const candidateTool=require('./poc/src/upstream_refresh_candidate.cjs');
            const p=monitor.PINS;
            const owners=[
              {owner:p.gameTora.owner,repo:p.gameTora.repo,revision:p.gameTora.revision},
              {owner:p.umaSim.owner,repo:p.umaSim.repo,revision:p.umaSim.revision}
            ];
            const heads=await Promise.all(owners.map(async src=>{
              const head=await github.rest.repos.getCommit({
                owner:src.owner,repo:src.repo,ref:'main'
              });
              return head.data.sha;
            }));
            const tree=async(src,ref)=>{
              const response=await github.rest.git.getTree({
                owner:src.owner,repo:src.repo,tree_sha:ref,recursive:'1'
              });
              return response.data;
            };
            const [gtPin,gtHead,umaPin,umaHead]=await Promise.all([
              tree(owners[0],owners[0].revision),
              tree(owners[0],heads[0]),
              tree(owners[1],owners[1].revision),
              tree(owners[1],heads[1])
            ]);
            const result=monitor.inspect({
              gameToraPinnedTree:gtPin,gameToraLatestTree:gtHead,
              umaSimPinnedTree:umaPin,umaSimLatestTree:umaHead,
              gameToraLatestCommit:heads[0],umaSimLatestCommit:heads[1]
            });
            core.info('UPSTREAM_REFRESH_MONITOR='+JSON.stringify(result));
            core.setOutput('requires_review',String(result.requiresReview));
            await core.summary
              .addHeading('Upstream fixed-source drift watch')
              .addTable([
                [{data:'Source',header:true},{data:'Pinned',header:true},
                  {data:'Head',header:true},{data:'Relevant change',header:true}],
                ['GameTora events',result.sourcePins.gameTora,
                 result.observedHeadCommits.gameTora,
                 'added '+result.eventData.addedCardIds.length+
                 ', changed '+result.eventData.modifiedCardIds.length+
                 ', deleted '+result.eventData.removedCardIds.length],
                ['UmaSim card/skills',result.sourcePins.umaSim,
                 result.observedHeadCommits.umaSim,
                 result.affectedUmaSimFiles.join(', ')||'none']
              ])
              .addRaw('Current new-card GT JSON availability: **'+
                result.eventData.knownLatestUmaSimCardCoverage.withGtEventJson+
                '/'+result.eventData.knownLatestUmaSimCardCoverage.total+
                '**; missing numeric IDs: '+
                (result.eventData.knownLatestUmaSimCardIdsWithoutGtJson.join(', ')||'none')+
                '. File presence does not establish event accuracy or approval.')
              .addRaw('Review required: **'+result.requiresReview+
                '**. No event data or source contents are published.')
              .write();
            if(!result.requiresReview)return;
            const title='Upstream source update: pinned GT events / UmaSim require review';
            const existing=(await github.paginate(github.rest.issues.listForRepo,{
              owner:context.repo.owner,repo:context.repo.repo,state:'open',per_page:100
            })).find(item=>!item.pull_request&&item.title===title);
            const body=monitor.issueBody(result);
            let issueNumber=existing?.number;
            if(!existing){
              const issue=await github.rest.issues.create({
                owner:context.repo.owner,repo:context.repo.repo,title,body
              });
              issueNumber=issue.data.number;
              core.notice('New source drift review issue: '+issue.data.html_url);
            }else if(!(existing.body||'').includes(
              'fingerprint:'+result.reviewFingerprint+' -->')){
              await github.rest.issues.update({
                owner:context.repo.owner,repo:context.repo.repo,
                issue_number:existing.number,body
              });
              core.notice('Updated existing source drift issue #'+existing.number);
            }else{
              core.info('Identical source drift already tracked in issue #'+existing.number);
            }

            // Candidate manifests are public metadata only. Never modify
            // the accepted GT/UmaSim pin files, the event JSON, or Pages.
            // The single bot-owned branch is shared by repeated drift checks.
            const candidate=candidateTool.buildCandidate(result,{
              treeShas:{
                gameToraPinned:gtPin.sha,gameToraHead:gtHead.sha,
                umaSimPinned:umaPin.sha,umaSimHead:umaHead.sha
              },
              sourceRunUrl:'https://github.com/'+context.repo.owner+'/'+
                context.repo.repo+'/actions/runs/'+context.runId
            });
            const fileContent=candidateTool.manifestText(candidate);
            const candidateBody=candidateTool.draftBody(candidate,issueNumber);
            const owner=context.repo.owner,repo=context.repo.repo;
            const branch=candidateTool.BRANCH;
            const head=owner+':'+branch;
            const pullRequests=await github.paginate(github.rest.pulls.list,{
              owner,repo,head,state:'open',per_page:100
            });
            const matching=pullRequests.filter(pr=>pr.head.repo.full_name===
              owner+'/'+repo&&pr.head.ref===branch);
            if(matching.length>1)throw Error('Duplicate automation draft PRs');
            const draft=matching[0];
            if(draft&&!draft.draft)throw Error(
              'Candidate PR is ready for review: automation must not overwrite it');
            if(draft){
              const files=await github.paginate(github.rest.pulls.listFiles,{
                owner,repo,pull_number:draft.number,per_page:100
              });
              if(files.some(f=>f.filename!==candidateTool.FILE_PATH))
                throw Error('Candidate branch has human changes; do not overwrite');
            }
            let branchExists=true;
            try{
              await github.rest.git.getRef({owner,repo,ref:'heads/'+branch});
            }catch(e){
              if(e.status!==404)throw e;
              branchExists=false;
            }
            if(!branchExists){
              await github.rest.git.createRef({
                owner,repo,ref:'refs/heads/'+branch,sha:context.sha
              });
              core.info('Created review-only candidate branch from monitor commit');
            }else if(!draft){
              throw Error('Candidate branch exists without an open Draft PR; manual cleanup required');
            }
            let previous=null;
            try{
              const f=await github.rest.repos.getContent({
                owner,repo,path:candidateTool.FILE_PATH,ref:branch
              });
              if(Array.isArray(f.data)||f.data.type!=='file')
                throw Error('Candidate manifest path is not a file');
              previous=f.data;
            }catch(e){if(e.status!==404)throw e;}
            let candidateChanged=false;
            if(!previous||Buffer.from(previous.content.replace(/\s/g,''),'base64')
              .toString('utf8')!==fileContent){
              await github.rest.repos.createOrUpdateFileContents({
                owner,repo,path:candidateTool.FILE_PATH,branch,
                message:'chore: update review-only pinned-source candidate metadata',
                content:Buffer.from(fileContent,'utf8').toString('base64'),
                ...(previous?{sha:previous.sha}:{})
              });
              candidateChanged=true;
              core.info('Wrote metadata-only candidate manifest');
            }
            if(!draft){
              const pr=await github.rest.pulls.create({
                owner,repo,head:branch,base:'main',draft:true,
                title:candidateTool.PR_TITLE,body:candidateBody
              });
              candidateChanged=true;
              core.notice('Created human-reviewed draft candidate PR: '+pr.data.html_url);
            }else if(!(draft.body||'').includes(
              'fingerprint:'+result.reviewFingerprint+' -->')){
              await github.rest.pulls.update({
                owner,repo,pull_number:draft.number,body:candidateBody
              });
              core.notice('Updated draft candidate PR #'+draft.number);
            }else{
              core.info('Same candidate already in Draft PR #'+draft.number);
            }
            // GITHUB_TOKEN-created commits do not usually fire new push/PR
            // workflows. Explicit dispatch runs read-only core checks against
            // the actual candidate commit, while this workflow remains the
            // only privileged writer.
            if(candidateChanged){
              await github.rest.actions.createWorkflowDispatch({
                owner,repo,workflow_id:'ci.yml',ref:branch
              });
              core.notice('Dispatched candidate branch core CI for safety checks');
              await github.rest.actions.createWorkflowDispatch({
                owner,repo,workflow_id:'upstream-candidate-full-preflight.yml',
                ref:branch
              });
              core.notice('Dispatched full-source candidate preflight on ephemeral runner');
            }
