name: Verify pinned Checker result extraction (manual)
on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/verify-checker-result-extraction.yml
      - poc/src/checker_explicit_result_extract.cjs
      - poc/data/candidates/checker_explicit_result_facts.v1.json
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-pinned-source:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.repository == 'Nimrodx0/Umasupport' &&
       github.event_name == 'pull_request' &&
       github.event.pull_request.head.repo.full_name == github.repository &&
       github.event.pull_request.user.login == 'Nimrodx0' &&
       github.event.pull_request.head.ref == 'feat/phase2-explicit-result-batch-20261020')
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Download three pinned public GitHub source files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/umasupport-sources"
          base="$RUNNER_TEMP/umasupport-sources"
          curl -fLsS --retry 2 --max-time 80 "https://raw.githubusercontent.com/mee1080/umasim/cf9366f6a487bd8f197b53d8a11981207beb9f6c/data/support_card.txt" -o "$base/support_card.txt"
          curl -fLsS --retry 2 --max-time 80 "https://raw.githubusercontent.com/mee1080/umasim/cf9366f6a487bd8f197b53d8a11981207beb9f6c/data/skill_data.txt" -o "$base/skill_data.txt"
          curl -fLsS --retry 2 --max-time 80 "https://raw.githubusercontent.com/Cilda/UmaUmaChecker/8cf9fcb3cc7239041161be75c84daf9f8f22d29f/UmaUmaChecker/Library/Events.json" -o "$base/Events.json"
          node poc/tools/build_checker_explicit_result_facts.cjs --verify "$base/support_card.txt" "$base/skill_data.txt" "$base/Events.json"
      - name: Verify result and review queue (offline)
        run: node poc/tools/verify_checker_result_facts.cjs --verify
