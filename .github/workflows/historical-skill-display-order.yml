name: One-Off Historical Skill Display Order Probe
on:
  pull_request:
    paths:
      - .github/workflows/historical-skill-display-order.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe-master-order:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Retrieve pinned public historical master only for this probe
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/umaskill-sort"
          curl -fsSL --retry 1 --max-time 180 \
            "https://raw.githubusercontent.com/mee1080/umasim/cf9366f6a487bd8f197b53d8a11981207beb9f6c/data/skill_data.txt" \
            -o "$RUNNER_TEMP/umaskill-sort/skill_data.txt"
          curl -fsSL --retry 1 --max-time 240 \
            "https://raw.githubusercontent.com/SimpleSandman/UmaMusumeMetaMasterMDB/5a8ec1356859a35e245edef0d40da740e652df68/master/master.mdb" \
            -o "$RUNNER_TEMP/umaskill-sort/master.mdb"
      - name: Summarize disp_order by common and missing IDs, no raw records logged
        run: |
          python3 poc/tools/probe_historical_disp_order.py \
            --skills "$RUNNER_TEMP/umaskill-sort/skill_data.txt" \
            --master "$RUNNER_TEMP/umaskill-sort/master.mdb"
