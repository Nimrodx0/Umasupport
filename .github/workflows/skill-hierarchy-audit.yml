name: One-time skill hierarchy source audit
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  one-time-group-audit:
    if: github.head_ref == 'feature/skill-hierarchy-completion'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Read publisher dataset exactly once and report structural coverage
        run: node poc/tools/audit_skill_groups.cjs --online
