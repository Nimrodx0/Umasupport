name: P2.15 pinned UmaSim actual random window in JVM checker (controlled positions)

on:
  pull_request:
    paths:
      - '.github/workflows/p2-umasim-source-window-runtime.yml'
      - 'poc/source-probes/P215SourcePhaseWindowRuntimeTest.kt'
      - 'poc/source-probes/P238OriginalRegisteredSpurtPhaseAndTest.kt'
      - 'poc/src/skill_p2_15_umasim_phase_runtime_trace.cjs'
      - 'poc/tests/skill_p2_15_umasim_phase_runtime_trace.test.cjs'
      - 'poc/src/skill_phase_random_draw_support.cjs'
      - 'poc/src/skill_phase_random_source_window_audit.cjs'
      - 'docs/evidence/skills/skill-p2-15-umasim-phase-runtime-20261113.md'
      - 'docs/evidence/skills/skill-p2-32-halfphase-source-window-reuse-20261116.md'
  push:
    branches: [main]
    paths:
      - '.github/workflows/p2-umasim-source-window-runtime.yml'
      - 'poc/source-probes/P215SourcePhaseWindowRuntimeTest.kt'
      - 'poc/src/skill_p2_15_umasim_phase_runtime_trace.cjs'
      - 'poc/tests/skill_p2_15_umasim_phase_runtime_trace.test.cjs'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pinned-source-jvm-window:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify research-only trace validator on counterfactual fixtures
        run: |
          node --check poc/src/skill_p2_15_umasim_phase_runtime_trace.cjs
          node --test poc/tests/skill_p2_15_umasim_phase_runtime_trace.test.cjs
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - name: Fetch exactly the pinned third-party UmaSim source (no vendoring)
        run: |
          mkdir -p "$RUNNER_TEMP/umasim"
          git -C "$RUNNER_TEMP/umasim" init -q
          git -C "$RUNNER_TEMP/umasim" remote add origin https://github.com/mee1080/umasim.git
          git -C "$RUNNER_TEMP/umasim" fetch --quiet --depth=1 origin f6e4501ee6c6c2d4ac8698e7796e309d31575bde
          git -C "$RUNNER_TEMP/umasim" checkout --quiet --detach FETCH_HEAD
          test "$(git -C "$RUNNER_TEMP/umasim" rev-parse HEAD)" = \
            "f6e4501ee6c6c2d4ac8698e7796e309d31575bde"
      - name: Verify checked Kotlin source logic and copy test only
        run: |
          node - <<'NODE'
          const fs=require('node:fs');
          const src=require('./poc/src/skill_phase_random_draw_support.cjs');
          const p=process.env.RUNNER_TEMP+'/umasim/race/src/commonMain/kotlin/io/github/mee1080/umasim/race/calc2/';
          const v=src.verifyPinnedSources(
           fs.readFileSync(p+'SkillChecker.kt','utf8'),
           fs.readFileSync(p+'RaceState.kt','utf8'));
          if(v.actualDrawObserved!==false||v.originalSourceIntervalClosed!==true)
           throw Error('Pinned source contracts changed');
          const checker=fs.readFileSync(p+'SkillChecker.kt','utf8');
          for(const anchor of [
           '"phase_firsthalf_random" -> checkInRandom',
           'baseSetting.initPhaseRandom(condition.value, 0.0 to 0.5)',
           '"phase_laterhalf_random" -> checkInRandom',
           'baseSetting.initPhaseRandom(condition.value, 0.5 to 1.0)'
          ])if(!checker.includes(anchor))
           throw Error('Original pinned half-phase random mechanism changed: '+anchor);
          console.log('P2_15_ORIGINAL_KOTLIN_SOURCE_ANCHORED='+JSON.stringify(v));
          NODE
          install -D poc/source-probes/P215SourcePhaseWindowRuntimeTest.kt \
            "$RUNNER_TEMP/umasim/race/src/jvmTest/kotlin/io/github/mee1080/umasim/race/calc2/P215SourcePhaseWindowRuntimeTest.kt"
          install -D poc/source-probes/P238OriginalRegisteredSpurtPhaseAndTest.kt \
            "$RUNNER_TEMP/umasim/race/src/jvmTest/kotlin/io/github/mee1080/umasim/race/calc2/P238OriginalRegisteredSpurtPhaseAndTest.kt"
      - name: Execute original unmodified UmaSim checker in JVM source unit test
        env:
          GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx3g
        run: |
          export P2_PHASE_SOURCE_TRACE_OUTPUT="$GITHUB_WORKSPACE/p2-15-source-random-window-runtime-trace.json"
          export P2_PHASE_HALF_SOURCE_TRACE_OUTPUT="$GITHUB_WORKSPACE/p2-32-original-halfphase-source-windows.json"
          export P2_PINNED_SPURT_SOURCE_REGISTRY="$RUNNER_TEMP/umasim/data/skill_data.txt"
          export P2_PINNED_SPURT_AND_TRACE_OUTPUT="$GITHUB_WORKSPACE/p2-38-original-registered-spurt-halfphase-controlled.json"
          cd "$RUNNER_TEMP/umasim"
          ./gradlew :race:jvmTest \
            --tests 'io.github.mee1080.umasim.race.calc2.P215SourcePhaseWindowRuntimeTest' \
            --tests 'io.github.mee1080.umasim.race.calc2.P238OriginalRegisteredSpurtPhaseAndTest' \
            --no-daemon --console=plain --stacktrace
          test -s "$P2_PHASE_SOURCE_TRACE_OUTPUT"
          test -s "$P2_PHASE_HALF_SOURCE_TRACE_OUTPUT"
          test -s "$P2_PINNED_SPURT_AND_TRACE_OUTPUT"
      - name: Independently verify actual source trace and publish bounded summary
        run: |
          node - <<'NODE'
          const fs=require('node:fs');
          const trace=require('./poc/src/skill_p2_15_umasim_phase_runtime_trace.cjs');
          const p=process.env.RUNNER_TEMP+'/umasim/race/src/commonMain/kotlin/io/github/mee1080/umasim/race/calc2/';
          const original=JSON.parse(fs.readFileSync('p2-15-source-random-window-runtime-trace.json','utf8'));
          const audit=trace.validate(original,
           fs.readFileSync(p+'SkillChecker.kt','utf8'),
           fs.readFileSync(p+'RaceState.kt','utf8'));
          fs.writeFileSync('p2-15-source-random-window-runtime-summary.json',
           JSON.stringify(audit,null,2)+'\n');
          if(audit.tests.sourceJVMTrials!==12||
             audit.tests.actualSourceDrawnWindowObservations!==12||
             audit.tests.controlledSourceCheckerCalls!==48||
             audit.tests.sourceWindowCacheReuseValidations!==12||
             audit.boundary.observedModelRankAndRandomSameTick!==false||
             audit.boundary.formalSkillOrCardSuitabilityRating!==false)
            throw Error('Pinned JVM runtime cohort or no-rating boundary changed');
          console.log('P2_15_SOURCE_JVM_WINDOW_RUNTIME='+JSON.stringify(audit));
          NODE
      - name: Validate both original half-phase random sources and cache-only boundary
        run: |
          node - <<'NODE'
          const fs=require('node:fs'),assert=require('node:assert/strict');
          const x=JSON.parse(fs.readFileSync('p2-32-original-halfphase-source-windows.json','utf8'));
          assert.equal(x.schemaVersion,1);
          assert.equal(x.status,'p2-32-pinned-umasim-halfphase-random-source-checker-only');
          assert.equal(x.randomPositionMode,'RANDOM');
          assert.equal(x.syntheticSourceSkillId,'99000217');
          assert.equal(x.originalRaceCalculatorInvoked,false);
          assert.equal(x.originalRankObserved,false);
          assert.equal(x.sourceFullANDProven,false);
          assert.equal(x.gameSkillProcOrSuitabilityComputed,false);
          assert.deepEqual(x.cases.map(c=>c.type),
           ['phase_firsthalf_random','phase_laterhalf_random']);
          let draws=0,checks=0;
          const zones=[];
          for(const c of x.cases){
           assert.equal(c.phaseId,2);
           assert.equal(c.sourceDraws,6);
           assert.equal(c.cacheReuseChecks,6);
           assert.equal(c.sourceBoundaryChecks,24);
           assert(Array.isArray(c.windows)&&c.windows.length===6);
           assert(c.zoneEnd>c.zoneStart+10);
           for(let j=0;j<c.windows.length;j++){
            const w=c.windows[j];
            assert.equal(w.trial,j);
            assert(Number.isFinite(w.start)&&Number.isFinite(w.end));
            assert(w.start>=c.zoneStart-1e-7);
            assert(w.start<=c.zoneEnd-2+1e-7);
            assert(w.end>=w.start&&w.end<=c.zoneEnd+1e-7);
            assert(Math.abs(w.end-Math.min(w.start+10,c.zoneEnd))<1e-7);
           }
           draws+=c.sourceDraws;checks+=c.sourceBoundaryChecks;
           zones.push([c.zoneStart,c.zoneEnd]);
          }
          assert(Math.abs(zones[0][1]-zones[1][0])<1e-7);
          console.log('P2_32_HALF_PHASE_SOURCE_JVM='+JSON.stringify({
           sourceHalfPhaseTypes:2,originalSourceDrawnWindows:draws,
           cacheReuseChecks:12,originalControlledBoundaryChecks:checks,
           sourceFullANDProven:0,rankObservations:0,gameProcRates:0
          }));
          NODE
      - name: Validate P2.38 exact original registered skill checker AND with controlled state (not spurt rate)
        run: |
          node - <<'NODE'
          const fs=require('node:fs'),assert=require('node:assert/strict');
          const x=JSON.parse(fs.readFileSync('p2-38-original-registered-spurt-halfphase-controlled.json','utf8'));
          assert.equal(x.schemaVersion,1);
          assert.equal(x.status,'P2.38-original-registered-spurt-halfphase-AND-controlled-checker-only');
          assert.deepEqual(x.sourceSkillIds,['200511','200512']);
          assert.equal(x.originalSkillCount,2);
          assert.equal(x.originalANDConditionCountPerSkill,2);
          assert(Number.isInteger(x.originalSourcePhase)&&x.originalSourcePhase>=0&&x.originalSourcePhase<=3);
          assert.equal(x.originalSourceCheckerTruthTableTrials,12);
          assert.equal(x.originalSourceCheckerCalls,60);
          assert.equal(x.originalRaceCalculatorUsed,false);
          assert.equal(x.originalSpurtParametersObservedFromRace,false);
          assert.equal(x.actualGameSpurtOrSkillRate,null);
          assert.equal(x.approvedSkillOrCardSuitabilityScore,null);
          assert.equal(x.trials.length,12);
          const c={};
          for(const t of x.trials){
           c[t.skillId]=(c[t.skillId]||0)+1;
           assert(t.trial>=0&&t.trial<6&&t.sourcePhase===x.originalSourcePhase);
           assert(Number.isFinite(t.windowStart)&&Number.isFinite(t.windowEnd)&&
            t.windowEnd>=t.windowStart&&t.windowEnd-t.windowStart<=10.000001);
           assert.equal(t.spurtNullWindowIn,false);
           assert.equal(t.spurtInsufficientWindowIn,false);
           assert.equal(t.spurtSufficientWindowIn,true);
           assert.equal(t.spurtTrueWindowBefore,false);
           assert.equal(t.spurtTrueWindowAfter,false);
           assert.equal(t.originalSourceCheckerCalls,5);
           assert.equal(t.spurtParametersArtificial,true);
           assert.equal(t.raceCalculatorInvoked,false);
           assert.equal(t.realGameProcMeasured,false);
          }
          assert.deepEqual(c,{'200511':6,'200512':6});
          console.log('P2_38_REGISTERED_SOURCE_AND_CONTROLLED_KOTLIN='+JSON.stringify({
           actualRegisteredSourceSkillIds:x.sourceSkillIds,phase:x.originalSourcePhase,
           controlledTruthTableTrials:x.originalSourceCheckerTruthTableTrials,
           originalSourceCheckerCalls:x.originalSourceCheckerCalls,
           actualRaceSpurtEvents:0,gameSkillProcRates:0,approvedRatings:0
          }));
          NODE
      - name: Upload original JVM random windows and research-only summary (no source registry)
        uses: actions/upload-artifact@v4
        with:
          name: p2-15-pinned-umasim-source-jvm-random-window-not-race-rank
          path: |
            p2-15-source-random-window-runtime-trace.json
            p2-15-source-random-window-runtime-summary.json
            p2-32-original-halfphase-source-windows.json
            p2-38-original-registered-spurt-halfphase-controlled.json
          if-no-files-found: error
          retention-days: 14
