name: D072 independently approved release proposal
on:
  workflow_dispatch:
    inputs:
      mode:
        description: Plan only, immutable branch, or normal PR (never merge)
        type: choice
        options: [plan, branch, pr]
        default: plan
      bundle:
        description: D072 evidence or D073 title/chain input and explicit approvals or explicit routine policy; no raw source or secrets
        type: string
        required: true
permissions:
  contents: write
  pull-requests: write
concurrency:
  group: d072-reviewed-release-proposal
  cancel-in-progress: false
jobs:
  proposal:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify proposal invariants before any write
        run: node --test poc/tests/d072_release_proposal.test.cjs poc/tests/d072_release_pr.test.cjs poc/tests/d072_card_review_attestation.test.cjs
      - uses: actions/github-script@v7
        with:
          script: |
            const fs=require('node:fs');
            const {PATHS,propose}=require('./poc/src/d072_release_proposal.cjs');
            if(context.eventName!=='workflow_dispatch'||context.ref!=='refs/heads/main')throw Error('main dispatch only');
            const input=context.payload.inputs;
            if(typeof input?.bundle!=='string'||input.bundle.length>60000)throw Error('bounded explicit approval bundle required');
            const bundle=JSON.parse(input.bundle);
            if(!['evidence,newApprovals','attestations,evidence','evidence,publicationDecisions','evidence,routinePublicationPolicy'].includes(Object.keys(bundle||{}).sort().join(',')))throw Error('invalid approval bundle keys');
            const files=Object.fromEntries(PATHS.map(path=>[path,fs.readFileSync(path,'utf8')]));
            const report=await propose({github,...context.repo,baseSha:context.sha,files,evidence:bundle.evidence,newApprovals:bundle.newApprovals,attestations:bundle.attestations,publicationDecisions:bundle.publicationDecisions,routinePublicationPolicy:bundle.routinePublicationPolicy,mode:input.mode});
            core.info('D072_RELEASE_PROPOSAL='+JSON.stringify(report));
            await core.summary.addHeading('Independently approved release proposal')
              .addRaw('Cards: '+report.newCardIds.join(', ')+'; branch written: '+report.branchWritten+
                '; main merge and Pages deployment not performed.').addRaw('\n')
              .addRaw(report.prNumber?'PR: '+report.prUrl+'; CI not verified. Repository policy may require a maintainer to start checks.':report.branchWritten?'Open a normal PR from '+report.branch+' to main and verify all PR CI before merging.':'Plan only; no branch created.')
              .write();
