name: D072 independently approved release proposal
on:
  workflow_dispatch:
    inputs:
      mode:
        description: Plan only, or create an immutable proposal branch (never main)
        type: choice
        options: [plan, branch]
        default: plan
      bundle:
        description: JSON with evidence and newApprovals; approved factual data only, no raw source or secrets
        type: string
        required: true
permissions:
  contents: write
concurrency:
  group: d072-reviewed-release-proposal
  cancel-in-progress: false
jobs:
  proposal:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify proposal invariants before any write
        run: node --test poc/tests/d072_release_proposal.test.cjs
      - uses: actions/github-script@v7
        with:
          script: |
            const fs=require('node:fs');
            const {PATHS,propose}=require('./poc/src/d072_release_proposal.cjs');
            if(context.eventName!=='workflow_dispatch'||context.ref!=='refs/heads/main')throw Error('main dispatch only');
            const input=context.payload.inputs;
            if(typeof input?.bundle!=='string'||input.bundle.length>60000)throw Error('bounded explicit approval bundle required');
            const bundle=JSON.parse(input.bundle);
            if(Object.keys(bundle||{}).sort().join(',')!=='evidence,newApprovals')throw Error('invalid approval bundle keys');
            const files=Object.fromEntries(PATHS.map(path=>[path,fs.readFileSync(path,'utf8')]));
            const report=await propose({github,...context.repo,baseSha:context.sha,files,evidence:bundle.evidence,newApprovals:bundle.newApprovals,mode:input.mode});
            core.info('D072_RELEASE_PROPOSAL='+JSON.stringify(report));
            await core.summary.addHeading('Independently approved release proposal')
              .addRaw('Cards: '+report.newCardIds.join(', ')+'; branch written: '+report.branchWritten+
                '; main merge and Pages deployment not performed.').addRaw('\n')
              .addRaw(report.branchWritten?'Open a normal PR from '+report.branch+' to main and verify all PR CI before merging.':'Plan only; no branch created.')
              .write();
