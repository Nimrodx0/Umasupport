name: P2 source-32 two-axis specificity across model contexts

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'poc/tools/skill_specificity32_research.cjs'
      - 'poc/tools/skill_reference_scenario_gate.cjs'
      - 'poc/tools/skill_context_margin_sensitivity.cjs'
      - 'poc/tools/skill_context_individual_margin.cjs'
      - 'poc/tools/skill_distance_style_interaction.cjs'
      - 'poc/tests/skill_distance_style_interaction.test.cjs'
      - 'poc/tests/skill_context_individual_margin.test.cjs'
      - 'poc/tests/skill_context_margin_sensitivity.test.cjs'
      - 'poc/tests/skill_reference_scenario_gate.test.cjs'
      - 'docs/plans/skill-conditions/p2.md'
      - 'poc/tests/skill_specificity32_research.test.cjs'
      - '.github/workflows/p2-specificity32-two-axis.yml'

permissions:
  contents: read
  actions: read

jobs:
  balanced-four-style-two-axis:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Unit test distinct W window, O point, uniform reference and pair holds
        run: |
          node --check poc/tools/skill_specificity32_research.cjs
          node --test poc/tests/skill_specificity32_research.test.cjs
          node --check poc/tools/skill_reference_scenario_gate.cjs
          node --test poc/tests/skill_reference_scenario_gate.test.cjs
          node --check poc/tools/skill_context_margin_sensitivity.cjs
          node --test poc/tests/skill_context_margin_sensitivity.test.cjs
          node --check poc/tools/skill_context_individual_margin.cjs
          node --test poc/tests/skill_context_individual_margin.test.cjs
          node --check poc/tools/skill_distance_style_interaction.cjs
          node --test poc/tests/skill_distance_style_interaction.test.cjs
          node --test poc/tests/skill_roster32_research.test.cjs
      - name: Fetch immutable source-validated 5760-race research artifacts
        run: |
          mkdir -p /tmp/p2-specified
          gh run download 42413671565 -n p2-roster32-balanced -D /tmp/p2-specified
          gh run download 42413671565 -n p2-roster32-frontHeavy -D /tmp/p2-specified
          gh run download 42413671565 -n p2-roster32-backHeavy -D /tmp/p2-specified
          gh run download 42413671565 -n p2-roster32-noFront -D /tmp/p2-specified
          gh run download 42413671565 -n p2-32-source-roster-sensitivity-aggregated -D /tmp/p2-specified
          test -s /tmp/p2-specified/balanced.json
          test -s /tmp/p2-specified/frontHeavy.json
          test -s /tmp/p2-specified/backHeavy.json
          test -s /tmp/p2-specified/noFront.json
          test -s /tmp/p2-specified/roster32-comparison.json
      - name: Derive source-scope 32×2 point-rank specificity, 384 pairwise W comparisons
        run: |
          node poc/tools/skill_specificity32_research.cjs \
            poc/data/p2_position_condition32_research.v1.json \
            /tmp/p2-specified/balanced.json \
            /tmp/p2-specified/frontHeavy.json \
            /tmp/p2-specified/backHeavy.json \
            /tmp/p2-specified/noFront.json \
            /tmp/p2-specified/roster32-comparison.json \
            /tmp/p2-specified/two-axis-32.json \
            > /tmp/p2-specified/summary.json
          node - <<'NODE'
          const fs=require('node:fs'),assert=require('node:assert/strict');
          const x=JSON.parse(fs.readFileSync('/tmp/p2-specified/two-axis-32.json'));
          assert.equal(x.schemaVersion,1);
          assert.equal(x.model.sourceConditions,32);
          assert.equal(x.summary.totalConditionHeadcounts,64);
          assert.equal(x.summary.totalConditionHeadcountPairs,384);
          assert.equal(x.summary.balancedPairDirections['first-strict-all-matched-contexts']+
           x.summary.balancedPairDirections['second-strict-all-matched-contexts'],337);
          assert.equal(x.summary.balancedPairDirections['held-overlap-or-context-mixed']+
           (x.summary.balancedPairDirections['held-context-direction-reversal']||0),47);
          assert.equal(x.summary.fullyStrictBalancedFourStyleOrders,21);
          assert.equal(x.summary.fullyStrictOrdersByHeadcount['9'],1);
          assert.equal(x.summary.fullyStrictOrdersByHeadcount['12'],20);
          assert.equal(x.summary.crossHeadcountPairs['same-strict-direction'],156);
          assert.equal(x.summary.crossHeadcountPairs['held-at-least-one-headcount'],36);
          assert.equal(x.summary.fourRosterPairDirections['not-four-way-comparable-style-absent'],192);
          assert.equal(x.summary.fourRosterPairDirections['first-higher-in-all-four-rosters-and-matched-contexts']+
           x.summary.fourRosterPairDirections['second-higher-in-all-four-rosters-and-matched-contexts'],143);
          assert(x.conditions.every(c=>c.sourceIntegerPositions.length>0));
          assert(x.conditions.every(c=>c.pairwise.length===6));
          assert(x.conditions.every(c=>Object.values(c.styles).every(v=>
           v.opportunity10mPercent+1e-5>=v.pointOccupancyPercent&&
           v.baselineType.startsWith('uniform-single-rank-not-a-10m'))));
          assert(x.model.seedSplitConfirmation.startsWith('NOT TESTED'));
          console.log(JSON.stringify(x.summary,null,2));
          NODE
      - name: Audit whether balanced reference is robust, not whether it represents live games
        run: |
          node poc/tools/skill_reference_scenario_gate.cjs \
            /tmp/p2-specified/two-axis-32.json \
            /tmp/p2-specified/reference-scenario-validity.json
          node - <<'NODE'
          const assert=require('node:assert/strict'),fs=require('node:fs');
          const a=JSON.parse(fs.readFileSync(
           '/tmp/p2-specified/reference-scenario-validity.json','utf8'));
          assert.equal(a.schemaVersion,1);
          assert.equal(a.status,
           'P2.29-comparison-reference-context-sensitivity-not-population-validation');
          assert.equal(a.comparisonSummary.originalSourceConditions,64);
          assert.equal(a.comparisonSummary.stylePairComparisons,384);
          assert.equal(a.comparisonSummary.balancedStrict,337);
          assert.equal(a.comparisonSummary.balancedHeld,47);
          assert.equal(a.comparisonSummary.strictAcrossAllFourArtificialRosters,143);
          assert.equal(a.comparisonSummary.balancedStrictButNotFourRobust,194);
          assert.equal(a.comparisonSummary.noFrontAbsencePairComparisons,192);
          assert.equal(a.comparisonSummary.crossHeadcountSameStrict,156);
          assert.equal(a.comparisonSummary.crossHeadcountHeld,36);
          assert.equal(a.comparisonSummary.crossHeadcountStrictReverse,0);
          const consensus=a.crossContextConsistency;
          assert.equal(consensus.status,
           'source-rank-condition-across-fixed-context-consensus-only');
          assert.equal(consensus.originalSignatures,32);
          assert.equal(consensus.stylePairs,192);
          assert.equal(consensus.scenarioHeadcountCells,1536);
          assert.equal(consensus.fullCoverageStrict,69);
          assert.equal(consensus.observedStrictWithMissingStyle,66);
          assert.equal(consensus.directionReversal,29);
          assert.equal(consensus.heldOrTied,28);
          assert.equal(consensus.noComparable,0);
          assert.equal(consensus.fullCoverageStrict+
           consensus.observedStrictWithMissingStyle+
           consensus.directionReversal+consensus.heldOrTied,192);
          assert.equal(consensus.rows.length,192);
          assert.equal(Object.values(consensus.byStatus)
           .reduce((sum,v)=>sum+v,0),192);
          assert(consensus.rows.every(x=>
           x.comparableScenarioHeadcounts+
             x.missingStyleScenarioHeadcounts<=8));
          assert(consensus.rows.filter(x=>x.first==='Nige').every(x=>
           x.missingStyleScenarioHeadcounts===2 &&
           x.coverage.absentScenarios.every(v=>v.roster==='noFront')));
          assert(consensus.limitations.some(x=>x.includes('NOT full-coverage')));

          assert.equal(a.decisionStatus.realRosterJointDistribution,'not-identified');
          assert.equal(a.decisionStatus.newSuitabilityLabel,'not-authorized');
          assert.equal(Object.hasOwn(a,'populationWeightedSuitability'),false);
          assert.equal(a.unresolvedReferenceDecisions.length,8);
          console.log('P2_29_CONTEXT_COMPARISON_GATES='+JSON.stringify({
           summary:a.comparisonSummary,
           crossContextConsistency:consensus.byStatus,
           fixedReferenceRosterCounts:a.fixedReferenceRosterCounts,
           unresolvedAxes:a.unresolvedReferenceDecisions.map(x=>x.axis)}));
          NODE
      - name: P2.30 inspect minimum scenario mean difference and hypothetical threshold sensitivity
        run: |
          node poc/tools/skill_context_margin_sensitivity.cjs \
            /tmp/p2-specified/two-axis-32.json \
            /tmp/p2-specified/reference-scenario-validity.json \
            /tmp/p2-specified/context-margin-sensitivity.json
          node - <<'NODE'
          const fs=require('node:fs'),assert=require('node:assert/strict');
          const x=JSON.parse(fs.readFileSync(
            '/tmp/p2-specified/context-margin-sensitivity.json','utf8'));
          assert.equal(x.schemaVersion,1);
          assert.equal(x.status,
           'P2.30-conservative-mean-margin-sensitivity-research-only');
          assert.equal(x.design.stylePairs,192);
          assert.equal(x.design.userApprovedProductThreshold,'none');
          assert.equal(x.summary.originalFullyConsistent,69);
          assert.equal(x.summary.originalConsistentOnObservedOnly,66);
          assert.equal(x.summary.heldOrReversal,57);
          assert.deepEqual(
           ['0','1','3','5'].map(k=>x.summary.byThreshold[k].total),
           [135,134,131,127]);
          assert.deepEqual(
           ['0','1','3','5'].map(k=>x.summary.byThreshold[k].fullCoverage),
           [69,69,67,63]);
          assert.deepEqual(
           ['0','1','3','5'].map(k=>
             x.summary.byThreshold[k].observedOnlyMissingStyle),
           [66,65,64,64]);
          for(const k of ['0','1','3','5']){
            assert.equal(x.summary.byThreshold[k].marginPoints,Number(k));
            assert(x.summary.byThreshold[k].total<=135);
          }
          assert(x.rows.every(r=>r.originalSourceConditionScope===
           'partial-rank-and-timing-only'));
          assert(!Object.hasOwn(x,'cardFitScore'));
          console.log('P2_30_MARGIN_GATES='+JSON.stringify({
           summary:x.summary,limitations:x.limitations.slice(0,2)}));
          NODE
      - name: P2.31 measure minima in every eligible course and ability mode, not just scenario means
        run: |
          node poc/tools/skill_context_individual_margin.cjs \
            poc/data/p2_position_condition32_research.v1.json \
            /tmp/p2-specified/balanced.json \
            /tmp/p2-specified/frontHeavy.json \
            /tmp/p2-specified/backHeavy.json \
            /tmp/p2-specified/noFront.json \
            /tmp/p2-specified/context-margin-sensitivity.json \
            /tmp/p2-specified/individual-course-mode-margin.json
          node - <<'NODE'
          const fs=require('node:fs'),assert=require('node:assert/strict');
          const z=JSON.parse(fs.readFileSync(
           '/tmp/p2-specified/individual-course-mode-margin.json','utf8'));
          assert.equal(z.schemaVersion,1);
          assert.equal(z.status,
           'P2.31-individual-course-mode-W-margin-vs-scenario-mean-research-only');
          assert.equal(z.design.styleComparisons,192);
          assert.equal(z.design.seedSplitStatus.startsWith('NOT TESTED'),true);
          assert.equal(z.rows.length,192);
          assert.deepEqual(
           ['0','1','3','5'].map(k=>z.summary[k].scenarioMeanPass),
           [135,134,131,127]);
          assert.deepEqual(
           ['0','1','3','5'].map(k=>
             z.summary[k].minimumAcrossIndividualCourseModePass),
           [135,131,121,118]);
          assert.deepEqual(
           ['0','1','3','5'].map(k=>z.summary[k].scenarioMeanOnlyNotEveryCourseMode),
           [0,3,10,9]);
          assert.deepEqual(
           ['0','1','3','5'].map(k=>z.summary[k].fullCoverageIndividualPass),
           [69,66,57,54]);
          assert.deepEqual(
           ['0','1','3','5'].map(k=>
             z.summary[k].observedOnlyMissingStyleIndividualPass),
           [66,65,64,64]);
          for(const k of ['0','1','3','5']){
            assert.equal(z.summary[k].scenarioMeanPass,
             z.summary[k].minimumAcrossIndividualCourseModePass+
             z.summary[k].scenarioMeanOnlyNotEveryCourseMode);
            assert(z.summary[k].minimumAcrossIndividualCourseModePass<=
             z.summary[k].scenarioMeanPass);
          }
          assert(z.rows.every(x=>
           x.measuredCourseModeContextCells+x.absentStyleCourseModeContextCells===
            8*x.numberOfSourceEligibleCourses*2));
          assert(z.limitations.some(x=>x.includes('NOT individual races')));
          assert(!Object.hasOwn(z,'cardGrade'));
          console.log('P2_31_INDIVIDUAL_CONTEXT_MARGIN='+JSON.stringify({
           summary:z.summary,denominator:z.design.styleComparisons,
           examples:z.rows.filter(x=>x.thresholds['5'].meanOnly).slice(0,5)
            .map(x=>({id:x.sourceNumericId,first:x.first,second:x.second,
             mean:x.originalMeanMinimumPoints,
             individual:x.minimumIndividualCourseModeLowerBoundPoints}))}));
          NODE
      - name: P2.17 compare W style gaps across race distance categories without inventing a distance causal effect
        run: |
          node poc/tools/skill_distance_style_interaction.cjs \
            poc/data/p2_position_condition32_research.v1.json \
            /tmp/p2-specified/balanced.json \
            /tmp/p2-specified/frontHeavy.json \
            /tmp/p2-specified/backHeavy.json \
            /tmp/p2-specified/noFront.json \
            /tmp/p2-specified/individual-course-mode-margin.json \
            /tmp/p2-specified/distance-style-interaction.json
          node - <<'NODE'
          const assert=require('node:assert/strict'),fs=require('node:fs');
          const z=JSON.parse(fs.readFileSync(
           '/tmp/p2-specified/distance-style-interaction.json','utf8'));
          assert.equal(z.schemaVersion,1);
          assert.equal(z.status,
           'P2.17-distance-associated-style-gap-conditional-observation-not-causal');
          assert.equal(z.design.distanceUnrestrictedSourceSignatures,10);
          assert.equal(z.design.distanceRestrictedSourceSignaturesExcluded,22);
          assert.equal(z.design.sourceSignatureStylePairs,60);
          assert.equal(z.design.sourceSurfaceKeptFixed,true);
          assert.equal(z.design.observedRealGameSkillProc,false);
          assert.equal(z.design.hypotheticalGapShiftMarginPoints,5);
          assert.equal(z.rows.length,60);
          assert.equal(z.tokyoTurfRows.length,24);
          assert.equal(z.summary.allOriginalEligibleCourses.matchedRosterHeadModeContexts,840);
          assert.equal(z.summary.allOriginalEligibleCourses.missingStyleRosterHeadModeContexts,120);
          assert.equal(z.summary.allOriginalEligibleCourses.matchedCrossDistanceClassComparisons,5040);
          assert.equal(z.summary.sameVenueTokyoTurf.matchedRosterHeadModeContexts,336);
          assert.equal(z.summary.sameVenueTokyoTurf.missingStyleRosterHeadModeContexts,48);
          assert.equal(z.summary.sameVenueTokyoTurf.matchedCrossDistanceClassComparisons,2016);
          assert.deepEqual([
           z.summary.allOriginalEligibleCourses.pairsWithStrictCrossDistanceSignReversal,
           z.summary.allOriginalEligibleCourses.pairsWithFivePointOrGreaterConservativeGapShift,
           z.summary.allOriginalEligibleCourses.matchedContextsWithStrictCrossDistanceSignReversal,
           z.summary.allOriginalEligibleCourses.matchedContextsWithFivePointConservativeGapShift],
           [5,56,8,341]);
          assert.deepEqual([
           z.summary.sameVenueTokyoTurf.pairsWithStrictCrossDistanceSignReversal,
           z.summary.sameVenueTokyoTurf.pairsWithFivePointOrGreaterConservativeGapShift,
           z.summary.sameVenueTokyoTurf.matchedContextsWithStrictCrossDistanceSignReversal,
           z.summary.sameVenueTokyoTurf.matchedContextsWithFivePointConservativeGapShift],
           [5,23,11,148]);
          for(const group of Object.values(z.summary)){
            assert(group.pairsWithStrictCrossDistanceSignReversal<=
             group.sourceConditionStylePairs);
            assert(group.pairsWithFivePointOrGreaterConservativeGapShift<=
             group.sourceConditionStylePairs);
          }
          assert(z.rows.every(x=>x.distanceScope==='all'));
          assert(z.rows.every(x=>x.contexts.length+x.absent.length===16));
          assert(!Object.hasOwn(z,'skillActivationRate'));
          assert(!Object.hasOwn(z,'cardSuitability'));
          console.log('P2_17_DISTANCE_GAP_OBSERVATION='+JSON.stringify({
           summary:z.summary,
           reversalExamples:z.rows.filter(x=>x.contexts.some(y=>
            y.hasStrictSignReversalAcrossDistances)).slice(0,6)
            .map(x=>({sourceNumericId:x.sourceNumericId,first:x.first,
             second:x.second,surface:x.surface})),
           tokyoExamples:z.tokyoTurfRows.filter(x=>x.contexts.some(y=>
            y.hasStrictSignReversalAcrossDistances)).slice(0,4)
            .map(x=>({sourceNumericId:x.sourceNumericId,first:x.first,
             second:x.second}))}));
          NODE
      - name: Retain research-only derived two-axis context comparisons
        uses: actions/upload-artifact@v4
        with:
          name: p2-two-axis-32-rank-specificity-research
          path: |
            /tmp/p2-specified/two-axis-32.json
            /tmp/p2-specified/reference-scenario-validity.json
            /tmp/p2-specified/context-margin-sensitivity.json
            /tmp/p2-specified/individual-course-mode-margin.json
            /tmp/p2-specified/distance-style-interaction.json
          retention-days: 14
