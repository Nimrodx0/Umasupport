name: P2.59 joint clock rank and neighbour model logic
on:
  workflow_dispatch:
  workflow_call:
  pull_request:
    paths:
      - '.github/workflows/p2-joint-dynamic-model.yml'
      - 'poc/src/p2_native_neighbour_model.cjs'
      - 'poc/src/p2_clock_rank_joint_model.cjs'
      - 'poc/src/p2_joint_dynamic_model.cjs'
      - 'poc/tests/p2_joint_dynamic_model.test.cjs'
      - 'poc/src/p3_dynamic_margin_screen.cjs'
      - 'poc/tests/p3_dynamic_margin_screen.test.cjs'
      - 'poc/src/p3_dynamic_scope_screen.cjs'
      - 'poc/tests/p3_dynamic_scope_screen.test.cjs'
permissions:
  contents: read
jobs:
  joint-dynamic:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test poc/tests/p2_joint_dynamic_model.test.cjs
      - name: Recreate pinned original cohort and source references
        env:
          UMASIM_REVISION: f6e4501ee6c6c2d4ac8698e7796e309d31575bde
        run: |
          node poc/tools/audit_skill_conditions.cjs > /tmp/p2-59-inventory.log
          mkdir -p /tmp/p2-59-uma /tmp/p2-59-engine /tmp/p2-59-report
          git -C /tmp/p2-59-uma init -q
          git -C /tmp/p2-59-uma remote add origin https://github.com/mee1080/umasim.git
          git -C /tmp/p2-59-uma fetch --quiet --depth 1 origin f6e4501ee6c6c2d4ac8698e7796e309d31575bde
          git -C /tmp/p2-59-uma checkout --quiet --detach FETCH_HEAD
          test "$(git -C /tmp/p2-59-uma rev-parse HEAD)" = f6e4501ee6c6c2d4ac8698e7796e309d31575bde
      - name: Build the original and instrumented fixed GlobalSim
        run: |
          git -C /tmp/p2-59-engine init -q
          git -C /tmp/p2-59-engine remote add origin https://github.com/daftuyda/GlobalSim.git
          git -C /tmp/p2-59-engine fetch --quiet --depth 1 origin 80b54cacf174b54ff6f7ca27ee7f88b5856c0bd1
          git -C /tmp/p2-59-engine checkout --quiet --detach FETCH_HEAD
          test "$(git -C /tmp/p2-59-engine rev-parse HEAD)" = 80b54cacf174b54ff6f7ca27ee7f88b5856c0bd1
          (cd /tmp/p2-59-engine && cargo build --release --locked)
          cp /tmp/p2-59-engine/target/release/race_engine_rs_v2 /tmp/p2-59-report/original
          node poc/src/p2_native_neighbour_model.cjs patch /tmp/p2-59-engine
          git -C /tmp/p2-59-engine diff --name-only | sort > /tmp/p2-59-report/modified
          printf 'src/activation_conditions.rs\nsrc/lib.rs\nsrc/race_field.rs\nsrc/race_field_retail.rs\n' | cmp - /tmp/p2-59-report/modified
          (cd /tmp/p2-59-engine && cargo build --release --locked)
          cp /tmp/p2-59-engine/target/release/race_engine_rs_v2 /tmp/p2-59-report/near
          git -C /tmp/p2-59-engine reset --hard 80b54cacf174b54ff6f7ca27ee7f88b5856c0bd1
          node poc/src/p2_clock_rank_joint_model.cjs patch /tmp/p2-59-engine
          git -C /tmp/p2-59-engine diff --name-only | sort > /tmp/p2-59-report/modified
          printf 'src/lib.rs\nsrc/race_field.rs\nsrc/race_field_retail.rs\n' | cmp - /tmp/p2-59-report/modified
          (cd /tmp/p2-59-engine && cargo build --release --locked)
          cp /tmp/p2-59-engine/target/release/race_engine_rs_v2 /tmp/p2-59-report/clock
      - name: Join two fixed probes on identical runner and tick
        run: |
          base=/tmp/p2-59-uma/race/src/commonMain/kotlin/io/github/mee1080/umasim/race/calc2
          node --max-old-space-size=4096 poc/src/p2_joint_dynamic_model.cjs \
            /tmp/p2-59-engine/examples/v77-race.jsonl \
            /tmp/p2-59-report/original /tmp/p2-59-report/clock /tmp/p2-59-report/near \
            /tmp/p2-59-uma/data/skill_data.txt p2-32-source-route-research-queue.json \
            "$base/SkillChecker.kt" "$base/RaceState.kt" "$base/RaceCalculator.kt" \
            /tmp/p2-59-report/report.json /tmp/p2-59-report/summary.json
      - name: P3.4f compare fixed context direction and margin sensitivity without official labels
        run: |
          node --test poc/tests/p3_dynamic_margin_screen.test.cjs
          node poc/src/p3_dynamic_margin_screen.cjs /tmp/p2-59-report/report.json /tmp/p2-59-report/p3-4f-margin-screen.json
      - name: P3.4i compare only explicitly applicable fixed contexts, retaining partial masks as held
        run: |
          node --test poc/tests/p3_dynamic_scope_screen.test.cjs
          node poc/src/p3_dynamic_scope_screen.cjs /tmp/p2-59-report/report.json /tmp/p2-59-report/p3-4i-scope-screen.json
      - uses: actions/upload-artifact@v4
        with:
          name: p2-59-joint-dynamic-projection
          path: |
            /tmp/p2-59-report/report.json
            /tmp/p2-59-report/summary.json
            /tmp/p2-59-report/p3-4f-margin-screen.json
            /tmp/p2-59-report/p3-4i-scope-screen.json
          retention-days: 14
          if-no-files-found: error
