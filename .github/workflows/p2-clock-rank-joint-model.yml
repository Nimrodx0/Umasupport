name: P2.56 native model clock and rank-change joint source projection
on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/p2-clock-rank-joint-model.yml'
      - 'poc/src/p2_clock_rank_joint_model.cjs'
      - 'poc/tests/p2_clock_rank_joint_model.test.cjs'
permissions:
  contents: read
jobs:
  clock-rank:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test poc/tests/p2_clock_rank_joint_model.test.cjs
      - name: Recreate pinned original cohort and source references
        env:
          UMASIM_REVISION: f6e4501ee6c6c2d4ac8698e7796e309d31575bde
        run: |
          node poc/tools/audit_skill_conditions.cjs > /tmp/p2-56-inventory.log
          mkdir -p /tmp/p2-56-uma /tmp/p2-56-engine /tmp/p2-56-report
          git -C /tmp/p2-56-uma init -q
          git -C /tmp/p2-56-uma remote add origin https://github.com/mee1080/umasim.git
          git -C /tmp/p2-56-uma fetch --quiet --depth 1 origin f6e4501ee6c6c2d4ac8698e7796e309d31575bde
          git -C /tmp/p2-56-uma checkout --quiet --detach FETCH_HEAD
          test "$(git -C /tmp/p2-56-uma rev-parse HEAD)" = f6e4501ee6c6c2d4ac8698e7796e309d31575bde
      - name: Build the original and instrumented fixed GlobalSim
        run: |
          git -C /tmp/p2-56-engine init -q
          git -C /tmp/p2-56-engine remote add origin https://github.com/daftuyda/GlobalSim.git
          git -C /tmp/p2-56-engine fetch --quiet --depth 1 origin 80b54cacf174b54ff6f7ca27ee7f88b5856c0bd1
          git -C /tmp/p2-56-engine checkout --quiet --detach FETCH_HEAD
          test "$(git -C /tmp/p2-56-engine rev-parse HEAD)" = 80b54cacf174b54ff6f7ca27ee7f88b5856c0bd1
          (cd /tmp/p2-56-engine && cargo build --release --locked)
          cp /tmp/p2-56-engine/target/release/race_engine_rs_v2 /tmp/p2-56-report/original
          node poc/src/p2_clock_rank_joint_model.cjs patch /tmp/p2-56-engine
          git -C /tmp/p2-56-engine diff --name-only | sort > /tmp/p2-56-report/modified
          printf 'src/lib.rs\nsrc/race_field.rs\nsrc/race_field_retail.rs\n' | cmp - /tmp/p2-56-report/modified
          (cd /tmp/p2-56-engine && cargo build --release --locked)
          cp /tmp/p2-56-engine/target/release/race_engine_rs_v2 /tmp/p2-56-report/probe
      - name: Reuse 32 fixed multi-runner races for joint time and rank-change source logic
        run: |
          base=/tmp/p2-56-uma/race/src/commonMain/kotlin/io/github/mee1080/umasim/race/calc2
          node --max-old-space-size=4096 poc/src/p2_clock_rank_joint_model.cjs replay \
            /tmp/p2-56-engine/examples/v77-race.jsonl \
            /tmp/p2-56-report/original /tmp/p2-56-report/probe \
            /tmp/p2-56-uma/data/skill_data.txt p2-32-source-route-research-queue.json \
            "$base/SkillChecker.kt" "$base/RaceState.kt" "$base/RaceCalculator.kt" \
            /tmp/p2-56-report/summary.json
      - uses: actions/upload-artifact@v4
        with:
          name: p2-56-native-clock-rank-projection
          path: /tmp/p2-56-report/summary.json
          retention-days: 14
          if-no-files-found: error
