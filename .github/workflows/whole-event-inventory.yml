name: Audit complete cross-source support event inventory

on:
  pull_request:
    paths:
      - 'poc/tools/build_whole_event_index.cjs'
      - 'poc/src/phase2_reviewed_event_aliases.cjs'
      - 'poc/src/phase2_additional_pinned_aliases.cjs'
      - 'poc/tests/phase2_reviewed_event_aliases.test.cjs'
      - 'poc/src/phase2_completeness_exception_queue.cjs'
      - 'poc/src/phase2_independent_roster_coverage.cjs'
      - 'poc/src/phase2_30240_independent_chain_numeric_review.cjs'
      - 'poc/tools/audit_30240_independent_chain_numeric_review.cjs'
      - 'poc/tests/phase2_30240_independent_chain_numeric_review.test.cjs'
      - 'poc/tools/audit_phase2_independent_roster_coverage.cjs'
      - 'poc/tests/phase2_independent_roster_coverage.test.cjs'
      - 'poc/tools/build_phase2_completeness_exception_queue.cjs'
      - 'poc/tests/phase2_completeness_exception_queue.test.cjs'
      - 'poc/src/gametora_missing_card_triage.cjs'
      - 'poc/src/missing_four_ssr_skill_fact_candidates.cjs'
      - 'poc/tools/build_missing_four_ssr_skill_fact_candidates.cjs'
      - 'poc/tests/missing_four_ssr_skill_fact_candidates.test.cjs'
      - 'poc/src/phase2_four_ssr_editorial_review.cjs'
      - 'poc/config/event-source-priority.v1.json'
      - 'poc/src/event_source_precedence.cjs'
      - 'poc/src/event_exception_adjudication.cjs'
      - 'poc/tests/event_source_precedence.test.cjs'
      - 'poc/tests/event_exception_adjudication.test.cjs'
      - 'poc/tools/audit_four_ssr_editorial_numeric_review.cjs'
      - 'poc/tests/phase2_four_ssr_editorial_review.test.cjs'
      - 'poc/tools/audit_missing_gametora_cards.cjs'
      - 'poc/tests/gametora_missing_card_triage.test.cjs'
      - 'poc/tests/whole_event_index.test.cjs'
      - 'poc/tools/audit_whole_event_rewards.cjs'
      - 'poc/tests/whole_event_reward_audit.test.cjs'
      - 'poc/tools/audit_whole_chain_topology.cjs'
      - 'poc/src/gametora_event_resolution.cjs'
      - 'poc/tests/gametora_event_resolution.test.cjs'
      - 'poc/tools/report_gametora_baseline.cjs'
      - 'poc/src/gametora_whole_event_normalize.cjs'
      - 'poc/tools/generate_gametora_whole_event_candidate.cjs'
      - 'poc/tests/gametora_whole_event_normalize.test.cjs'
      - 'poc/src/gametora_event_skill_crosswalk.cjs'
      - 'poc/tools/audit_gametora_event_skill_crosswalk.cjs'
      - 'poc/tests/gametora_event_skill_crosswalk.test.cjs'
      - 'poc/tools/crosscheck_missing_event_skills_2025.py'
      - 'poc/tests/test_historical_missing_event_skills.py'
      - 'poc/src/historical_skill_dry_run.cjs'
      - 'poc/src/independent_skill_fingerprint_audit.cjs'
      - 'poc/src/independent_2026_skill_dry_run.cjs'
      - 'poc/tests/independent_2026_skill_dry_run.test.cjs'
      - 'poc/src/private_schema_digest_parity.cjs'
      - 'poc/tools/check_private_schema_digest_parity.cjs'
      - 'poc/tests/private_schema_digest_parity.test.cjs'
      - 'poc/tools/audit_independent_2026_skill_fingerprints.cjs'
      - 'poc/tests/independent_skill_fingerprint_audit.test.cjs'
      - 'poc/src/gametora_app_schema_dry_run.cjs'
      - 'poc/src/gametora_short_event_title_intake.cjs'
      - 'poc/src/gametora_publication_review_queue.cjs'
      - 'poc/src/phase2_release_triage.cjs'
      - 'poc/src/phase2_30080_runtime_overlay.cjs'
      - 'poc/src/phase2_integrated_private_catalog.cjs'
      - 'poc/src/phase2_integrated_private_loader.cjs'
      - 'poc/src/phase2_2511_chain_runtime.cjs'
      - 'poc/src/phase2_2511_gap_reconciliation.cjs'
      - 'poc/data/curation/adjudicated/30180_special_cornering.v1.json'
      - 'poc/src/phase2_30180_special_overlay.cjs'
      - 'poc/src/phase2_four_p1_outcome_review.cjs'
      - 'poc/tests/phase2_four_p1_outcome_review.test.cjs'
      - 'poc/src/phase2_30180_loader.cjs'
      - 'poc/tests/phase2_30180_special_overlay.test.cjs'
      - 'poc/src/phase2_2511_remaining_checker_skill_impact.cjs'
      - 'poc/tests/phase2_2511_remaining_checker_skill_impact.test.cjs'
      - 'poc/src/phase2_30301_identity_resolution.cjs'
      - 'poc/data/curation/adjudicated/30301_checker_hint_event_conflict.v1.json'
      - 'poc/tests/phase2_2511_gap_reconciliation.test.cjs'
      - 'poc/src/phase2_2511_chain_loader.cjs'
      - 'poc/tests/phase2_2511_chain_runtime.test.cjs'
      - 'poc/tests/phase2_integrated_private_loader.test.cjs'
      - 'poc/tests/phase2_integrated_private_catalog.test.cjs'
      - 'poc/tests/phase2_30080_runtime_overlay.test.cjs'
      - 'poc/tests/phase2_release_triage.test.cjs'
      - 'poc/tests/gametora_publication_review_queue.test.cjs'
      - 'poc/tests/gametora_short_event_title_intake.test.cjs'
      - 'poc/src/gametora_full_runtime_integration.cjs'
      - 'poc/src/public_event_catalog.js'
      - 'poc/tests/gametora_full_runtime_integration.test.cjs'
      - 'poc/tools/probe_gametora_app_schema_dry_run.cjs'
      - 'poc/src/gametora_branch_semantics_inventory.cjs'
      - 'poc/tests/gametora_branch_semantics_inventory.test.cjs'
      - 'poc/src/gametora_schema_blocker_diagnostics.cjs'
      - 'poc/tools/probe_gametora_app_schema_dry_run.cjs'
      - 'poc/tests/gametora_app_schema_dry_run.test.cjs'
      - 'poc/tests/whole_chain_topology.test.cjs'
      - 'poc/tools/audit_direct_historical_chain.py'
      - 'poc/tests/test_direct_historical_chain.py'
      - 'poc/tools/inspect_direct_historical_gaps.py'
      - 'poc/tests/test_targeted_historical_gaps.py'
      - 'docs/phase2-whole-chain-topology-20261020.md'
      - '.github/workflows/whole-event-inventory.yml'
      - 'docs/phase2-whole-event-intake-plan-20261020.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  whole-event-inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          path: umasupport
      - uses: actions/checkout@v4
        with:
          repository: systemless10/UmamusumePS
          ref: 6e38b54af4fad397ff4491e63007a90705a4fe67
          persist-credentials: false
          path: gt-snapshot
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Download two version-pinned public source files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/event-inputs"
          curl -fLsS --retry 2 --max-time 90 \
            https://raw.githubusercontent.com/mee1080/umasim/cf9366f6a487bd8f197b53d8a11981207beb9f6c/data/support_card.txt \
            -o "$RUNNER_TEMP/event-inputs/support_card.txt"
          curl -fLsS --retry 2 --max-time 90 \
            https://raw.githubusercontent.com/Cilda/UmaUmaChecker/8cf9fcb3cc7239041161be75c84daf9f8f22d29f/UmaUmaChecker/Library/Events.json \
            -o "$RUNNER_TEMP/event-inputs/Events.json"
      - name: Verify independent 30240 chain numerical candidates and fail-closed gates
        run: node --test umasupport/poc/tests/phase2_30240_independent_chain_numeric_review.test.cjs
      - name: Verify independent coverage triage with synthetic cards
        run: node --test umasupport/poc/tests/phase2_independent_roster_coverage.test.cjs
      - name: Verify purely synthetic event matching regressions
        run: node --test umasupport/poc/tests/whole_event_index.test.cjs umasupport/poc/tests/whole_event_reward_audit.test.cjs umasupport/poc/tests/whole_chain_topology.test.cjs umasupport/poc/tests/gametora_missing_card_triage.test.cjs umasupport/poc/tests/phase2_completeness_exception_queue.test.cjs umasupport/poc/tests/phase2_reviewed_event_aliases.test.cjs
      - name: Validate direct old-master crosswalk with synthetic SQLite
        run: python3 -m unittest discover -s umasupport/poc/tests -p 'test_direct_historical_chain.py' -v
      - name: Download pinned historical 2025 master for local title join only
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/historical-master"
          curl --fail --silent --show-error --location --retry 1 --max-time 240 \
            --output "$RUNNER_TEMP/historical-master/master.mdb" \
            "https://raw.githubusercontent.com/SimpleSandman/UmaMusumeMetaMasterMDB/5a8ec1356859a35e245edef0d40da740e652df68/master/master.mdb"
          echo "46363929ab097edf164d78a1e8f8d212dbf8c440a7c44431079198ca167002cb  $RUNNER_TEMP/historical-master/master.mdb" | sha256sum -c -
      - name: Generate first-party provisional union index, exclude source prose
        run: |
          node umasupport/poc/tools/build_whole_event_index.cjs \
            "$RUNNER_TEMP/event-inputs/support_card.txt" \
            "$RUNNER_TEMP/event-inputs/Events.json" \
            gt-snapshot/server/data/events/gametora \
            whole-event-output/whole_event_provisional.v1.json
      - name: Triage missing GameTora card records by numeric ID (not a game absence claim)
        run: |
          node umasupport/poc/tools/audit_missing_gametora_cards.cjs \
            whole-event-output/whole_event_provisional.v1.json \
            whole-event-output/gametora_missing_card_triage.v1.json
      - name: Freeze all unresolved source event identities and actual choice-count questions
        run: |
          node umasupport/poc/tools/build_phase2_completeness_exception_queue.cjs \
            whole-event-output/whole_event_provisional.v1.json \
            gt-snapshot/server/data/events/gametora \
            whole-event-output/phase2_completeness_exceptions.v1.json
      - name: Audit matched choices, reward hint levels and unordered outcomes (no publication)
        run: |
          node umasupport/poc/tools/audit_whole_event_rewards.cjs \
            whole-event-output/whole_event_provisional.v1.json \
            gt-snapshot/server/data/events/gametora \
            "$RUNNER_TEMP/event-inputs/Events.json" \
            "$RUNNER_TEMP/event-inputs/support_card.txt" \
            whole-event-output/whole_event_rewards_audit.v1.json
      - name: Audit all chain stages and conditional branch stops (no inferred links)
        run: |
          node umasupport/poc/tools/audit_whole_chain_topology.cjs \
            whole-event-output/whole_event_provisional.v1.json \
            whole-event-output/whole_event_rewards_audit.v1.json \
            gt-snapshot/server/data/events/gametora \
            whole-event-output/whole_chain_topology_review.v1.json
      - name: Directly cross-join GameTora and 2025 master names without Checker mediation
        run: |
          python3 umasupport/poc/tools/audit_direct_historical_chain.py \
            --master "$RUNNER_TEMP/historical-master/master.mdb" \
            --source-dir gt-snapshot/server/data/events/gametora \
            --topology whole-event-output/whole_chain_topology_review.v1.json \
            --output whole-event-output/whole_direct_2025_chain.v1.json
      - name: Test zero-assumption historical gap diagnosis
        run: python3 -m unittest discover -s umasupport/poc/tests -p 'test_targeted_historical_gaps.py' -v
      - name: Determine if older stage records exist for four unmatched historical pairs
        run: |
          python3 umasupport/poc/tools/inspect_direct_historical_gaps.py \
            --master "$RUNNER_TEMP/historical-master/master.mdb" \
            --source-dir gt-snapshot/server/data/events/gametora \
            --direct-audit whole-event-output/whole_direct_2025_chain.v1.json \
            --output whole-event-output/whole_targeted_2025_story_gaps.v1.json
      - name: Verify GameTora baseline route / exception tests
        run: node --test umasupport/poc/tests/gametora_event_resolution.test.cjs umasupport/poc/tests/event_source_precedence.test.cjs
      - name: Aggregate GameTora base for all chain stages (no GameWith reimport)
        run: |
          node umasupport/poc/tools/report_gametora_baseline.cjs \
            gt-snapshot/server/data/events/gametora \
            whole-event-output/gametora_canonical_baseline.v1.json
      - name: Verify GameTora all-events candidate normalization on synthetic cases
        run: node --test umasupport/poc/tests/gametora_whole_event_normalize.test.cjs
      - name: Normalize ALL pinned GameTora event/choice/outcome positions into numeric-only draft
        run: |
          node umasupport/poc/tools/generate_gametora_whole_event_candidate.cjs \
            whole-event-output/whole_event_provisional.v1.json \
            gt-snapshot/server/data/events/gametora \
            whole-event-output/gametora_whole_event_numeric_candidate.v1.json
      - name: Audit independent coverage risks for every one of 563 cards
        run: |
          node umasupport/poc/tools/audit_phase2_independent_roster_coverage.cjs \
            whole-event-output/whole_event_provisional.v1.json \
            whole-event-output/whole_chain_topology_review.v1.json \
            whole-event-output/gametora_whole_event_numeric_candidate.v1.json \
            whole-event-output/phase2_completeness_exceptions.v1.json \
            whole-event-output/phase2_independent_roster_coverage.v1.json
      - name: Fetch version-pinned UmaSim skill dictionary and verify checksum
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --retry 2 --max-time 120 \
            --output "$RUNNER_TEMP/event-inputs/skill_data.txt" \
            "https://raw.githubusercontent.com/mee1080/umasim/cf9366f6a487bd8f197b53d8a11981207beb9f6c/data/skill_data.txt"
          echo "b7ba1d6c5dd2af9ed1f4e649f16ec1d319198e2f1ac9db07c54e14d29f0b25ec  $RUNNER_TEMP/event-inputs/skill_data.txt" | sha256sum --check
      - name: Verify synthetic GameTora skill crosswalk tests
        run: node --test umasupport/poc/tests/gametora_event_skill_crosswalk.test.cjs
      - name: Crosswalk all 1681 numeric event hints with pinned 2139 skill registry records
        run: |
          node umasupport/poc/tools/audit_gametora_event_skill_crosswalk.cjs \
            whole-event-output/gametora_whole_event_numeric_candidate.v1.json \
            "$RUNNER_TEMP/event-inputs/skill_data.txt" \
            "$RUNNER_TEMP/event-inputs/support_card.txt" \
            whole-event-output/gametora_event_skill_crosswalk.v1.json
      - name: Verify 2025 master skill gap crosscheck with synthetic SQLite
        run: python3 -m unittest discover -s umasupport/poc/tests -p 'test_historical_missing_event_skills.py' -v
      - name: Check unresolved GT hint IDs against pinned 2025 master (NOT 2026 adoption)
        run: |
          python3 umasupport/poc/tools/crosscheck_missing_event_skills_2025.py \
            --master "$RUNNER_TEMP/historical-master/master.mdb" \
            --crosswalk whole-event-output/gametora_event_skill_crosswalk.v1.json \
            --output whole-event-output/historical_missing_skill_id_review.v1.json \
            --private-preview-output "$RUNNER_TEMP/historical-master/private_historical_skill_names.json"
      - name: Test independent 2026 skill metadata fingerprint auditor on synthetic fixtures
        run: node --test umasupport/poc/tests/independent_skill_fingerprint_audit.test.cjs
      - name: Compare missing fixed UmaSim IDs against immutable October 2026 public metadata
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --retry 2 --max-time 120             "https://raw.githubusercontent.com/Tsuyuchan-jp/umamusume-data/0cacbb1aaf9dca10283d5b9ea20b205b9d204535/data/skills.json"             -o "$RUNNER_TEMP/event-inputs/independent-skills-20261004.json"
          node umasupport/poc/tools/audit_independent_2026_skill_fingerprints.cjs             whole-event-output/historical_missing_skill_id_review.v1.json             "$RUNNER_TEMP/event-inputs/independent-skills-20261004.json"             whole-event-output/independent_2026_skill_fingerprints.v1.json
      - name: Test strictly quarantined skill fact extraction for 4 missing SSR cards
        run: node --test umasupport/poc/tests/missing_four_ssr_skill_fact_candidates.test.cjs
      - name: Backfill 20 fixed Checker candidate events and 2026 numeric hints into private audit ONLY
        run: |
          node umasupport/poc/tools/build_missing_four_ssr_skill_fact_candidates.cjs \
            whole-event-output/whole_event_provisional.v1.json \
            "$RUNNER_TEMP/event-inputs/Events.json" \
            "$RUNNER_TEMP/event-inputs/support_card.txt" \
            "$RUNNER_TEMP/event-inputs/independent-skills-20261004.json" \
            whole-event-output/missing_four_ssr_numeric_skill_candidates.v1.json
      - name: Verify 20 four-SSR editorial event positions and skill hints on synthetic fixtures
        run: node --test umasupport/poc/tests/phase2_four_ssr_editorial_review.test.cjs
      - name: Audit four-SSR 20-event source positions and 12 editorially corroborated numeric hints
        run: |
          node umasupport/poc/tools/audit_four_ssr_editorial_numeric_review.cjs \
            whole-event-output/missing_four_ssr_numeric_skill_candidates.v1.json \
            whole-event-output/phase2_four_ssr_editorial_numeric_review.v1.json
      - name: Verify synthetic 2026 external-name private registry preview
        run: node --test umasupport/poc/tests/independent_2026_skill_dry_run.test.cjs
      - name: Verify full private catalog digest parity comparison on synthetic fixtures
        run: node --test umasupport/poc/tests/private_schema_digest_parity.test.cjs
      - name: Prioritize sixteen residual Checker source positions by reported numeric hints
        run: node --test umasupport/poc/tests/phase2_2511_remaining_checker_skill_impact.test.cjs
      - name: Verify P1 success/failure rows do not acquire invented skill hints
        run: node --test umasupport/poc/tests/phase2_four_p1_outcome_review.test.cjs
      - name: Validate new P0 skill hint SSR30180 using the production loader
        run: node --test umasupport/poc/tests/phase2_30180_special_overlay.test.cjs
      - name: Reconcile after 2511 candidate integration without false missing-event closure
        run: node --test umasupport/poc/tests/phase2_2511_gap_reconciliation.test.cjs
      - name: Verify curated missing 15 chain stages with actual event flags and 2511-event production loader
        run: node --test umasupport/poc/tests/phase2_2511_chain_runtime.test.cjs
      - name: Verify disposable actual loader acceptance with strict numeric skill names
        run: node --test umasupport/poc/tests/phase2_integrated_private_loader.test.cjs
      - name: Validate synthetic 2488 GT plus 8 GameWith event assembly
        run: node --test umasupport/poc/tests/phase2_integrated_private_catalog.test.cjs
      - name: Verify 30080 exact private three-choice runtime projection with synthetic fixtures
        run: node --test umasupport/poc/tests/phase2_30080_runtime_overlay.test.cjs
      - name: Verify source exception overlay and root-cause tracing with synthetic cases
        run: node --test umasupport/poc/tests/phase2_release_triage.test.cjs
      - name: Verify synthetic full-GT unsigned review queue
        run: node --test umasupport/poc/tests/gametora_publication_review_queue.test.cjs
      - name: Verify synthetic ordinal-and-SHA event title binding
        run: node --test umasupport/poc/tests/gametora_short_event_title_intake.test.cjs
      - name: Verify synthetic source-to-runtime app schema conversion
        run: node --test umasupport/poc/tests/gametora_app_schema_dry_run.test.cjs
      - name: Independently freeze current UmaSim and curated IDs without 2025 historical preview
        run: |
          node umasupport/poc/tools/probe_gametora_app_schema_dry_run.cjs \
            whole-event-output/gametora_whole_event_numeric_candidate.v1.json \
            whole-event-output/gametora_event_skill_crosswalk.v1.json \
            "$RUNNER_TEMP/event-inputs/skill_data.txt" \
            "$RUNNER_TEMP/event-inputs/support_card.txt" \
            whole-event-output/gametora_app_schema_no_historical.v1.json
      - name: Dry-run runtime schema for GT events with all required facts resolved
        run: |
          node umasupport/poc/tools/probe_gametora_app_schema_dry_run.cjs \
            whole-event-output/gametora_whole_event_numeric_candidate.v1.json \
            whole-event-output/gametora_event_skill_crosswalk.v1.json \
            "$RUNNER_TEMP/event-inputs/skill_data.txt" \
            "$RUNNER_TEMP/event-inputs/support_card.txt" \
            whole-event-output/gametora_app_schema_dry_run_summary.v1.json \
            whole-event-output/historical_missing_skill_id_review.v1.json \
            "$RUNNER_TEMP/historical-master/private_historical_skill_names.json"
      - name: Dry-run complete fixed event catalog with 2026 names and 2025 hashed numeric evidence
        env:
          UMASUPPORT_GT_EVENT_DIR: gt-snapshot/server/data/events/gametora
          UMASUPPORT_GT_BASELINE_REPORT: whole-event-output/gametora_app_schema_no_historical.v1.json
          UMASUPPORT_GT_REVIEW_QUEUE_OUTPUT: whole-event-output/gametora_unsigned_release_review.v1.json
          UMASUPPORT_GT_CROSS_SOURCE_QUEUE: whole-event-output/phase2_completeness_exceptions.v1.json
          UMASUPPORT_GT_TRIAGE_OUTPUT: whole-event-output/phase2_cross_source_release_triage.v1.json
        run: |
          node umasupport/poc/tools/probe_gametora_app_schema_dry_run.cjs \
            whole-event-output/gametora_whole_event_numeric_candidate.v1.json \
            whole-event-output/gametora_event_skill_crosswalk.v1.json \
            "$RUNNER_TEMP/event-inputs/skill_data.txt" \
            "$RUNNER_TEMP/event-inputs/support_card.txt" \
            whole-event-output/gametora_app_schema_private_2026_name_preview_summary.v1.json \
            whole-event-output/historical_missing_skill_id_review.v1.json \
            "$RUNNER_TEMP/event-inputs/independent-skills-20261004.json" \
            whole-event-output/independent_2026_skill_fingerprints.v1.json
      - name: Verify 2025 and 2026-name full 2488-event private catalogs are byte-identical
        run: |
          node umasupport/poc/tools/check_private_schema_digest_parity.cjs \
            whole-event-output/gametora_app_schema_dry_run_summary.v1.json \
            whole-event-output/gametora_app_schema_private_2026_name_preview_summary.v1.json
      - name: Audit SSR30240's three missing chain stages against pinned 2026 skill identity (no publication)
        run: |
          node umasupport/poc/tools/audit_30240_independent_chain_numeric_review.cjs \
            whole-event-output/whole_event_provisional.v1.json \
