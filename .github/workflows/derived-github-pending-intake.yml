name: Track new UmaSim support cards awaiting direct GameTora event intake

on:
  schedule:
    # 03:40 UTC = 12:40 JST; GitHub scheduled jobs may run late.
    - cron: '40 3 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/derived-github-pending-intake.yml'
      - 'poc/data/reviewed_events.v1.json'
      - 'poc/src/derived_github_pending_ledger.cjs'
      - 'poc/src/derived_github_pending_refresh.cjs'
      - 'poc/tools/refresh_derived_github_pending_ledger.cjs'
      - 'poc/tools/plan_umasim_first_pending_intake.cjs'
      - 'poc/src/direct_pending_review.cjs'
      - 'poc/src/d069_json_attempt_ledger.cjs'
      - 'poc/src/d069_github_attempt_store.cjs'
      - 'poc/src/d072_automatic_json_intake.cjs'
      - 'poc/src/d069_card_json_transport.cjs'
      - 'poc/src/official_gametora_card_json.cjs'
      - 'poc/src/d069_json_review_bridge.cjs'
      - 'poc/src/d072_offline_review_queue.cjs'
      - 'poc/src/d073_json_adoption.cjs'
      - 'poc/src/d072_catalog_prefix.cjs'
      - 'poc/tests/d072_offline_review_queue.test.cjs'
      - 'poc/src/d069_review_packet_archive.cjs'
      - 'poc/config/direct-event-pending-review.v1.json'
      - 'poc/config/direct-event-intake-policy.v1.json'
      - 'poc/tests/direct_pending_review.test.cjs'

permissions:
  contents: write
  issues: write

concurrency:
  group: gametora-direct-new-card-limited-read
  cancel-in-progress: false

jobs:
  update-new-card-pending:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify metadata-only ledger and replay logic
        run: |
          node --test poc/tests/derived_github_pending_ledger.test.cjs poc/tests/direct_pending_review.test.cjs poc/tests/d069_json_attempt_ledger.test.cjs poc/tests/d069_github_attempt_store.test.cjs
      - name: Read latest UmaSim commit and the previous pending-card Issue
        uses: actions/github-script@v7
        with:
          script: |
            const fs=require('node:fs');
            const previous=require('./poc/src/derived_github_pending_ledger.cjs');
            const uma=await github.rest.repos.getCommit({
              owner:'mee1080',repo:'umasim',ref:'main'
            });
            const tree=(await github.rest.git.getTree({
              owner:'mee1080',repo:'umasim',tree_sha:uma.data.commit.tree.sha,recursive:'1'
            })).data;
            if(tree.truncated!==false)throw Error('Incomplete UmaSim tree');
            const skills=tree.tree.filter(x=>x.path==='data/skill_data.txt'&&x.type==='blob');
            if(skills.length!==1||!/^[0-9a-f]{40}$/.test(skills[0].sha))throw Error('Missing immutable UmaSim skill coordinates');
            const cards=tree.tree.filter(x=>x.path==='data/support_card.txt'&&x.type==='blob');
            if(cards.length!==1||!/^[0-9a-f]{40}$/.test(cards[0].sha)||!/^[0-9a-f]{40}$/.test(uma.data.sha))
              throw Error('Missing immutable UmaSim roster coordinates');
            const temp=process.env.RUNNER_TEMP;
            fs.writeFileSync(temp+'/pending-heads.json',JSON.stringify({
              skillCommit:uma.data.sha,cardBlob:cards[0].sha,skillBlob:skills[0].sha
            }));
            const title='New support cards pending GameTora-derived event intake';
            const open=await github.paginate(github.rest.issues.listForRepo,{
              owner:context.repo.owner,repo:context.repo.repo,
              state:'open',per_page:100});
            const matches=open.filter(x=>!x.pull_request&&x.title===title);
            if(matches.length>1)throw Error('Multiple active new-card ledger issues');
            const issue=matches[0];
            const mark='<!-- UMASUPPORT_DERIVED_PENDING_LEDGER_V1\n';
            let old=previous.emptyLedger();
            if(issue){
              const body=issue.body||'';
              const a=body.indexOf(mark);
              const b=body.indexOf('\n-->',a+mark.length);
              if(a<0||b<0||body.indexOf(mark,a+mark.length)!==-1)
                throw Error('Existing pending issue state marker missing or duplicated');
              old=previous.verifyLedger(JSON.parse(body.slice(a+mark.length,b)));
            }
            fs.writeFileSync(temp+'/pending-before.json',JSON.stringify(old));
            fs.writeFileSync(temp+'/pending-issue.json',
              JSON.stringify(issue?{number:issue.number}:{}));
      - name: Download pinned base/full current UmaSim inputs to ephemeral runner
        shell: bash
        run: |
          set -euo pipefail
          UMA_SHA=$(node -e "const h=require(process.env.RUNNER_TEMP+'/pending-heads.json'); console.log(h.skillCommit)")
          [[ "$UMA_SHA" =~ ^[0-9a-f]{40}$ ]]
          curl --fail --location --silent --show-error --retry 2 --max-time 60 \
            'https://raw.githubusercontent.com/mee1080/umasim/91952973eb334ae530b8cd76541bce8a01a141cd/data/support_card.txt' \
            -o "$RUNNER_TEMP/pending-baseline-roster.txt"
          curl --fail --location --silent --show-error --retry 2 --max-time 60 \
            "https://raw.githubusercontent.com/mee1080/umasim/$UMA_SHA/data/support_card.txt" \
            -o "$RUNNER_TEMP/pending-latest-roster.txt"
      - name: Check UmaSim unsupported support IDs before contacting event DB
        id: targets
        shell: bash
        run: |
          set -euo pipefail
          node -e "const fs=require('node:fs'); const t=process.env.RUNNER_TEMP; const pin=require(t+'/pending-heads.json'); const {gitBlobSha}=require('./poc/src/current_umasim_roster_delta.cjs'); if(gitBlobSha(fs.readFileSync(t+'/pending-latest-roster.txt','utf8'))!==pin.cardBlob)throw Error('Latest UmaSim roster blob mismatch')"
          node poc/tools/plan_umasim_first_pending_intake.cjs \
            "$RUNNER_TEMP/pending-baseline-roster.txt" \
            "$RUNNER_TEMP/pending-latest-roster.txt" \
            "$RUNNER_TEMP/pending-before.json" \
            "$RUNNER_TEMP/pending-after" "$GITHUB_OUTPUT" --direct-roster-only
      - name: Update a single public numeric-ID-only pending issue if status changed
        uses: actions/github-script@v7
        with:
          script: |
            const fs=require('node:fs');
            const {verifyLedger}=require('./poc/src/derived_github_pending_ledger.cjs');
            const temp=process.env.RUNNER_TEMP;
            const previous=verifyLedger(JSON.parse(
              fs.readFileSync(temp+'/pending-before.json','utf8')));
            const next=verifyLedger(JSON.parse(
              fs.readFileSync(temp+'/pending-after.ledger.json','utf8')));
            const summary=JSON.parse(
              fs.readFileSync(temp+'/pending-after.summary.json','utf8'));
            const prior=JSON.parse(
              fs.readFileSync(temp+'/pending-issue.json','utf8'));
            const pin=JSON.parse(fs.readFileSync(temp+'/pending-heads.json','utf8'));
            const review=require('./poc/config/direct-event-pending-review.v1.json');
            const basePlan=require('./poc/src/direct_pending_review.cjs').planEventDrivenIntake({
              previous,next,review,sourcePin:{commit:pin.skillCommit,cardBlob:pin.cardBlob},
              policy:require('./poc/config/direct-event-intake-policy.v1.json')});
            const attemptStore=require('./poc/src/d069_github_attempt_store.cjs').createStore({github,...context.repo});
            const policy=require('./poc/config/direct-event-intake-policy.v1.json');
            const catalog=require('./poc/data/reviewed_events.v1.json');
            const auto=await require('./poc/src/d072_automatic_json_intake.cjs').runAutomatic({
              plan:basePlan,sourcePin:{commit:pin.skillCommit,cardBlob:pin.cardBlob,skillBlob:pin.skillBlob},
              policy,existingCatalog:catalog,store:attemptStore,loadSkillText:async()=>{
                const r=await github.rest.git.getBlob({owner:'mee1080',repo:'umasim',file_sha:pin.skillBlob});
                if(r.data.encoding!=='base64'||r.data.sha!==pin.skillBlob)throw Error('Skill blob mismatch');
                return Buffer.from(r.data.content,'base64').toString('utf8');
              }
            });
            core.info('D072_AUTOMATIC_INTAKE='+JSON.stringify(auto));
            const eventPlan=require('./poc/src/d069_json_attempt_ledger.cjs').excludeAttempted(basePlan,await attemptStore.load());
            core.info('D069_EVENT_DRIVEN_PLAN='+JSON.stringify(eventPlan));
            const reviewQueue=await require('./poc/src/d072_offline_review_queue.cjs').buildReviewQueue({
              store:attemptStore,pendingIds:next.cards.map(c=>c.cardId),existingCatalog:catalog,
              loadSkillText:async source=>{
                const r=await github.rest.git.getBlob({owner:'mee1080',repo:'umasim',file_sha:source.skillBlob});
                if(r.data.encoding!=='base64'||r.data.sha!==source.skillBlob)throw Error('Pinned skill blob mismatch');
                return Buffer.from(r.data.content,'base64').toString('utf8');
              }
            });
            core.info('D072_OFFLINE_REVIEW_QUEUE='+JSON.stringify(reviewQueue));
            const owner=context.repo.owner,repo=context.repo.repo;
            const title='New support cards pending GameTora-derived event intake';
            core.info('NEW_CARD_INTAKE_SUMMARY='+JSON.stringify(summary));
            await core.summary.addHeading('New-card-only event intake (metadata)')
              .addTable([
                [{data:'Pending status',header:true},{data:'Cards',header:true}],
                ...Object.entries(summary.states).map(([s,count])=>[s,String(count)])
              ])
              .addRaw('New cards: '+summary.discoveredNewCardIds.join(', ')+
                '; review flags: '+summary.reviewIssues+
                '. Existing catalog untouched; no automatic event publication.')
              .addRaw(summary.sourceStatus==='direct-review-pending'?'\nD067: direct GameTora review pending; new-card-only acquisition; no legacy repository requests.':'')
              .addHeading('D069 event-driven intake preflight')
              .addRaw('Status: '+eventPlan.status+'; newly queued: '+(eventPlan.newlyQueuedIds.join(', ')||'none')+
                '; planned sequential batches: '+(eventPlan.batches.map(b=>b.join(', ')).join(' / ')||'none')+
                '; held: '+(eventPlan.heldIds.join(', ')||'none')+
                '; attempted: '+(eventPlan.attemptedIds.join(', ')||'none')+
                '; new-card-only acquisition; publication remains gated.')
              .addHeading('Archived packet review preflight')
              .addRaw(reviewQueue.rows.map(r=>r.cardId+': '+r.status+(r.sourceCandidateInputReady?' (source candidate input ready)':'')).join('; ')||'No pending cards')
              .write();
            const direct=summary.sourceStatus==='direct-review-pending';
            const rows=require('./poc/src/direct_pending_review.cjs').describePending(next,require('./poc/config/direct-event-pending-review.v1.json'));
            const attempts=new Map(eventPlan.attemptStates.map(r=>[r.cardId,r]));
            for(const row of rows){const a=attempts.get(row.cardId);if(a){row.currentStatus='json-attempt-'+a.status;row.reasonCodes=[...row.reasonCodes,'no-automatic-revisit'];}}
            const reviews=new Map(reviewQueue.rows.map(r=>[r.cardId,r]));
            for(const row of rows){const v=reviews.get(row.cardId);if(v&&v.packetSha256){row.currentStatus='json-review-'+v.status;row.observedEvents=v.eventCount;row.reasonCodes=[...new Set([...row.reasonCodes,...v.reasonCodes])];}}
            core.info('DIRECT_PENDING_REVIEW='+JSON.stringify(rows));
            if(next.cards.length===0){
              if(prior.number)await github.rest.issues.update({
                owner,repo,issue_number:prior.number,
                state:'closed',state_reason:'completed'});
              core.info('No unimported new cards; old Issue closed if present');
              return;
            }
            const marker='<!-- UMASUPPORT_DERIVED_PENDING_LEDGER_V1\n'+
              JSON.stringify(next)+'\n-->';
            const lines=[
              'This is an automated, **metadata-only** pending ledger for newly added UmaSim support cards.',
              'Event text, choice descriptions, source JSON, private drafts and copyrighted prose are not stored here.',
              'D067: GameTora original site is the new-card source. GameWith is consulted only for specific flagged facts. Historical ledger repository and existing rows retain old observations, not current availability.',
              'A successfully converted card stays pending until actually appended under the separate approval gate.',
              ...(direct?['**Direct source review pending. This job attempts only new, unattempted IDs. Current review status is separate from historical GitHub observations. Observed event counts are not game coverage or publication.**']:[]),
              'D069 preflight: '+eventPlan.status+'; planned sequential batches: '+(eventPlan.batches.map(b=>b.join(', ')).join(' / ')||'none')+
                '; total unreviewed: '+eventPlan.eligibleIds.length+
                '. D072 permits new-card-only automatic acquisition; publication remains gated.',
              'Automatic acquisition: '+(auto.attemptedIds.join(', ')||'none')+'; stop: '+(auto.stopReason||'none'),
              'Persistent JSON attempts: '+(eventPlan.attemptedIds.join(', ')||'none')+'. These remain pending until approved append.',
              'Use Issue comments for human notes; the machine-controlled body is replaced only when the ledger changes.',
              '',
              '| Card ID | Current direct review | Observed events | Observation | Hold reasons | Historical GitHub status |',
              '| --- | --- | ---: | --- | --- | --- |',
              ...rows.map(r=>'| '+r.cardId+' | '+r.currentStatus+
                ' | '+(r.observedEvents??'unknown')+
                ' | '+(r.runId?'[run '+r.runId+'](https://github.com/'+owner+'/'+repo+'/actions/runs/'+r.runId+') '+r.observedAt:'not observed')+
                ' | '+(r.reasonCodes.join(', ')||'not reviewed')+' | '+r.historicalStatus+' |'),
              '',
              'Review coordinates and reason codes are embedded below for durable next-run replay.',
              marker
            ];
            const body=lines.join('\n');
            if(body.length>62000)throw Error('Pending issue metadata exceeds GitHub issue limit');
            if(prior.number){
              const current=await github.rest.issues.get({owner,repo,issue_number:prior.number});
              if(current.data.body===body){core.info('No pending-card metadata changes; leave Issue unchanged');return;}
              await github.rest.issues.update({
                owner,repo,issue_number:prior.number,body});
              core.notice('Updated new-card pending Issue #'+prior.number);
            }else{
              const created=await github.rest.issues.create({
                owner,repo,title,body});
              core.notice('Created new-card pending Issue: '+created.data.html_url);
            }

