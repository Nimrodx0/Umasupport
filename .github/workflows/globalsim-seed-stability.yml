name: GlobalSim race-seed stability study

on:
  workflow_dispatch:
    inputs:
      seeds_per_cell:
        description: "Simulated races per (3 courses x 2 field sizes x 2 source priors x 2 stat settings), 1..20"
        type: number
        required: true
        default: 15
  pull_request:
    paths:
      - 'poc/tools/globalsim_seed_stability.cjs'
      - 'poc/tests/globalsim_seed_stability.test.cjs'
      - 'poc/tools/globalsim_dense_window_validation.cjs'
      - '.github/workflows/globalsim-seed-stability.yml'
permissions:
  contents: read

jobs:
  race-seed-stability:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Validate race-based resampling and seed accounting
        run: |
          node --check poc/tools/globalsim_dense_window_validation.cjs
          node --check poc/tools/globalsim_seed_stability.cjs
          node --test poc/tests/globalsim_dense_window_validation.test.cjs poc/tests/globalsim_seed_stability.test.cjs
      - name: Check out exact pinned GlobalSim v77 revision
        run: |
          mkdir -p /tmp/globalsim
          cd /tmp/globalsim
          git init -q
          git remote add origin https://github.com/daftuyda/GlobalSim.git
          git fetch -q --depth 1 origin 80b54cacf174b54ff6f7ca27ee7f88b5856c0bd1
          git checkout -q --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "80b54cacf174b54ff6f7ca27ee7f88b5856c0bd1"
      - name: Compile unchanged GlobalSim engine using locked dependencies
        run: |
          cd /tmp/globalsim
          cargo build --release --locked
      - name: Evaluate 3/10/15-seed prefixes, separate halves and race-block resamples
        env:
          SEEDS_PER_CELL: ${{ inputs.seeds_per_cell || '15' }}
        run: |
          case "$SEEDS_PER_CELL" in
            ''|*[!0-9]*) echo "Invalid seeds_per_cell" >&2; exit 2 ;;
          esac
          if [ "$SEEDS_PER_CELL" -lt 1 ] || [ "$SEEDS_PER_CELL" -gt 20 ]; then
            echo "seeds_per_cell must be 1..20" >&2
            exit 2
          fi
          mkdir -p /tmp/globalsim-race-stability
          node --max-old-space-size=3072 poc/tools/globalsim_seed_stability.cjs \
            /tmp/globalsim/examples/v77-race.jsonl \
            /tmp/globalsim/target/release/race_engine_rs_v2 \
            /tmp/globalsim-race-stability/stability.json \
            "$SEEDS_PER_CELL"
      - name: Save aggregated stability statistics only
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: globalsim-race-seed-stability
          path: /tmp/globalsim-race-stability/stability.json
          retention-days: 14
