name: P3 default coarse style candidate card preview (fixed source)

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'poc/src/skill_default_coarse_preview.cjs'
      - 'poc/tests/skill_default_coarse_preview.test.cjs'
      - 'poc/tools/audit_default_coarse_card_preview.cjs'
      - '.github/workflows/p3-default-coarse-card-preview.yml'

permissions:
  contents: read

jobs:
  fixed-566-card-trial:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify conservative qualitative evidence and grant-route semantics
        run: |
          node --check poc/src/skill_default_coarse_preview.cjs
          node --check poc/tools/audit_default_coarse_card_preview.cjs
          node --test poc/tests/skill_default_coarse_preview.test.cjs
          node --test poc/tests/skill_balanced_four_style_fit.test.cjs
          node --test poc/tests/skill_activation_fit_v1.test.cjs
      - name: Download immutable source registry, support cards and reviewed release legacy registry
        run: |
          mkdir -p /tmp/p3-coarse
          node - <<'NODE'
          const fs=require('node:fs'),crypto=require('node:crypto');
          const bridge=require('./poc/src/skill_bridge.js');
          const rev='f6e4501ee6c6c2d4ac8698e7796e309d31575bde';
          const base='https://raw.githubusercontent.com/mee1080/umasim/'+rev+'/data/';
          const arr=[
            [base+'skill_data.txt','skill_data.txt',
              '4c036527bbe6b5aad34d7f12110a06094c9071514e37fdfc68ae195403333be5'],
            [base+'support_card.txt','support_card.txt',null],
            [bridge.PINNED_URL,'pinned_legacy_skills.txt',bridge.PINNED_SHA256]
          ];
          (async()=>{for(const [url,name,expected] of arr){
            const r=await fetch(url,{signal:AbortSignal.timeout(60000)});
            if(!r.ok)throw Error('Pinned source unavailable '+name+' '+r.status);
            const bytes=Buffer.from(await r.arrayBuffer());
            if(expected&&crypto.createHash('sha256').update(bytes).digest('hex')!==expected)
              throw Error('Pinned publisher source checksum changed '+name);
            fs.writeFileSync('/tmp/p3-coarse/'+name,bytes);
          }})().catch(e=>{console.error(e);process.exitCode=1});
          NODE
      - name: Evaluate source-verified skill acquisition candidates on 566 real public cards
        run: |
          node poc/tools/audit_default_coarse_card_preview.cjs \
            /tmp/p3-coarse/skill_data.txt \
            /tmp/p3-coarse/support_card.txt \
            /tmp/p3-coarse/pinned_legacy_skills.txt \
            poc/data/reviewed_events.v1.json \
            /tmp/p3-coarse/p3-coarse-style-readonly.json \
            > /tmp/p3-coarse/summary.json
          node - <<'NODE'
          const fs=require('node:fs'),assert=require('node:assert/strict');
          const x=JSON.parse(fs.readFileSync('/tmp/p3-coarse/p3-coarse-style-readonly.json'));
          assert.equal(x.cards,566);
          assert.equal(x.appSkills,881);
          assert.equal(x.sourceP1Coverage.matched,818);
          assert.equal(x.trialConfig.supportStage,4);
          assert.equal(x.trialConfig.referenceScenario,'balanced-only');
          assert(x.approvedEventsWithRecords>0);
          assert(x.uniqueCardSkillCandidates>0);
          assert(x.cardsWithAtLeastOneQualitativeSignal>0);
          assert.equal(x.examples.length,12);
          for(const p of x.examples){
           assert(p.coverage.verifiedNormalHints);
           for(const s of ['逃げ','先行','差し','追込']){
            assert(['favorable','mixed','unfavorable','unresolved']
             .includes(p.styles[s].label));
           }
          }
          console.log(JSON.stringify({cards:x.cards,reviewedEvents:x.approvedEventsWithRecords,
           skillCandidates:x.uniqueCardSkillCandidates,
           cardsWithEvidence:x.cardsWithAtLeastOneQualitativeSignal,
           byStyle:x.byStyle,examples:x.examples.slice(0,4).map(e=>({
            id:e.cardId,name:e.cardName,
            styles:Object.fromEntries(Object.entries(e.styles).map(([k,v])=>
             [k,{label:v.labelJa,relative:v.strongFourStyleEvidence,
              broad:v.oldBroadModelHints??v.broadFavorable+v.broadUnfavorable}]))
           }))},null,2));
          NODE
          rm -f /tmp/p3-coarse/skill_data.txt /tmp/p3-coarse/support_card.txt \
            /tmp/p3-coarse/pinned_legacy_skills.txt
      - name: Retain derived aggregate and example audit, not source text
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: p3-coarse-card-default-566-review-only
          path: /tmp/p3-coarse/p3-coarse-style-readonly.json
          retention-days: 14
