name: One-time skill activation condition inventory

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'poc/src/skill_condition_inventory.cjs'
      - 'poc/src/skill_condition_research_triage.cjs'
      - 'poc/src/skill_condition_spec_omission.cjs'
      - 'poc/tests/skill_condition_spec_omission.test.cjs'
      - 'poc/src/skill_p2_32_research_queue.cjs'
      - 'poc/tests/skill_p2_32_research_queue.test.cjs'
      - 'poc/src/skill_p2_15_mechanism_evidence.cjs'
      - 'poc/src/skill_p2_32_mechanism_reuse.cjs'
      - 'poc/tests/skill_p2_32_mechanism_reuse.test.cjs'
      - 'docs/evidence/skills/skill-p2-32-mechanism-reuse-20261113.md'
      - 'poc/src/skill_condition_mixed_cohort.cjs'
      - 'poc/src/skill_coarse_style_review.cjs'
      - 'poc/src/skill_full_condition_path_audit.cjs'
      - 'poc/src/skill_source_path_blocker_impact.cjs'
      - 'poc/src/skill_phase_random_source_window_audit.cjs'
      - 'poc/tests/skill_phase_random_source_window_audit.test.cjs'
      - 'poc/src/skill_track_id_venue_audit.cjs'
      - 'poc/tests/skill_track_id_venue_audit.test.cjs'
      - 'poc/tests/skill_source_path_blocker_impact.test.cjs'
      - 'poc/tests/skill_full_condition_path_audit.test.cjs'
      - 'docs/plans/skill-conditions/p2.md'
      - 'poc/src/skill_halfphase_feasibility.cjs'
      - 'poc/tests/skill_halfphase_feasibility.test.cjs'
      - 'poc/tests/skill_coarse_style_review.test.cjs'
      - 'poc/src/skill_change_order_source_paths.cjs'
      - 'poc/tests/skill_change_order_source_paths.test.cjs'
      - 'poc/src/skill_rank_corner_source_cohort.cjs'
      - 'poc/tests/skill_rank_corner_source_cohort.test.cjs'
      - 'poc/tests/skill_condition_mixed_cohort.test.cjs'
      - 'poc/tests/skill_condition_research_triage.test.cjs'
      - 'poc/tools/audit_skill_conditions.cjs'
      - 'poc/tests/skill_condition_inventory.test.cjs'
      - 'poc/src/skill_condition_tags.js'
      - 'poc/src/skill_condition_profiles.js'
      - 'poc/tests/skill_condition_profiles.test.cjs'
      - 'poc/src/skill_condition_combinations.cjs'
      - 'poc/tests/skill_condition_combinations.test.cjs'
      - 'poc/src/skill_rank_timing.js'
      - 'poc/src/skill_rank_timing_audit.cjs'
      - 'poc/tests/skill_rank_timing.test.cjs'
      - 'poc/tests/skill_rank_timing_audit.test.cjs'
      - 'poc/src/skill_style_tendency.js'
      - 'poc/tests/skill_style_tendency.test.cjs'
      - 'poc/src/skill_style_review.cjs'
      - 'poc/tests/skill_style_review.test.cjs'
      - 'poc/live.html'
      - 'poc/tests/browser_skill_smoke.cjs'
      - '.github/workflows/skill-condition-inventory.yml'

permissions:
  contents: read

jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test P0 inventory and P1 activation profiles against synthetic predicates
        run: |
          node --check poc/src/skill_condition_inventory.cjs
          node --check poc/src/skill_condition_research_triage.cjs
          node --check poc/src/skill_condition_spec_omission.cjs
          node --test poc/tests/skill_condition_spec_omission.test.cjs
          node --check poc/src/skill_p2_32_research_queue.cjs
          node --test poc/tests/skill_p2_32_research_queue.test.cjs
          node --check poc/src/skill_p2_15_mechanism_evidence.cjs
          node --check poc/src/skill_p2_32_mechanism_reuse.cjs
          node --test poc/tests/skill_p2_32_mechanism_reuse.test.cjs
          node --check poc/src/skill_coarse_style_review.cjs
          node --check poc/src/skill_full_condition_path_audit.cjs
          node --check poc/src/skill_source_path_blocker_impact.cjs
          node --check poc/src/skill_phase_random_source_window_audit.cjs
          node --test poc/tests/skill_phase_random_source_window_audit.test.cjs
          node --test poc/tests/skill_source_path_blocker_impact.test.cjs
          node --check poc/src/skill_track_id_venue_audit.cjs
          node --test poc/tests/skill_track_id_venue_audit.test.cjs
          node --check poc/src/skill_halfphase_feasibility.cjs
          node --check poc/src/skill_condition_mixed_cohort.cjs
          node --check poc/src/skill_change_order_source_paths.cjs
          node --check poc/src/skill_rank_corner_source_cohort.cjs
          node --check poc/src/skill_condition_tags.js
          node --check poc/src/skill_condition_profiles.js
          node --check poc/tools/audit_skill_conditions.cjs
          node --check poc/src/skill_condition_combinations.cjs
          node --check poc/src/skill_rank_timing.js
          node --check poc/src/skill_rank_timing_audit.cjs
          node --check poc/src/skill_style_tendency.js
          node --check poc/src/skill_style_review.cjs
          node --test poc/tests/skill_condition_research_triage.test.cjs
          node --test poc/tests/skill_coarse_style_review.test.cjs
          node --test poc/tests/skill_full_condition_path_audit.test.cjs
          node --test poc/tests/skill_halfphase_feasibility.test.cjs
          node --test poc/tests/skill_condition_mixed_cohort.test.cjs
          node --test poc/tests/skill_change_order_source_paths.test.cjs
          node --test poc/tests/skill_rank_corner_source_cohort.test.cjs
          node --test poc/tests/skill_condition_inventory.test.cjs poc/tests/skill_condition_profiles.test.cjs poc/tests/skill_condition_combinations.test.cjs poc/tests/skill_rank_timing.test.cjs poc/tests/skill_rank_timing_audit.test.cjs poc/tests/skill_style_tendency.test.cjs poc/tests/skill_style_review.test.cjs
      - name: Audit pinned skill registry and current published app model
        env:
          UMASIM_REVISION: f6e4501ee6c6c2d4ac8698e7796e309d31575bde
        run: node poc/tools/audit_skill_conditions.cjs
      - name: Check fixed-cohort research triage completeness without promoting suitability
        run: |
          node - <<'NODE'
          const fs=require('node:fs'),assert=require('node:assert/strict');
          const x=JSON.parse(fs.readFileSync('p2-condition-research-triage.json'));
          assert.equal(x.schemaVersion,1);
          assert.equal(x.status,'P2-condition-type-research-triage-not-skill-or-card-suitability');
          assert.equal(x.summary.totalSourceTypes,125);
          assert.equal(x.summary.appMatchedTypes,90);
          assert.equal(x.summary.appMatchedSkillRecords,818);
          assert.equal(x.summary.noAutomaticStyleLabels,true);
          assert.equal(x.summary.noAutomaticUniversalStyleInferences,true);
          assert.equal(x.summary.skillEffectUtility,'future-extension-only');
          assert.equal(x.byType.length,125);
          assert(x.byType.every(t=>Number.isSafeInteger(t.appMatchedSkills) &&
            t.appMatchedSkills>=0&&typeof t.group==='string'));
          console.log('P2 condition research triage complete:',JSON.stringify(x.summary,null,2));
          NODE
      - name: Verify actual mixed rank/deferred source-path population
        run: |
          node - <<'NODE'
          const fs=require('node:fs'),assert=require('node:assert/strict');
          const a=JSON.parse(fs.readFileSync('p2-mixed-rank-deferred-audit.json'));
          assert.equal(a.schemaVersion,1);
          assert.equal(a.mixedSkills,17);
          assert.equal(a.sourceDenominator,818);
          assert.equal(a.cases.length,17);
          assert.equal(new Set(a.cases.map(x=>x.sourceNumericId)).size,17);
          assert.equal(a.byRelation.sameAnd+a.byRelation.sameInvokeOnlyWithoutSameAnd+
            a.byRelation.differentInvokeOnly,17);
          assert(a.cases.every(x=>x.disposition==='hold-whole-skill-style-suitability'));
          console.log(JSON.stringify({status:a.status,
            mixedSkills:a.mixedSkills,byRelation:a.byRelation,
            byDeferredType:a.byDeferredType},null,2));
          NODE
      - name: Validate fixed absolute-order and corner-rank source study cohort
        run: |
          node - <<'NODE'
          const fs=require('node:fs'),assert=require('node:assert/strict');
          const p=JSON.parse(fs.readFileSync('p2-rank-corner-source-cohort.json'));
          assert.equal(p.schemaVersion,1);
          assert.equal(p.sourceRecords,818);
          assert.equal(p.summary.absoluteOrder.distinctSkills,34);
          assert.equal(p.summary.cornerRank.distinctSkills,13);
          assert.equal(p.summary.noFullSkillRatings,true);
          assert(p.paths.every(x=>x.fullyModeledSkill===false));
          console.log(JSON.stringify(p.summary,null,2));
          NODE
      - name: Verify pinned change_order_onetime source-path structure
        run: |
          node - <<'NODE'
          const fs=require('node:fs'),assert=require('node:assert/strict');
          const p=JSON.parse(fs.readFileSync('p2-change-order-source-paths.json'));
          assert.equal(p.schemaVersion,1);
          assert.equal(p.status,'P2-source-change-order-path-structure-not-complete-proc');
          assert.equal(p.matchedSkillDenominator,818);
          assert.equal(p.summary.sourceSkills,30);
          assert(p.summary.sourceAndPaths>=30);
          assert(p.paths.every(x=>x.fullSkillEvaluated===false));
          assert.equal(new Set(p.paths.map(x=>x.sourceNumericId)).size,30);
          console.log('P2_CHANGE_ORDER_PATH_REPORT_START');
          console.log(JSON.stringify(p.summary,null,2));
          console.log('P2_CHANGE_ORDER_PATH_REPORT_END');
          NODE
      - name: Validate P2.32 fixed-game-state candidate report (never actual omission or rating)
        run: |
          node - <<'NODE'
          const fs=require('node:fs'),assert=require('node:assert/strict');
          const x=JSON.parse(fs.readFileSync('p2-32-spec-conditional-omission.json','utf8'));
          assert.equal(x.schemaVersion,1);
          assert.equal(x.status,'p2-32-game-spec-conditional-omission-triage-only');
          assert.equal(x.source.revision,
           'f6e4501ee6c6c2d4ac8698e7796e309d31575bde');
          assert.equal(x.denominators.appSkills,881);
          assert.equal(x.denominators.sourceMatchedSkills,818);
          assert.equal(x.denominators.sourceUnavailableSkills,63);
          assert.equal(x.denominators.actualAppliedOmissions,0);
          assert.equal(x.denominators.confirmedUnconditionalSkillActivation,0);
          assert.equal(x.denominators.officialSkillOrCardRatings,0);
          assert.equal(x.denominators.originalPredicateOccurrences,
           x.denominators.conditionalOmissionCandidateOccurrences+
           x.denominators.explicitGateOccurrences+
           x.denominators.holdForReviewOccurrences);
          assert.equal(x.rows.length,x.denominators.appSkills);
          assert(x.rows.every(r=>r.status==='source-unavailable'||
           r.occurrences.every(o=>
            o.classification!=='conditional-axis-omission-candidate'||
            o.type==='motivation')));
          console.log('P2_32_SPEC_AUDIT='+JSON.stringify(x.denominators));
          NODE
      - name: Validate P2.32 source-route research queue and no-rating boundary
        run: |
          node - <<'NODE'
          const fs=require('node:fs'),assert=require('node:assert/strict');
          const q=require('./poc/src/skill_p2_32_research_queue.cjs');
          const x=JSON.parse(fs.readFileSync('p2-32-source-route-research-queue.json','utf8'));
          const b=JSON.parse(fs.readFileSync('p2-15-source-blocker-impact.json','utf8'));
          const s=JSON.parse(fs.readFileSync('p2-32-spec-conditional-omission.json','utf8'));
          assert.equal(x.status,q.STATUS);
          assert.equal(x.source.revision,s.source.revision);
          assert.equal(x.source.skillRegistrySha256,s.source.skillRegistrySha256);
          assert.equal(x.denominators.appSkills,881);
          assert.equal(x.denominators.sourceMatchedSkills,818);
          assert.equal(x.denominators.sourceUnavailableSkills,63);
          assert.equal(x.denominators.originalRouteFamilies,
           x.denominators.finiteCompatibleRouteFamilies+
           x.denominators.finiteExcludedRouteFamilies);
          assert.equal(x.denominators.sourceMatchedSkills,b.denominators.sourceMatchedSkills);
          assert.equal(x.denominators.completedSourceRouteEvaluations,0);
          assert.equal(x.denominators.actualAppliedOmissions,0);
          assert.equal(x.denominators.officialP3OrP4Ratings,0);
          assert(x.priorityRouteCandidates.length<=100);
          assert(x.initialP215Pilots.length>0&&x.initialP215Pilots.length<=7);
          assert.equal(new Set(x.initialP215Pilots.map(r=>r.sourceNumericId)).size,
           x.initialP215Pilots.length);
          assert(x.initialP215Pilots.every(r=>
           ['rank-source-join-first','event-state-pilot-next'].includes(r.researchGroup)&&
           r.noSourceRouteProven===true&&r.noFormalSuitability===true));
          assert(x.priorityRouteCandidates.every(r=>
           r.noCompleteSourceRouteClaim===true&&
           r.neverReadyForP3CardScoring===true&&
           r.finiteCompatibleStyles.length>0&&
           r.missingTypesOnlyIfFixedStateAssumptionsSatisfied<=
             r.missingTypesBeforeFixedState));
          const matched=x.rows.filter(r=>r.sourceNumericId!==null);
          assert.equal(matched.length,818);
          assert(x.nextTypeResearch.every(t=>
           t.countsArePotentialReviewScopeOnly===true));
          const total=Object.values(x.byResearchGroup)
           .reduce((n,v)=>n+v.routeFamilies,0);
          assert.equal(total,x.denominators.finiteCompatibleRouteFamilies);
          console.log('P2_32_SOURCE_ROUTE_FIXED='+JSON.stringify({
           denominators:x.denominators,
           groups:x.byResearchGroup,
           nextTypes:x.nextTypeResearch.slice(0,14),
           firstPilots:x.initialP215Pilots,
           topRoutes:x.priorityRouteCandidates.slice(0,10).map(r=>({
            id:r.sourceNumericId,invoke:r.invokeIndex,
            conditionOr:r.conditionOrIndex,
            preconditionOr:r.preconditionOrIndex,
            group:r.researchGroup,
            types:r.unverifiedTypes
           }))
          }));
          NODE
      - name: Validate prior P2.15 evidence reuse by original mechanism family
        run: |
          node - <<'NODE'
          const fs=require('node:fs'),assert=require('node:assert/strict');
          const m=require('./poc/src/skill_p2_32_mechanism_reuse.cjs');
          const x=JSON.parse(fs.readFileSync('p2-32-mechanism-reuse-families.json','utf8'));
          const q=JSON.parse(fs.readFileSync('p2-32-source-route-research-queue.json','utf8'));
          assert.equal(x.status,m.STATUS);
          assert.equal(x.source.revision,q.source.revision);
          assert.equal(x.source.skillRegistrySha256,q.source.skillRegistrySha256);
          assert.equal(x.denominators.appSkills,881);
          assert.equal(x.denominators.sourceMatchedSkills,818);
          assert.equal(x.denominators.sourceUnavailableSkills,63);
          assert.equal(x.denominators.sourceRouteFamilies,q.denominators.originalRouteFamilies);
          assert.equal(x.denominators.sourceRouteFamilies,970);
          assert.equal(x.mechanismFamilies.length,x.denominators.normalizedMechanismFamilies);
          assert.equal(x.mechanismFamilies.reduce((n,g)=>n+g.sourceRouteFamilies,0),970);
          assert(x.initialMechanismFamilyPilots.length<=7);
          assert(x.initialMechanismFamilyPilots.some(x=>
           x.selectedAs==='reuse-existing-mechanism-evidence'));
          assert(x.initialMechanismFamilyPilots.every(x=>[
           'reuse-existing-mechanism-evidence','inspect-unstudied-mechanism'
          ].includes(x.selectedAs)));
          assert(x.mechanismFamilies.every(g=>
            g.onlyMechanismAlgorithmReusable===true&&
            g.sourceThresholdsAndContextMustBeReevaluated===true&&
            g.noWholeSourceSkillTriggerInference===true&&
            g.noApprovedSuitabilityRating===true));
          assert.equal(x.denominators.sourceRouteWholeActivationProofs,0);
          assert.equal(x.denominators.actualAppliedOmissions,0);
          assert.equal(x.denominators.formalSkillCardSuitabilityRatings,0);
          const rank=x.previouslyStudiedTypeInventory.find(e=>e.type==='order_rate');
          const random=x.previouslyStudiedTypeInventory.find(e=>e.type==='phase_random');
          const corner=x.previouslyStudiedTypeInventory.find(e=>e.type==='corner');
          const cornerRandom=x.previouslyStudiedTypeInventory.find(e=>e.type==='corner_random');
          assert.equal(rank?.status,'selected-model-tick');
          assert.equal(random?.status,'geometry-counterfactual');
          assert.equal(corner?.status,'selected-model-tick');
          assert.equal(cornerRandom?.status,'no-specific-mechanism-evidence');
          for(const type of ['running_style','distance_type','ground_type','ground_condition'])
           assert.equal(x.previouslyStudiedTypeInventory.find(e=>e.type===type)?.status,
            'source-finite-eligibility');
          console.log('P2_32_REUSE_FIXED='+JSON.stringify({
           denominators:x.denominators,
           pilots:x.initialMechanismFamilyPilots,
           types:x.previouslyStudiedTypeInventory.map(e=>({type:e.type,status:e.status})),
           topFamilies:x.mechanismFamilies.slice(0,8).map(g=>({
            id:g.familyId,types:g.mechanismTypes,skills:g.distinctSourceSkills,
            numericParameterVariants:g.distinctExactNumericParameterSets,
            next:g.nextMechanismResearchAction
           }))
          }));
          NODE
      - name: Upload mechanism family evidence reuse and parameterization map (not source data)
        uses: actions/upload-artifact@v4
        with:
          name: p2-32-mechanism-family-reuse-not-skill-suitability
          path: p2-32-mechanism-reuse-families.json
          retention-days: 14
          if-no-files-found: error
      - name: Upload P2.32 route-specific research queue (not full skill ratings)
        uses: actions/upload-artifact@v4
        with:
          name: p2-32-source-route-pilot-priority-not-suitability
          path: p2-32-source-route-research-queue.json
          retention-days: 14
          if-no-files-found: error
      - name: Upload P2.32 source-positioned spec review (never scoring data)
        uses: actions/upload-artifact@v4
        with:
          name: p2-32-game-spec-conditional-omission-candidates
          path: p2-32-spec-conditional-omission.json
          retention-days: 14
          if-no-files-found: error
      - name: Upload source-exact rank-change predicate path audit
        uses: actions/upload-artifact@v4
        with:
          name: p2-change-order-source-predicate-cohort
          path: p2-change-order-source-paths.json
          retention-days: 14
      - name: Verify that every app skill gets a small review-only four-style summary
        run: |
          node - <<'NODE'
          const fs=require('node:fs'),assert=require('node:assert/strict');
          const x=JSON.parse(fs.readFileSync('p2-skill-coarse-four-style-review.json'));
          assert.equal(x.schemaVersion,1);
          assert.equal(x.status,'P2-rough-skill-by-skill-evidence-review-not-production-rating');
          assert.equal(x.appSkillCount,881);
          assert.equal(x.sourceMatchedSkills,818);
          assert.equal(x.skillCoverage.unavailable,63);
          assert.equal(x.modelScenario,'balanced-only');
          assert.equal(x.rows.length,881);
          assert.equal(new Set(x.rows.map(r=>r.skillId)).size,881);
          const status=new Set(['explicit-ineligible','four-style-direction',
           'partial-four-style-direction','two-group-reference',
           'race-global-only','held','unavailable']);
          for(const r of x.rows){
           assert.deepEqual(Object.keys(r.styles),x.styles);
           for(const name of x.styles){
            const v=r.styles[name];assert(status.has(v.status));
            assert(!Object.hasOwn(v,'probability'));
            assert(!Object.hasOwn(v,'cardScore'));
            if(v.status==='partial-four-style-direction'){
             assert(v.supportedRankBranches.length>0);
             assert(!Object.hasOwn(v,'modelTier'));
            }
           }
          }
          const total=Object.values(x.perStyleCounts).reduce((a,b)=>a+b,0);
          assert.equal(total,881*4);
          assert.equal(x.heldGapInventory.heldSkillCount,x.skillCoverage.held);
          assert.equal(x.heldGapInventory.status,'observed-features-of-held-skills-not-sole-causes');
          console.log('P2_HELD_SKILL_GAPS_START');
          console.log(JSON.stringify({heldSkillCount:x.heldGapInventory.heldSkillCount,
           topReviewBlockers:x.heldGapInventory.blockedReviewReasons.slice(0,15),
           topOriginalConditionTypes:x.heldGapInventory.sourceConditionTypesInHeldSkills.slice(0,20)},null,2));
          console.log('P2_HELD_SKILL_GAPS_END');
          console.log('P2_COARSE_SKILL_COVERAGE_START');
          console.log(JSON.stringify({perStyleCounts:x.perStyleCounts,
           skillCoverage:x.skillCoverage},null,2));
          console.log('P2_COARSE_SKILL_COVERAGE_END');
          NODE
      - name: Verify P2.15 exact-source AND/OR and precondition paths (no model rating)
        run: |
          node - <<'NODE'
          const fs=require('node:fs'),assert=require('node:assert/strict');
          const x=JSON.parse(fs.readFileSync('p2-15-full-condition-paths.json','utf8'));
          assert.equal(x.schemaVersion,1);
          assert.equal(x.status,'p2-15-full-source-path-necessary-gate-audit-only');
          assert.equal(x.modelScenario,'no-simulation-performed');
          assert.equal(x.denominators.appSkills,881);
          assert.equal(x.denominators.sourceMatched,818);
          assert.equal(x.denominators.unavailable,63);
          assert.equal(x.rows.length,881);
          assert.equal(new Set(x.rows.map(r=>r.skillId)).size,881);
          assert.equal(x.denominators.reportedStylePathCells,
            x.denominators.reportedPathRows*4);
          const expectedStyles=['逃げ','先行','差し','追込'];
          for(const r of x.rows)if(r.status!=='source-unavailable'){
            assert.deepEqual(Object.keys(r.byStyle),expectedStyles);
            assert.equal(r.paths.length,r.paths.filter(p=>p.orIndex!==null).length+
              r.emptyConditionInvokes);
            for(const p of r.paths){
              assert.deepEqual(Object.keys(p.byStyle),expectedStyles);
              assert(!Object.hasOwn(p,'activationProbability'));
              assert(!Object.hasOwn(p,'cardScore'));
            }
            assert(!Object.hasOwn(r,'skillFitScore'));
          }
          assert.equal(x.boundaries.some(s=>s.includes('no contradiction')),true);
          console.log('P2_15_VALIDATED_PATHS='+JSON.stringify({
            denominators:x.denominators,shape:x.shape,byStyles:x.byStyles,
            unverifiedTypes:x.sourceConditionTypesOnNonExcludedPaths.slice(0,16),
            preconditionTypes:x.typesInPreconditions.slice(0,16)}));
          NODE
      - name: Archive P2.15 bounded source-path numeric facts only
        uses: actions/upload-artifact@v4
        with:
          name: p2-15-complete-source-path-gate-audit-not-ratings
          path: p2-15-full-condition-paths.json
          retention-days: 14
          if-no-files-found: error
      - name: Count researchable half-phase rank cases without assigning suitability
        run: |
          node - <<'NODE'
          const fs=require('node:fs'),assert=require('node:assert/strict');
          const x=JSON.parse(fs.readFileSync('p2-halfphase-feasibility.json'));
