name: One-time skill activation condition inventory

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'poc/src/skill_condition_inventory.cjs'
      - 'poc/src/skill_condition_research_triage.cjs'
      - 'poc/src/skill_condition_mixed_cohort.cjs'
      - 'poc/src/skill_coarse_style_review.cjs'
      - 'poc/tests/skill_coarse_style_review.test.cjs'
      - 'poc/src/skill_change_order_source_paths.cjs'
      - 'poc/tests/skill_change_order_source_paths.test.cjs'
      - 'poc/src/skill_rank_corner_source_cohort.cjs'
      - 'poc/tests/skill_rank_corner_source_cohort.test.cjs'
      - 'poc/tests/skill_condition_mixed_cohort.test.cjs'
      - 'poc/tests/skill_condition_research_triage.test.cjs'
      - 'poc/tools/audit_skill_conditions.cjs'
      - 'poc/tests/skill_condition_inventory.test.cjs'
      - 'poc/src/skill_condition_tags.js'
      - 'poc/src/skill_condition_profiles.js'
      - 'poc/tests/skill_condition_profiles.test.cjs'
      - 'poc/src/skill_condition_combinations.cjs'
      - 'poc/tests/skill_condition_combinations.test.cjs'
      - 'poc/src/skill_rank_timing.js'
      - 'poc/src/skill_rank_timing_audit.cjs'
      - 'poc/tests/skill_rank_timing.test.cjs'
      - 'poc/tests/skill_rank_timing_audit.test.cjs'
      - 'poc/src/skill_style_tendency.js'
      - 'poc/tests/skill_style_tendency.test.cjs'
      - 'poc/src/skill_style_review.cjs'
      - 'poc/tests/skill_style_review.test.cjs'
      - 'poc/live.html'
      - 'poc/tests/browser_skill_smoke.cjs'
      - '.github/workflows/skill-condition-inventory.yml'

permissions:
  contents: read

jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test P0 inventory and P1 activation profiles against synthetic predicates
        run: |
          node --check poc/src/skill_condition_inventory.cjs
          node --check poc/src/skill_condition_research_triage.cjs
          node --check poc/src/skill_coarse_style_review.cjs
          node --check poc/src/skill_condition_mixed_cohort.cjs
          node --check poc/src/skill_change_order_source_paths.cjs
          node --check poc/src/skill_rank_corner_source_cohort.cjs
          node --check poc/src/skill_condition_tags.js
          node --check poc/src/skill_condition_profiles.js
          node --check poc/tools/audit_skill_conditions.cjs
          node --check poc/src/skill_condition_combinations.cjs
          node --check poc/src/skill_rank_timing.js
          node --check poc/src/skill_rank_timing_audit.cjs
          node --check poc/src/skill_style_tendency.js
          node --check poc/src/skill_style_review.cjs
          node --test poc/tests/skill_condition_research_triage.test.cjs
          node --test poc/tests/skill_coarse_style_review.test.cjs
          node --test poc/tests/skill_condition_mixed_cohort.test.cjs
          node --test poc/tests/skill_change_order_source_paths.test.cjs
          node --test poc/tests/skill_rank_corner_source_cohort.test.cjs
          node --test poc/tests/skill_condition_inventory.test.cjs poc/tests/skill_condition_profiles.test.cjs poc/tests/skill_condition_combinations.test.cjs poc/tests/skill_rank_timing.test.cjs poc/tests/skill_rank_timing_audit.test.cjs poc/tests/skill_style_tendency.test.cjs poc/tests/skill_style_review.test.cjs
      - name: Audit pinned skill registry and current published app model
        env:
          UMASIM_REVISION: f6e4501ee6c6c2d4ac8698e7796e309d31575bde
        run: node poc/tools/audit_skill_conditions.cjs
      - name: Check fixed-cohort research triage completeness without promoting suitability
        run: |
          node - <<'NODE'
          const fs=require('node:fs'),assert=require('node:assert/strict');
          const x=JSON.parse(fs.readFileSync('p2-condition-research-triage.json'));
          assert.equal(x.schemaVersion,1);
          assert.equal(x.status,'P2-condition-type-research-triage-not-skill-or-card-suitability');
          assert.equal(x.summary.totalSourceTypes,125);
          assert.equal(x.summary.appMatchedTypes,90);
          assert.equal(x.summary.appMatchedSkillRecords,818);
          assert.equal(x.summary.noAutomaticStyleLabels,true);
          assert.equal(x.summary.noAutomaticUniversalStyleInferences,true);
          assert.equal(x.summary.skillEffectUtility,'future-extension-only');
          assert.equal(x.byType.length,125);
          assert(x.byType.every(t=>Number.isSafeInteger(t.appMatchedSkills) &&
            t.appMatchedSkills>=0&&typeof t.group==='string'));
          console.log('P2 condition research triage complete:',JSON.stringify(x.summary,null,2));
          NODE
      - name: Verify actual mixed rank/deferred source-path population
        run: |
          node - <<'NODE'
          const fs=require('node:fs'),assert=require('node:assert/strict');
          const a=JSON.parse(fs.readFileSync('p2-mixed-rank-deferred-audit.json'));
          assert.equal(a.schemaVersion,1);
          assert.equal(a.mixedSkills,17);
          assert.equal(a.sourceDenominator,818);
          assert.equal(a.cases.length,17);
          assert.equal(new Set(a.cases.map(x=>x.sourceNumericId)).size,17);
          assert.equal(a.byRelation.sameAnd+a.byRelation.sameInvokeOnlyWithoutSameAnd+
            a.byRelation.differentInvokeOnly,17);
          assert(a.cases.every(x=>x.disposition==='hold-whole-skill-style-suitability'));
          console.log(JSON.stringify({status:a.status,
            mixedSkills:a.mixedSkills,byRelation:a.byRelation,
            byDeferredType:a.byDeferredType},null,2));
          NODE
      - name: Validate fixed absolute-order and corner-rank source study cohort
        run: |
          node - <<'NODE'
          const fs=require('node:fs'),assert=require('node:assert/strict');
          const p=JSON.parse(fs.readFileSync('p2-rank-corner-source-cohort.json'));
          assert.equal(p.schemaVersion,1);
          assert.equal(p.sourceRecords,818);
          assert.equal(p.summary.absoluteOrder.distinctSkills,34);
          assert.equal(p.summary.cornerRank.distinctSkills,13);
          assert.equal(p.summary.noFullSkillRatings,true);
          assert(p.paths.every(x=>x.fullyModeledSkill===false));
          console.log(JSON.stringify(p.summary,null,2));
          NODE
      - name: Verify pinned change_order_onetime source-path structure
        run: |
          node - <<'NODE'
          const fs=require('node:fs'),assert=require('node:assert/strict');
          const p=JSON.parse(fs.readFileSync('p2-change-order-source-paths.json'));
          assert.equal(p.schemaVersion,1);
          assert.equal(p.status,'P2-source-change-order-path-structure-not-complete-proc');
          assert.equal(p.matchedSkillDenominator,818);
          assert.equal(p.summary.sourceSkills,30);
          assert(p.summary.sourceAndPaths>=30);
          assert(p.paths.every(x=>x.fullSkillEvaluated===false));
          assert.equal(new Set(p.paths.map(x=>x.sourceNumericId)).size,30);
          console.log('P2_CHANGE_ORDER_PATH_REPORT_START');
          console.log(JSON.stringify(p.summary,null,2));
          console.log('P2_CHANGE_ORDER_PATH_REPORT_END');
          NODE
      - name: Upload source-exact rank-change predicate path audit
        uses: actions/upload-artifact@v4
        with:
          name: p2-change-order-source-predicate-cohort
          path: p2-change-order-source-paths.json
          retention-days: 14
      - name: Verify that every app skill gets a small review-only four-style summary
        run: |
          node - <<'NODE'
          const fs=require('node:fs'),assert=require('node:assert/strict');
          const x=JSON.parse(fs.readFileSync('p2-skill-coarse-four-style-review.json'));
          assert.equal(x.schemaVersion,1);
          assert.equal(x.status,'P2-rough-skill-by-skill-evidence-review-not-production-rating');
          assert.equal(x.appSkillCount,881);
          assert.equal(x.sourceMatchedSkills,818);
          assert.equal(x.skillCoverage.unavailable,63);
          assert.equal(x.modelScenario,'balanced-only');
          assert.equal(x.rows.length,881);
          assert.equal(new Set(x.rows.map(r=>r.skillId)).size,881);
          const status=new Set(['explicit-ineligible','four-style-direction',
           'partial-four-style-direction','two-group-reference',
           'race-global-only','held','unavailable']);
          for(const r of x.rows){
           assert.deepEqual(Object.keys(r.styles),x.styles);
           for(const name of x.styles){
            const v=r.styles[name];assert(status.has(v.status));
            assert(!Object.hasOwn(v,'probability'));
            assert(!Object.hasOwn(v,'cardScore'));
            if(v.status==='partial-four-style-direction'){
             assert(v.supportedRankBranches.length>0);
             assert(!Object.hasOwn(v,'modelTier'));
            }
           }
          }
          const total=Object.values(x.perStyleCounts).reduce((a,b)=>a+b,0);
          assert.equal(total,881*4);
          console.log('P2_COARSE_SKILL_COVERAGE_START');
          console.log(JSON.stringify({perStyleCounts:x.perStyleCounts,
           skillCoverage:x.skillCoverage},null,2));
          console.log('P2_COARSE_SKILL_COVERAGE_END');
          NODE
      - name: Keep derived four-style skill review for inspection, not production
        uses: actions/upload-artifact@v4
        with:
          name: p2-coarse-four-style-skill-review-not-product
          path: p2-skill-coarse-four-style-review.json
          retention-days: 14
          if-no-files-found: error
      - name: Upload bounded source-verified P2 rank/corner candidate cohort
        uses: actions/upload-artifact@v4
        with:
          name: p2-rank-corner-source-cohort
          path: p2-rank-corner-source-cohort.json
          retention-days: 14
      - name: Upload read-only P2 mixed rank/deferred cohort audit
        uses: actions/upload-artifact@v4
        with:
          name: p2-mixed-rank-deferred-cohort
          path: p2-mixed-rank-deferred-audit.json
          retention-days: 14
      - name: Upload bounded P2 condition research triage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p2-condition-research-triage
          path: p2-condition-research-triage.json
          retention-days: 14
          if-no-files-found: ignore
      - name: Upload inventory report without source skill data
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: skill-condition-inventory
          path: skill-condition-inventory-audit.json
          if-no-files-found: ignore
