name: One-time D070 approved append payload
on:
  pull_request:
    types: [opened]
    branches: [main]
    paths:
      - '.github/workflows/one-time-d070-release-payload.yml'
permissions:
  contents: read
concurrency:
  group: gametora-direct-new-card-limited-read
  cancel-in-progress: false
jobs:
  probe:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'release/d070-azuma-json-payload'
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test poc/tests/official_gametora_card_json.test.cjs poc/tests/d070_azuma_json_outing_review.test.cjs
      - name: Download pinned independent UmaSim registry
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --max-time 30 'https://raw.githubusercontent.com/mee1080/umasim/e9bb2939ba117ea93e556790c353ed3edec27eab/data/skill_data.txt' -o "$RUNNER_TEMP/skills.txt"
          curl --fail --silent --show-error --max-time 30 'https://raw.githubusercontent.com/mee1080/umasim/e9bb2939ba117ea93e556790c353ed3edec27eab/data/support_card.txt' -o "$RUNNER_TEMP/cards.txt"
          curl --fail --silent --show-error --max-time 30 'https://raw.githubusercontent.com/mee1080/umasim/91952973eb334ae530b8cd76541bce8a01a141cd/data/support_card.txt' -o "$RUNNER_TEMP/before.txt"
          curl --fail --silent --show-error --max-time 30 'https://raw.githubusercontent.com/mee1080/umasim/cf9366f6a487bd8f197b53d8a11981207beb9f6c/data/skill_data.txt' -o "$RUNNER_TEMP/historical.txt"
      - run: node poc/tools/probe_d070_named_azuma_once.cjs "$RUNNER_TEMP/skills.txt" "$RUNNER_TEMP/cards.txt" "$RUNNER_TEMP/before.txt" "$RUNNER_TEMP/historical.txt"
