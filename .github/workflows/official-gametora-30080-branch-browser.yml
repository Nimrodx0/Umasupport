name: Observe original GameTora 30080 three-choice branch
on:
  pull_request:
    paths:
      - '.github/workflows/official-gametora-30080-branch-browser.yml'
      - 'poc/src/official_gametora_rendered_branch_topology.cjs'
      - 'poc/src/official_gametora_old_numeric_route_parity.cjs'
      - 'poc/tests/official_gametora_old_numeric_route_parity.test.cjs'
      - 'poc/tests/official_gametora_rendered_branch_topology.test.cjs'
      - 'poc/tools/probe_official_gametora_30080_branch.cjs'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  limited-30080-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify conservative choice/outcome distinction
        run: |
          node --check poc/src/official_gametora_rendered_branch_topology.cjs
          node --check poc/tools/probe_official_gametora_30080_branch.cjs
          node --test poc/tests/official_gametora_rendered_branch_topology.test.cjs
          node --check poc/src/official_gametora_old_numeric_route_parity.cjs
          node --test poc/tests/official_gametora_old_numeric_route_parity.test.cjs
      - name: Use installed Chrome and Playwright
        run: |
          npm install --no-save --no-package-lock playwright@1.55.1
          command -v google-chrome || command -v google-chrome-stable
      - name: Download exactly one pinned immutable old card
        shell: bash
        run: |
          curl --fail --silent --show-error --location --retry 1 --max-time 30 \
            'https://raw.githubusercontent.com/systemless10/UmamusumePS/6e38b54af4fad397ff4491e63007a90705a4fe67/server/data/events/gametora/support_30080.json' \
            -o "$RUNNER_TEMP/gt-old-30080.json"
      - name: Inspect one named event panel on the original GameTora website
        shell: bash
        run: |
          node poc/tools/probe_official_gametora_30080_branch.cjs \
            --live-30080 "$RUNNER_TEMP/gt-old-30080.json"
