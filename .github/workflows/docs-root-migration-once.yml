name: One-off reorganize docs root by responsibility
on:
  push:
    branches:
      - docs/reorganize-navigation-and-phase-plans-20261110
    paths:
      - .github/workflows/docs-root-migration-once.yml
      - poc/tools/audit_doc_reorg.cjs

permissions:
  contents: write

jobs:
  reorganize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Reorganize canonical documents and all references
        run: |
          node --check poc/tools/migrate_docs_root_once_20261110.cjs
          node poc/tools/migrate_docs_root_once_20261110.cjs
          git add -A -- docs README.md AGENTS.md poc .github/workflows
      - name: Assert root isolation, local links, document preservation and tracking
        run: |
          node --test poc/tests/handoff_quality.test.cjs poc/tests/documentation_policy.test.cjs
          node poc/tools/audit_doc_reorg.cjs --strict
          node poc/tools/check_project_tracking.cjs
          git diff --cached --check
      - name: Commit data-safe Markdown reorganization
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs README.md AGENTS.md poc .github/workflows
          git commit -m "docs: place all canonical documents in purpose-based folders"
          git push origin HEAD:docs/reorganize-navigation-and-phase-plans-20261110
