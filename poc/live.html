<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Uma Support Lab | 外部データ直接読込PoC</title><link rel="stylesheet" href="./src/style.css"></head>
<body><div id="bootstrap-status" role="status" style="max-width:1100px;margin:30px auto;padding:16px;background:#eee;color:#222;border-radius:10px">公開元のサポートカードデータを確認しています…</div>
<div id="app"></div>
<script src="./src/core.js"></script><script src="./src/deck_events.js"></script><script src="./src/skill_table.js"></script><script src="./src/card_search.js"></script><script src="./src/live_loader.js"></script><script src="./src/skill_hierarchy.js"></script><script src="./src/skill_bridge.js"></script><script src="./src/settings.js"></script><script src="./src/source_health.js"></script>
<script src="./src/event_schema.js"></script><script src="./src/public_event_catalog.js"></script>
<script src="./src/community_candidate_preview.js"></script><script src="./src/checker_choice_fact_preview.js"></script><script src="./src/checker_result_preview.js"></script><script src="./src/event_preview_loader.js"></script><script src="./src/private_local_event_preview.js"></script>
<script>
(async function(){
 const status=document.getElementById('bootstrap-status');
 try {
   const result=await UmaLiveLoader.load();
   window.UmaDemoData=UmaLiveLoader.buildModel(result.text,result);
   window.UmaDemoData.meta.runtimeSources={
     cards:{mode:result.mode,url:UmaLiveLoader.SOURCE_URL,fetchedAt:result.fetchedAt||null,checkedAt:result.checkedAt||null},
     skills:{mode:'unavailable',url:UmaSkillBridge.SOURCE_URL,fetchedAt:null},
     events:{mode:'unknown',url:UmaPublicEventCatalog.URL}
   };
   let msg=result.mode==='cached'?'公開元を取得できなかったため、保存済みデータを利用中':'公開元のデータを取得しました';
   // Skill data is independent of events and is needed for complete goal selection.
   let skillText=null;
   try {
     const skillSource=await UmaSkillBridge.load();
     skillText=skillSource.text;
     window.UmaDemoData.meta.runtimeSources.skills={mode:skillSource.mode,url:UmaSkillBridge.SOURCE_URL,fetchedAt:skillSource.fetchedAt||null};
     if(skillSource.mode==='cached')msg+='。スキル辞書は保存済み版を使用';
   } catch(skillError) {
     console.warn('スキル辞書を取得できません',skillError);
     msg+='。金白対応データは未取得（通常ヒントは利用できます）';
   }
   try {
     const source=await UmaPublicEventCatalog.loadVerified({
       model:window.UmaDemoData,skillText});
     const summary=UmaPublicEventCatalog.attach(window.UmaDemoData,source.catalog,
       {skillText,fullRegistry:!!skillText});
     window.UmaDemoData.meta.runtimeSources.events={
       mode:source.mode==='cached'?'cached':'reviewed',
       url:UmaPublicEventCatalog.URL,
       fetchedAt:source.fetchedAt||null,checkedAt:source.checkedAt||null
     };
     msg+=source.mode==='cached'?'。レビュー済みイベントは保存済み検証版を使用':
       '。レビュー済みイベントを公開JSONから取得';
     msg+=' '+summary.eventsWithRecords+'件';
     const hierarchy=window.UmaDemoData.meta.skillHierarchy;
     if(hierarchy)msg+='。金白構造候補 '+hierarchy.linked+'/'+hierarchy.totalRare+'組（白なし '+hierarchy.withoutLower+'、未確定 '+hierarchy.unresolved+'）';
   } catch(eventError) {
     // The reviewed event catalog and the skill hierarchy are independent.
     // Even when event JSON is unavailable, retain verified skill relationships.
     console.warn('公開イベントJSONを検証できません',eventError);
     msg+='。イベントデータの検証に失敗したため実イベントは反映しません';
     window.UmaDemoData.meta.runtimeSources.events.mode='failed';
     try {
       UmaPublicEventCatalog.attach(window.UmaDemoData,{schemaVersion:1,cards:[]},
         {skillText,fullRegistry:!!skillText});
       const hierarchy=window.UmaDemoData.meta.skillHierarchy;
       if(hierarchy)msg+='。金白構造候補 '+hierarchy.linked+'/'+hierarchy.totalRare+
         '組（白なし '+hierarchy.withoutLower+'、未確定 '+hierarchy.unresolved+'）';
       // The optional empty fallback does NOT establish that the public JSON was valid.
       window.UmaDemoData.meta.eventStatus='unavailable';
     }catch(hierarchyError){
       console.warn('イベント障害後のスキル辞書検証にも失敗しました',hierarchyError);
       msg+='。金白対応データを表示できません';
     }
   }
   const startApp=()=>{
     const script=document.createElement('script');script.src='./src/live_app.js';
     script.onerror=()=>{status.textContent='画面の起動に失敗しました。';};
     document.body.appendChild(script);
   };
   // Candidate catalog is never loaded unless an explicit URL parameter requests it.
   const previewId=UmaDevEventPreview.requested(window.location.search);
   window.UmaPreviewRequested=previewId;
   window.UmaPreviewActive=false;
   if(previewId==='local'){
     // Local files NEVER enter public event cache, localStorage or the site.
     // Stay at the file chooser until the complete 2,512-event bundle passes
     // the same runtime preflight used by the fixed offline pipeline.
     status.textContent=msg+'。非公開イベントを読み込むにはローカルJSONを選択してください。';
     status.dataset.mode=result.mode;
     const panel=document.createElement('section');
     panel.id='private-local-import-panel';
     panel.setAttribute('role','region');
     panel.setAttribute('aria-label','ローカルイベント一括読込');
     panel.style.cssText='max-width:1100px;margin:10px auto;padding:20px;border:1px solid #999;border-radius:10px';
     const label=document.createElement('label');
     label.textContent='非公開イベントJSON（2,512件）を選択：';
     const input=document.createElement('input');
     input.id='private-local-event-file';input.type='file';
     input.accept='.json,application/json';
     const feedback=document.createElement('p');feedback.id='private-local-import-feedback';
     feedback.setAttribute('role','status');
     feedback.textContent='選択したファイルはこのブラウザ内でのみ解析します。サーバーへアップロードしません。公開承認済みのデータではありません。';
     label.appendChild(input);
     panel.append(label,feedback);
     status.insertAdjacentElement('afterend',panel);
     input.addEventListener('change',async()=>{
       const file=input.files?.[0];if(!file)return;
       input.disabled=true;feedback.textContent='全件のID・分岐・ハッシュを検証しています…';
       try{
         const local=await UmaPrivateLocalEventPreview.activate(window.UmaDemoData,{
           text:await file.text(),skillText});
         window.UmaPreviewActive=true;
         window.UmaPrivateLocalEventDigest=local.catalogSha256;
         panel.remove();
         status.textContent=msg+'。【ローカル非公開試用】'+local.records+
          'イベント / '+local.cards+'カードを一括読込。正式公開済み0件。';
         startApp();
       }catch(err){
         console.warn('ローカル非公開イベントの一括読込を拒否',err);
         feedback.textContent='読込を拒否しました。'+String(err.message||err);
         input.value='';input.disabled=false;
       }
     });
     return;
   }
   if(previewId){
     try {
       const candidate=await UmaDevEventPreview.activate(window.UmaDemoData,{cardId:previewId,skillText});
       window.UmaPreviewActive=true;
       msg+='。【試用モード】未承認イベント候補 '+candidate.records+'件 / '+candidate.cards+'枚を反映（保存設定は通常版と分離）';
     }catch(previewError){
       console.warn('試用イベントは適用しません',previewError);
       window.UmaDemoData.meta.previewError=String(previewError.message||previewError);
       if(window.UmaDemoData.meta.runtimeSources.events.mode==='reviewed')
         window.UmaDemoData.meta.runtimeSources.events.mode='preview-failed';
       msg+='。試用イベントは適用されませんでした: '+window.UmaDemoData.meta.previewError;
     }
   }
   status.textContent=msg+'。カード '+window.UmaDemoData.cards.length+'枚。'+(result.fetchedAt?'データ取得: '+result.fetchedAt:'');
   status.dataset.mode=result.mode;
   startApp();
 }catch(err){status.textContent=String(err.message||err)+'。接続状況をご確認ください。';status.dataset.mode='error';}
})();
</script>
</body></html>
